<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>At the Table</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
    --palatino:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:#1B1F24}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  input,textarea{font:inherit;color:inherit}
  ul,ol{padding-left:1.2em} li{margin:6px 0} p{margin:0}

  /* ---------- theme tokens: one set per game ---------- */
  .app{--bg:#F1EEE8;--fg:#1E2124;--fg2:#6B6F73;--card:#FBFAF7;--line:rgba(30,33,36,.14);--line2:rgba(30,33,36,.34);--accent:#1E2124;--accent-fg:#fff;--display:var(--serif);--radius:16px;
       background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh;height:100dvh}
  .app[data-mode=home]{--bg:#1B1F24;--fg:#F3F1EC;--fg2:#A8ADB3;--card:#242A31;--line:rgba(243,241,236,.12);--line2:rgba(243,241,236,.34);--accent:#F3F1EC;--accent-fg:#1B1F24;--display:var(--serif)}
  .app[data-mode=fs]{--bg:#F5F0EB;--fg:#2D2D2D;--fg2:#6B6B6B;--card:#FBF8F3;--line:rgba(45,45,45,.14);--line2:rgba(45,45,45,.28);--accent:#1B2A4A;--accent-fg:#fff;--display:var(--serif);
       --cream:#F5F0EB;--paper:#FFFFFF;--navy:#1B2A4A;--gold:#A0824E;--gold-l:#C4A96A;--ink:#2D2D2D;--ink-2:#6B6B6B;--ink-3:#9A9A9A;--red:#9B2C2C;--seat:#1B2A4A;--tint:#E8EBF1}
  .app[data-mode=gen]{--bg:#123A2C;--fg:#F3EBD8;--fg2:#B7C6B5;--card:#1B4A39;--line:rgba(243,235,216,.16);--line2:rgba(243,235,216,.42);--accent:#C9A24A;--accent-fg:#123A2C;--display:var(--serif)}
  .app[data-mode=call]{--bg:#0F1216;--fg:#EDEFF2;--fg2:#8A919A;--card:#181D23;--line:rgba(237,239,242,.12);--line2:rgba(237,239,242,.32);--accent:#31C48D;--accent-fg:#0F1216;--display:var(--sans)}
  .app[data-mode=ic]{--bg:#E9ECEF;--fg:#22262A;--fg2:#5F666D;--card:#FFFFFF;--line:rgba(34,38,42,.14);--line2:rgba(34,38,42,.34);--accent:#1F4FBF;--accent-fg:#fff;--display:var(--sans);--radius:8px}
  .app[data-mode=grant]{--bg:#E7DCC3;--fg:#3B2A1A;--fg2:#7A6650;--card:#F4EBD6;--line:rgba(59,42,26,.16);--line2:rgba(59,42,26,.42);--accent:#B03A2E;--accent-fg:#fff;--display:var(--palatino);--radius:6px}
  .app[data-mode=auction]{--bg:#2E1B33;--fg:#F6EFE6;--fg2:#C4B3C8;--card:#3C2744;--line:rgba(246,239,230,.14);--line2:rgba(246,239,230,.42);--accent:#F2C230;--accent-fg:#2E1B33;--display:var(--sans)}
  .app[data-mode=buyout]{--bg:#FBFBF8;--fg:#1E2430;--fg2:#6A7280;--card:#FFFFFF;--line:rgba(30,36,48,.16);--line2:rgba(30,36,48,.42);--accent:#2B3A67;--accent-fg:#fff;--display:var(--serif);--radius:4px}
  .app[data-mode=founder]{--bg:#221912;--fg:#F1E4CC;--fg2:#B39E7E;--card:#2C2119;--line:rgba(241,228,204,.14);--line2:rgba(241,228,204,.42);--accent:#E0B05C;--accent-fg:#221912;--display:var(--palatino)}

  /* ---------- shared chrome ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px;padding:10px 28px;border-bottom:.5px solid var(--line);background:var(--bg)}
  .bar .left{display:flex;align-items:center;gap:12px;min-width:200px}
  .brand{font-family:var(--display);font-size:20px;color:var(--fg)}
  .tbl{color:var(--fg2);font-size:14px}
  .mid{display:flex;align-items:center;gap:10px}
  .tools{display:flex;gap:8px;min-width:200px;justify-content:flex-end}
  .tool{padding:9px 14px;border-radius:999px;border:.5px solid var(--line2);font-size:14px;background:var(--card);color:var(--fg);text-align:center;white-space:nowrap}
  .tool.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  main.stage{flex:1;overflow:auto;padding:28px 32px 44px;-webkit-overflow-scrolling:touch}
  .wrap{max-width:1180px;margin:0 auto}
  .narrow{max-width:760px;margin:0 auto}
  footer.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 32px calc(14px + env(safe-area-inset-bottom));border-top:.5px solid var(--line);background:var(--bg)}
  footer.actions:empty{display:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:14px;font-size:17px;font-weight:500;background:var(--accent);color:var(--accent-fg);transition:transform .12s ease,opacity .2s;text-align:center}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.38;pointer-events:none}
  .btn.ghost{background:transparent;color:var(--fg);border:.5px solid var(--line2)}
  .btn.line{background:var(--card);color:var(--fg);border:.5px solid var(--line2)}
  .btn.sm{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}
  .btn.danger{background:#B03A2E;color:#fff}

  .display{font-family:var(--display);font-weight:400;font-size:46px;line-height:1.08;letter-spacing:-.01em;color:var(--fg)}
  .display.xl{font-size:64px;line-height:1.02}
  h3{font-size:17px;font-weight:500;color:var(--fg);margin-bottom:10px}
  .kicker{font-size:14px;color:var(--accent);font-weight:500;margin-bottom:8px}
  .muted{color:var(--fg2)} .small{font-size:14px} .gap{margin-top:14px} .top{margin-top:26px}
  .lede{font-size:19px;line-height:1.55;max-width:62ch}
  .center{justify-content:center;text-align:center} .between{justify-content:space-between;align-items:flex-start}
  .lbl{font-size:13px;color:var(--fg2);margin:12px 0 6px}
  .panel{background:var(--card);border:.5px solid var(--line);border-radius:var(--radius);padding:22px 24px}
  .paper{background:var(--card);border:.5px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:18px 20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input.field,textarea.field{width:100%;min-height:54px;padding:13px 16px;border-radius:12px;border:.5px solid var(--line2);background:var(--card);color:var(--fg);font-size:17px;outline:none;margin-top:8px}
  input.field:focus,textarea.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  textarea.field{min-height:100px;resize:vertical;line-height:1.5}
  .toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:.5px solid var(--line2);background:var(--card);font-size:15px;color:var(--fg);text-align:center}
  .chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .chip[disabled]{opacity:.5}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg .opt{flex:1;min-width:120px;min-height:54px;padding:8px 14px;border-radius:12px;border:.5px solid var(--line2);background:var(--card);font-size:15px;line-height:1.3;display:flex;flex-direction:column;justify-content:center}
  .seg .opt small{font-size:12.5px;color:var(--fg2)}
  .seg .opt.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .seg .opt.on small{color:var(--accent-fg);opacity:.8}
  .optrow{width:100%;min-height:54px;padding:12px 16px;border-radius:12px;border:.5px solid var(--line2);background:var(--card);font-size:16px}
  .optrow.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .ai-box{margin-top:14px;background:var(--card);border:.5px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px}
  .ai-box .src{font-family:var(--display);font-size:18px;color:var(--accent);margin-bottom:10px}
  .sample{display:inline-block;font-size:12px;color:var(--fg2);border:.5px dashed var(--line2);border-radius:999px;padding:2px 10px;margin-bottom:10px}
  .loading .d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1s infinite}
  .loading .d:nth-child(2){animation-delay:.2s}.loading .d:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .timer{display:flex;flex-direction:column;align-items:center;gap:10px}
  .timer svg{width:150px;height:150px}
  .preset{padding:6px 12px;border-radius:999px;border:.5px solid var(--line2);font-size:13px;color:var(--fg2);background:var(--card)}
  .preset.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .notice{padding:12px 16px;border-radius:12px;border:.5px solid var(--line2);background:var(--card);font-size:15px}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}.scrim.on{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--bg);color:var(--fg);border-left:.5px solid var(--line);transform:translateX(102%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:.5px solid var(--line)}
  .drawer .dh b{font-family:var(--display);font-weight:400;font-size:20px}
  .drawer .db{padding:20px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
  .nb{margin-top:14px;padding-top:14px;border-top:.5px solid var(--line)}
  .nb b{font-weight:500;display:block;margin-bottom:4px}
  .nb.settings{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(0,0,0,.42);padding:20px}
  .modal.on{display:flex}
  .modal .box{width:min(560px,100%);background:var(--bg);color:var(--fg);border-radius:20px;padding:28px;border-top:6px solid var(--accent)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70;display:none}

  /* ---------- home ---------- */
  .home .display{font-size:72px;line-height:1}
  .home .sub{font-size:20px;color:var(--fg2);margin-top:14px;max-width:44ch}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
  .tile{position:relative;min-height:190px;border-radius:18px;padding:20px 20px 18px;display:flex;flex-direction:column;overflow:hidden;color:var(--tfg);background:var(--tbg);border:.5px solid rgba(255,255,255,.08);transition:transform .15s ease}
  .tile:active{transform:scale(.98)}
  .tile .tn{font-family:var(--tfont);font-size:26px;line-height:1.1}
  .tile .tt{font-size:14px;line-height:1.45;margin-top:8px;opacity:.85}
  .tile .tm{margin-top:auto;padding-top:14px;font-size:12.5px;opacity:.75}
  .tile .tk{position:absolute;top:14px;right:16px;font-size:12px;opacity:.7}
  .tile.t-fs{--tbg:#F5F0EB;--tfg:#1B2A4A;--tfont:var(--serif);font-style:normal} .tile.t-fs .tn{font-style:italic}
  .tile.t-gen{--tbg:#123A2C;--tfg:#F3EBD8;--tfont:var(--serif)}
  .tile.t-call{--tbg:#0F1216;--tfg:#31C48D;--tfont:var(--sans)}
  .tile.t-ic{--tbg:#E9ECEF;--tfg:#1F4FBF;--tfont:var(--sans)}
  .tile.t-grant{--tbg:#E7DCC3;--tfg:#3B2A1A;--tfont:var(--palatino)}
  .tile.t-auction{--tbg:#2E1B33;--tfg:#F2C230;--tfont:var(--sans)}
  .tile.t-buyout{--tbg:#FBFBF8;--tfg:#2B3A67;--tfont:var(--serif)}
  .tile.t-founder{--tbg:#221912;--tfg:#E0B05C;--tfont:var(--palatino)}
  .tile .tn{font-weight:600}
  .tile.t-fs .tn,.tile.t-gen .tn,.tile.t-grant .tn,.tile.t-buyout .tn,.tile.t-founder .tn{font-weight:400}
  .setup-players{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pl{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--card);border:.5px solid var(--line2);font-size:15px}
  .pl button{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:14px;text-align:center}

  @media (max-width:980px){ .tiles{grid-template-columns:repeat(2,1fr)} .grid2,.grid3{grid-template-columns:1fr} .bar .left,.tools{min-width:0} }
  @media (max-width:640px){ main.stage{padding:20px 16px 36px} footer.actions{padding-left:16px;padding-right:16px} .bar{padding:10px 16px} .tiles{grid-template-columns:1fr} .home .display{font-size:46px} .display{font-size:34px} .display.xl{font-size:42px} .tbl{display:none} .brand{font-size:17px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

  /* ---------- Three Generations: felt, ledger, brass ---------- */
  [data-mode=gen] .gen-dials{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  [data-mode=gen] .dial{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:18px 22px}
  [data-mode=gen] .dial .l{font-size:13px;color:var(--fg2)}
  [data-mode=gen] .dial .v{font-family:var(--serif);font-size:56px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;margin-top:4px}
  [data-mode=gen] .dial .v small{font-size:22px;color:var(--fg2);margin-left:6px}
  [data-mode=gen] .fbar{height:8px;border-radius:999px;background:rgba(0,0,0,.25);margin-top:12px;overflow:hidden}
  [data-mode=gen] .fbar i{display:block;height:100%;background:var(--accent);transition:width .6s ease}
  [data-mode=gen] .decade{font-family:var(--serif);font-size:64px;line-height:1;color:var(--fg)}
  [data-mode=gen] .climate{border-left:4px solid var(--accent);padding:10px 16px;margin-top:14px;font-size:16px}
  [data-mode=gen] .climate b{font-family:var(--serif);font-weight:400;font-size:22px;display:block;margin-bottom:2px}
  [data-mode=gen] .evs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  [data-mode=gen] .ev{perspective:1000px;min-height:150px}
  [data-mode=gen] .ev .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  [data-mode=gen] .ev.open .in{transform:rotateY(180deg)}
  [data-mode=gen] .ev .f,[data-mode=gen] .ev .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:16px 18px;border:.5px solid var(--line2)}
  [data-mode=gen] .ev .f{background:var(--accent);color:var(--accent-fg);display:flex;flex-direction:column;justify-content:flex-end}
  [data-mode=gen] .ev .f .t{font-family:var(--serif);font-size:22px;line-height:1.1}
  [data-mode=gen] .ev .f .h{font-size:12.5px;opacity:.75;margin-top:6px}
  [data-mode=gen] .ev .b{background:var(--card);transform:rotateY(180deg);font-size:15px;line-height:1.45}
  [data-mode=gen] .ev .b b{font-family:var(--serif);font-weight:400;font-size:19px;display:block;margin-bottom:6px;color:var(--accent)}
  [data-mode=gen] .dec-grid{display:grid;gap:12px;margin-top:8px}
  [data-mode=gen] .dec-row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:start;padding-top:12px;border-top:.5px solid var(--line)}
  [data-mode=gen] .dec-row .n{font-size:14px;color:var(--fg2);padding-top:14px}
  [data-mode=gen] .ledger{margin-top:14px;border-top:.5px solid var(--line2)}
  [data-mode=gen] .ledger .ln{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line);font-size:15px}
  [data-mode=gen] .ledger .ln .amt{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:18px}
  [data-mode=gen] .ledger .ln.total{font-weight:600}
  [data-mode=gen] .up{color:#9BD3A2} [data-mode=gen] .down{color:#E8A090}
  [data-mode=gen] .chron{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--fg)}
  [data-mode=gen] .board .brow{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:28px;padding:12px 0;border-bottom:.5px solid var(--line);font-variant-numeric:tabular-nums;align-items:center}
  [data-mode=gen] .board .brow .rk{font-family:var(--serif);font-size:26px;color:var(--accent)}
  [data-mode=gen] .board .brow.me{background:rgba(201,162,74,.12);border-radius:10px;padding:12px}
  [data-mode=gen] .verdict{font-family:var(--serif);font-size:30px;line-height:1.25;color:var(--accent)}

  /* ---------- The Call: a phone at night ---------- */
  [data-mode=call] .phone-wrap{display:grid;grid-template-columns:420px 1fr;gap:28px;align-items:start}
  [data-mode=call] .phone{width:420px;background:#000;border-radius:44px;padding:14px;border:1px solid #2A313A;box-shadow:0 30px 60px rgba(0,0,0,.6)}
  [data-mode=call] .screen{background:#0B0E12;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;height:78vh;min-height:600px}
  [data-mode=call] .status{display:flex;justify-content:space-between;padding:12px 22px 6px;font-size:13px;color:#C7CCD2}
  [data-mode=call] .contact{text-align:center;padding:8px 16px 12px;border-bottom:.5px solid rgba(255,255,255,.08)}
  [data-mode=call] .contact .av{width:46px;height:46px;border-radius:50%;background:#2A313A;display:grid;place-items:center;margin:0 auto 4px;font-size:18px;color:#C7CCD2}
  [data-mode=call] .contact .nm{font-size:14px;color:#EDEFF2}
  [data-mode=call] .contact .num{font-size:12px;color:#8A919A}
  [data-mode=call] .thread{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  [data-mode=call] .bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4}
  [data-mode=call] .bubble.them{background:#26303B;color:#EDEFF2;align-self:flex-start;border-bottom-left-radius:6px}
  [data-mode=call] .bubble.me{background:#31C48D;color:#0B0E12;align-self:flex-end;border-bottom-right-radius:6px}
  [data-mode=call] .bubble.sys{align-self:center;background:transparent;color:#8A919A;font-size:12px;padding:4px 0}
  [data-mode=call] .bubble.link{text-decoration:underline;color:#7FB2FF;word-break:break-all}
  [data-mode=call] .stamp-t{font-size:11px;color:#6F7780;align-self:center;margin-top:4px}
  [data-mode=call] .voice{display:flex;align-items:center;gap:10px;min-width:220px}
  [data-mode=call] .voice .play{width:28px;height:28px;border-radius:50%;background:#EDEFF2;color:#0B0E12;display:grid;place-items:center;font-size:12px}
  [data-mode=call] .voice .wave{display:flex;gap:2px;align-items:center;height:22px}
  [data-mode=call] .voice .wave i{display:block;width:3px;border-radius:2px;background:#C7CCD2}
  [data-mode=call] .voice .dur{font-size:12px;color:#C7CCD2}
  [data-mode=call] .transcript{font-size:12.5px;color:#9AA2AB;font-style:italic;margin-top:4px}
  [data-mode=call] .typing{display:inline-flex;gap:4px;padding:12px 16px;background:#26303B;border-radius:18px;align-self:flex-start}
  [data-mode=call] .typing i{width:7px;height:7px;border-radius:50%;background:#8A919A;animation:blink 1s infinite}
  [data-mode=call] .typing i:nth-child(2){animation-delay:.2s}[data-mode=call] .typing i:nth-child(3){animation-delay:.4s}
  [data-mode=call] .replies{padding:10px 12px 14px;border-top:.5px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px;background:#0B0E12}
  [data-mode=call] .reply{padding:11px 14px;border-radius:14px;border:.5px solid #31C48D;color:#EDEFF2;font-size:14.5px;line-height:1.35;background:transparent}
  [data-mode=call] .reply:active{background:#163D31}
  [data-mode=call] .dock{display:flex;gap:8px;align-items:center}
  [data-mode=call] .dock input{flex:1;min-height:42px;padding:8px 14px;border-radius:999px;border:.5px solid rgba(255,255,255,.18);background:#151A20;color:#EDEFF2;font-size:14px;outline:none;margin:0}
  [data-mode=call] .send{min-height:42px;padding:0 14px;border-radius:999px;background:#31C48D;color:#0B0E12;font-size:14px;font-weight:500}
  [data-mode=call] .calldad{margin-top:8px;min-height:46px;border-radius:14px;background:#D9463B;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:500;width:100%}
  [data-mode=call] .banner{background:#1E2A22;border:.5px solid #31C48D;border-radius:14px;padding:12px 16px;font-size:14px;color:#EDEFF2}
  [data-mode=call] .banner.bad{background:#2E1A1A;border-color:#D9463B}
  [data-mode=call] .flags{display:flex;flex-direction:column;gap:8px}
  [data-mode=call] .flag{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:.5px solid var(--line)}
  [data-mode=call] .flag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-style:normal}
  [data-mode=call] .flag.bad i{background:#D9463B;color:#fff} [data-mode=call] .flag.ok i{background:#31C48D;color:#0B0E12}
  [data-mode=call] .tactic{padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
  [data-mode=call] .tactic b{font-weight:500;color:var(--accent);display:block}
  [data-mode=call] .habit{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:.5px solid var(--line)}
  [data-mode=call] .habit .n{font-size:30px;font-weight:700;color:var(--accent);line-height:1}
  [data-mode=call] .brief-card{background:var(--card);border-radius:20px;padding:26px 28px;border:.5px solid var(--line)}
  [data-mode=call] .brief-card .big{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em}

  /* ---------- The Investment Committee: boardroom ---------- */
  [data-mode=ic] .display{font-weight:700;letter-spacing:-.02em}
  [data-mode=ic] .pitch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  [data-mode=ic] .pcard{background:var(--card);border:.5px solid var(--line);border-radius:8px;padding:22px 24px;min-height:150px;text-align:left}
  [data-mode=ic] .pcard .nm{font-size:24px;font-weight:700;letter-spacing:-.01em}
  [data-mode=ic] .pcard .one{font-size:15px;color:var(--fg2);margin-top:6px}
  [data-mode=ic] .pcard .ask{margin-top:14px;font-size:13px;font-variant-numeric:tabular-nums}
  [data-mode=ic] .slide{background:var(--card);border:.5px solid var(--line);border-radius:8px;padding:34px 38px;min-height:340px;display:flex;flex-direction:column;justify-content:center}
  [data-mode=ic] .slide .k{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:12px}
  [data-mode=ic] .slide .h{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;max-width:24ch}
  [data-mode=ic] .slide .p{font-size:17px;color:var(--fg2);margin-top:14px;max-width:60ch}
  [data-mode=ic] .slide .nums{display:flex;gap:28px;margin-top:22px}
  [data-mode=ic] .slide .nums div b{display:block;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  [data-mode=ic] .slide .nums div span{font-size:13px;color:var(--fg2)}
  [data-mode=ic] .pager{display:flex;gap:6px;align-items:center;margin-top:12px}
  [data-mode=ic] .pager .pg{width:38px;height:6px;border-radius:3px;background:var(--line2)}
  [data-mode=ic] .pager .pg.on{background:var(--accent)}
  [data-mode=ic] .tokens{display:flex;gap:6px;flex-wrap:wrap}
  [data-mode=ic] .tok{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;transition:opacity .3s,transform .3s}
  [data-mode=ic] .tok.spent{opacity:.18;transform:scale(.85)}
  [data-mode=ic] .minutes{border-top:1px solid var(--fg)}
  [data-mode=ic] .qa{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px 0;border-bottom:.5px solid var(--line);font-size:15.5px}
  [data-mode=ic] .qa .who{font-size:13px;color:var(--fg2);font-weight:600;padding-top:2px}
  [data-mode=ic] .qa .a{font-size:15.5px;line-height:1.5}
  [data-mode=ic] .qa .a.founder{background:var(--card);border-radius:8px;padding:12px 14px}
  [data-mode=ic] .qa .found{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent);border:.5px solid var(--accent);border-radius:999px;padding:2px 10px}
  [data-mode=ic] .sugg{display:flex;flex-wrap:wrap;gap:6px}
  [data-mode=ic] .sugg button{font-size:13px;padding:7px 12px;border-radius:999px;border:.5px solid var(--line2);background:var(--card)}
  [data-mode=ic] .vrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
  [data-mode=ic] .vrow .seg .opt{min-width:80px;min-height:46px}
  [data-mode=ic] .term{background:var(--fg);color:var(--bg);border-radius:8px;padding:26px 28px}
  [data-mode=ic] .term .h{font-size:13px;opacity:.7;font-weight:600}
  [data-mode=ic] .term .big{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  [data-mode=ic] .term .ln{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:.5px solid rgba(255,255,255,.18);font-size:15px}
  [data-mode=ic] .truth{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
  [data-mode=ic] .truth i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
  [data-mode=ic] .truth.hit i{background:var(--accent);color:#fff} [data-mode=ic] .truth.miss i{border:1.5px solid var(--line2);color:var(--fg2)}
  [data-mode=ic] .score{font-size:64px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}

  /* ---------- The Grant Round: manila dossiers, red stamps ---------- */
  [data-mode=grant] .tabs{display:flex;gap:4px;align-items:flex-end}
  [data-mode=grant] .tab{padding:12px 22px 10px;border-radius:10px 10px 0 0;background:#D9CBA8;border:.5px solid var(--line2);border-bottom:0;font-family:var(--palatino);font-size:17px;color:var(--fg2);position:relative;top:1px}
  [data-mode=grant] .tab.on{background:var(--card);color:var(--fg);padding-top:16px}
  [data-mode=grant] .tab .tk{font-size:12px;font-family:var(--sans);opacity:.8;margin-left:8px}
  [data-mode=grant] .folder{background:var(--card);border:.5px solid var(--line2);border-radius:0 10px 10px 10px;padding:26px 28px;position:relative}
  [data-mode=grant] .folder .nm{font-family:var(--palatino);font-size:34px;line-height:1.05}
  [data-mode=grant] .folder .ask{font-size:14px;color:var(--fg2);margin-top:4px}
  [data-mode=grant] .folder .sum{font-size:16px;line-height:1.55;margin-top:14px;max-width:64ch}
  [data-mode=grant] .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  [data-mode=grant] .fact{border-top:1.5px solid var(--fg);padding-top:8px}
  [data-mode=grant] .fact b{display:block;font-family:var(--palatino);font-size:22px;font-weight:400}
  [data-mode=grant] .fact span{font-size:13px;color:var(--fg2)}
  [data-mode=grant] .stamp{position:absolute;right:26px;top:22px;padding:8px 16px;border:3px solid var(--accent);color:var(--accent);border-radius:6px;font-family:var(--palatino);font-size:26px;letter-spacing:.06em;transform:rotate(-8deg);opacity:.9;animation:stampin .4s cubic-bezier(.2,1.2,.3,1) both}
  [data-mode=grant] .stamp.grey{border-color:var(--fg2);color:var(--fg2)}
  @keyframes stampin{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.9}}
  [data-mode=grant] .qa{padding:10px 0;border-top:.5px solid var(--line);font-size:15.5px}
  [data-mode=grant] .qa .q{color:var(--fg2);font-size:14px}
  [data-mode=grant] .qa .a{margin-top:4px;line-height:1.5}
  [data-mode=grant] .alloc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:.5px solid var(--line)}
  [data-mode=grant] .alloc .nm{font-family:var(--palatino);font-size:22px}
  [data-mode=grant] .stepper{display:inline-flex;align-items:center;gap:0;border:.5px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--card)}
  [data-mode=grant] .stepper button{width:48px;height:46px;display:grid;place-items:center;font-size:22px;text-align:center}
  [data-mode=grant] .stepper .v{min-width:92px;text-align:center;font-family:var(--palatino);font-size:20px;font-variant-numeric:tabular-nums}
  [data-mode=grant] .pot{font-family:var(--palatino);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
  [data-mode=grant] .impact{font-family:var(--palatino);font-size:56px;line-height:1;color:var(--accent)}
  [data-mode=grant] .outcome{padding:14px 150px 14px 0;border-top:.5px solid var(--line);position:relative}
  [data-mode=grant] .outcome .stamp{top:14px;right:8px;font-size:20px;padding:4px 10px}
  [data-mode=grant] .outcome b{font-family:var(--palatino);font-weight:400;font-size:22px;display:block}

  /* ---------- The Values Auction: aubergine and paddle yellow ---------- */
  [data-mode=auction] .display{font-weight:800;letter-spacing:-.03em}
  [data-mode=auction] .lotcard{background:var(--card);border:.5px solid var(--line);border-radius:22px;padding:28px 30px;min-height:220px;display:flex;flex-direction:column}
  [data-mode=auction] .lotcard .ln{font-size:13px;color:var(--fg2)}
  [data-mode=auction] .lotcard .lv{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:6px}
  [data-mode=auction] .lotcard .ld{font-size:17px;color:var(--fg2);margin-top:12px;max-width:40ch;line-height:1.45}
  [data-mode=auction] .bidbox{background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:22px 26px;text-align:center}
  [data-mode=auction] .bidbox .l{font-size:13px;font-weight:600;opacity:.75}
  [data-mode=auction] .bidbox .v{font-size:78px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  [data-mode=auction] .bidbox .who{font-size:16px;margin-top:6px;font-weight:600}
  [data-mode=auction] .paddles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  [data-mode=auction] .paddle{background:var(--card);border:.5px solid var(--line2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:96px;text-align:left}
  [data-mode=auction] .paddle .pn{font-size:12px;color:var(--fg2)}
  [data-mode=auction] .paddle .nm{font-size:19px;font-weight:700}
  [data-mode=auction] .paddle .bud{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
  [data-mode=auction] .paddle .plus{margin-top:auto;font-size:14px;font-weight:700;color:var(--accent)}
  [data-mode=auction] .paddle.lead{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  [data-mode=auction] .paddle[disabled]{opacity:.35}
  [data-mode=auction] .gavel{min-height:64px;font-size:20px;font-weight:800;border-radius:16px}
  [data-mode=auction] .sold{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  [data-mode=auction] .sold span{font-size:110px;font-weight:900;letter-spacing:-.04em;color:var(--accent);border:8px solid var(--accent);padding:0 26px;border-radius:18px;transform:rotate(-12deg);animation:soldin .5s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes soldin{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
  [data-mode=auction] .lrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 0;border-top:.5px solid var(--line);align-items:center;font-variant-numeric:tabular-nums}
  [data-mode=auction] .lrow .lv{font-size:22px;font-weight:800}
  [data-mode=auction] .lrow .amt{font-size:22px;font-weight:800;color:var(--accent)}
  [data-mode=auction] .scen{background:var(--card);border-radius:20px;padding:24px 26px;border:.5px solid var(--line)}
  [data-mode=auction] .scen .for{font-size:13px;color:var(--fg2)}
  [data-mode=auction] .scen .t{font-size:22px;line-height:1.35;margin-top:6px;font-weight:600}
  [data-mode=auction] .gapline{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:.5px solid var(--line);align-items:center}
  [data-mode=auction] .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  [data-mode=auction] .tag.match{background:var(--accent);color:var(--accent-fg)} [data-mode=auction] .tag.gap{border:1.5px solid var(--accent);color:var(--accent)}
  [data-mode=auction] .lot-stage{position:relative}

  /* ---------- The Cousins' Buyout: contract paper, two inks ---------- */
  [data-mode=buyout]{--a:#2B3A67;--b:#9C4A2F}
  [data-mode=buyout] .sides{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  [data-mode=buyout] .side{border:1.5px solid var(--line2);border-radius:6px;padding:26px 28px;min-height:280px;background:var(--card);display:flex;flex-direction:column;text-align:left}
  [data-mode=buyout] .side.a{border-color:var(--a)} [data-mode=buyout] .side.b{border-color:var(--b)}
  [data-mode=buyout] .side .k{font-size:13px;font-weight:600;letter-spacing:.02em}
  [data-mode=buyout] .side.a .k{color:var(--a)} [data-mode=buyout] .side.b .k{color:var(--b)}
  [data-mode=buyout] .side .nm{font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:6px}
  [data-mode=buyout] .side .d{font-size:15px;color:var(--fg2);margin-top:10px;line-height:1.5}
  [data-mode=buyout] .side .pick{margin-top:auto;padding-top:16px;font-weight:600}
  [data-mode=buyout] .contract{background:var(--card);border:.5px solid var(--line2);border-radius:6px;padding:26px 30px}
  [data-mode=buyout] .contract .h{font-family:var(--serif);font-size:26px;border-bottom:1.5px solid var(--fg);padding-bottom:8px;margin-bottom:12px}
  [data-mode=buyout] .clause{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:8px 0;font-size:15.5px;line-height:1.5}
  [data-mode=buyout] .clause .n{font-family:var(--serif);color:var(--fg2)}
  [data-mode=buyout] .private{border:1.5px dashed var(--line2);border-radius:6px;padding:20px 22px;position:relative}
  [data-mode=buyout] .private .warn{font-size:12px;font-weight:600;color:#B03A2E;margin-bottom:8px}
  [data-mode=buyout] .private.a{border-color:var(--a)} [data-mode=buyout] .private.b{border-color:var(--b)}
  [data-mode=buyout] .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  [data-mode=buyout] .fact{border-top:1.5px solid var(--fg);padding-top:8px}
  [data-mode=buyout] .fact b{display:block;font-family:var(--serif);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
  [data-mode=buyout] .fact span{font-size:13px;color:var(--fg2)}
  [data-mode=buyout] .offer{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:10px 0;border-top:.5px solid var(--line);align-items:center;font-size:15px}
  [data-mode=buyout] .offer .by{font-size:12px;font-weight:600}
  [data-mode=buyout] .offer.us .by{color:var(--a)} [data-mode=buyout] .offer.them .by{color:var(--b)}
  [data-mode=buyout] .offer .tot{font-family:var(--serif);font-size:22px;font-variant-numeric:tabular-nums}
  [data-mode=buyout] .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
  [data-mode=buyout] .sig{margin-top:18px;border-top:1px solid var(--fg);padding-top:6px;font-family:var(--serif);font-style:italic;color:var(--fg2);font-size:14px}
  [data-mode=buyout] .verdict{font-family:var(--serif);font-size:30px;line-height:1.25}
  [data-mode=buyout] .vcol{padding:16px 18px;border-radius:6px;border:1.5px solid var(--line2)}
  [data-mode=buyout] .vcol.a{border-color:var(--a)} [data-mode=buyout] .vcol.b{border-color:var(--b)}
  [data-mode=buyout] .vcol .k{font-size:13px;font-weight:600;margin-bottom:6px}
  [data-mode=buyout] .vcol.a .k{color:var(--a)} [data-mode=buyout] .vcol.b .k{color:var(--b)}
  [data-mode=buyout] .toggle-big{display:flex;gap:10px}
  [data-mode=buyout] .toggle-big .opt{min-height:64px;font-size:18px}

  /* ---------- Dinner with the Founder: candlelight ---------- */
  [data-mode=founder] main.stage{background:radial-gradient(ellipse at 50% 0%,rgba(224,176,92,.10),transparent 55%),var(--bg)}
  [data-mode=founder] .letter{background:var(--card);border:.5px solid var(--line);border-radius:6px;padding:26px 30px;font-family:var(--palatino);font-size:18px;line-height:1.6}
  [data-mode=founder] .letter .dt{font-family:var(--sans);font-size:12.5px;color:var(--fg2);margin-bottom:10px}
  [data-mode=founder] .letter .sg{margin-top:12px;color:var(--accent);font-style:italic}
  [data-mode=founder] .dinner{display:grid;grid-template-columns:90px 1fr;gap:32px;align-items:start}
  [data-mode=founder] .candle{position:sticky;top:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
  [data-mode=founder] .candle .flame{width:16px;height:26px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#FFF3C4,#E0B05C 60%,transparent 72%);animation:flicker 1.6s infinite alternate ease-in-out}
  [data-mode=founder] .candle .wax{width:30px;height:220px;border-radius:6px 6px 3px 3px;background:linear-gradient(#F7E9C8,#E6D3A6);position:relative;overflow:hidden}
  [data-mode=founder] .candle .wax i{position:absolute;left:0;right:0;top:0;background:var(--bg);display:block;transition:height .8s ease}
  [data-mode=founder] .candle .cl{font-size:12px;color:var(--fg2);text-align:center}
  @keyframes flicker{from{transform:scale(1) translateY(0);opacity:.95}to{transform:scale(1.08) translateY(-2px);opacity:1}}
  [data-mode=founder] .qa{padding:16px 0;border-top:.5px solid var(--line)}
  [data-mode=founder] .qa .q{font-size:15px;color:var(--fg2)}
  [data-mode=founder] .qa .a{font-family:var(--palatino);font-size:21px;line-height:1.55;margin-top:8px;min-height:1.5em}
  [data-mode=founder] .prompts{display:flex;flex-wrap:wrap;gap:6px}
  [data-mode=founder] .prompts button{font-size:13.5px;padding:8px 12px;border-radius:999px;border:.5px solid var(--line2);background:transparent;color:var(--fg)}
  [data-mode=founder] .display{font-style:italic}
  [data-mode=founder] .cursor{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s infinite}
  [data-mode=founder] .decide{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  [data-mode=founder] .decide .opt{min-height:80px;font-family:var(--palatino);font-size:22px}

  @media (max-width:980px){
    [data-mode=call] .phone-wrap{grid-template-columns:1fr} [data-mode=call] .phone{width:100%;max-width:420px;margin:0 auto}
    [data-mode=gen] .gen-dials,[data-mode=gen] .evs,[data-mode=ic] .pitch,[data-mode=buyout] .sides,[data-mode=founder] .decide{grid-template-columns:1fr}
    [data-mode=auction] .paddles{grid-template-columns:repeat(2,1fr)}
    [data-mode=grant] .facts{grid-template-columns:1fr} [data-mode=buyout] .facts{grid-template-columns:repeat(2,1fr)}

  }

<body>
<div id="app" class="app" data-mode="home"></div>
<canvas id="confetti"></canvas>
<script>
(function () {
'use strict';

/* ================= SHELL ================= */
const app = document.getElementById('app');
const STORAGE_KEY = 'table-games';
const MODES = {}; const MODE_ORDER = ['fs', 'gen', 'call', 'ic', 'grant', 'auction', 'buyout', 'founder'];
let state = fresh();
let T = { total: 0, left: 0, running: false, endAt: 0 }; let tick = null, audio = null, lastKey = '';
let saveTimer = null;

function fresh() { return { screen: 'home', mode: null, pending: null, table: '', players: [], playerDraft: '', demo: false, drawer: null, modal: null, live: {}, modes: {} }; }
function defineMode(m) { MODES[m.id] = m; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function money(m) { const a = Math.abs(m); const s = a >= 1000 ? (a / 1000).toFixed(a >= 10000 ? 0 : 1) + ' billion' : a >= 100 ? Math.round(a) + ' million' : a >= 10 ? a.toFixed(0) + ' million' : a.toFixed(1) + ' million'; return (m < 0 ? '-' : '') + '€' + s; }
function eur(m) { return '€' + (m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 2) + 'bn' : Math.round(m * 10) / 10 + 'm'); }
function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function players() { return state.players.length ? state.players : ['Player 1', 'Player 2', 'Player 3']; }
function sub(id) { if (!state.modes[id]) state.modes[id] = MODES[id].init(); return state.modes[id]; }
function cur() { return state.mode ? MODES[state.mode] : null; }
function shellState() { return state; }

/* ---------- AI ---------- */
async function askAI(system, user, json) {
  if (state.demo) throw new Error('demo');
  const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: system, messages: [{ role: 'user', content: user }] }) });
  if (!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  const text = (data.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n').trim();
  if (!text) throw new Error('empty');
  if (json) { const clean = text.replace(/```json|```/g, '').trim(); const a = clean.indexOf('{'), b = clean.lastIndexOf('}'); return JSON.parse(clean.slice(a, b + 1)); }
  return text;
}
/* o = { key, system, user, json, validate, fallback, apply } */
async function runAI(o) {
  if (state.live[o.key]) return;
  state.live[o.key] = true; if (o.before) o.before(); render();
  let result, sample = false;
  try { result = await askAI(o.system, o.user, o.json); if (o.validate && !o.validate(result)) throw new Error('shape'); }
  catch (e) { await wait(650); result = o.fallback(); sample = true; }
  delete state.live[o.key]; o.apply(result, sample); render(); save();
}
function aiLabel(key, label) { return state.live[key] ? 'Thinking' : label; }
function sampleTag(x) { return x && x.sample ? '<div class="sample">Sample output: demo mode, or the AI could not be reached</div>' : ''; }
function loadingHTML() { return '<div class="loading"><span class="d"></span><span class="d"></span><span class="d"></span></div>'; }

/* ---------- persistence ---------- */
function save() {
  if (!window.storage) return; clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { try { const snap = JSON.parse(JSON.stringify(state)); snap.live = {}; snap.drawer = null; snap.modal = null; window.storage.set(STORAGE_KEY, JSON.stringify(snap), false).catch(function () {}); } catch (e) {} }, 400);
}
function load() {
  if (!window.storage) return;
  try { window.storage.get(STORAGE_KEY, false).then(function (r) { if (r && r.value) { const s = JSON.parse(r.value); if (s && s.modes) { state = Object.assign(fresh(), s, { live: {}, drawer: null, modal: null, screen: 'home', mode: null }); render(); } } }).catch(function () {}); } catch (e) {}
}
async function shared(op, key, value) {
  if (!window.storage) throw new Error('no storage');
  if (op === 'set') return window.storage.set(key, value, true);
  if (op === 'get') return window.storage.get(key, true);
  if (op === 'list') return window.storage.list(key, true);
}

/* ---------- timer, chime, confetti ---------- */
function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function setTimer(sec) { stopTimer(); T = { total: sec, left: sec, running: false, endAt: 0 }; }
function startTimer() {
  if (T.left <= 0) T.left = T.total;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  T.running = true; T.endAt = Date.now() + T.left * 1000; clearInterval(tick);
  tick = setInterval(function () { T.left = Math.max(0, Math.round((T.endAt - Date.now()) / 1000)); paintTimer(); if (T.left <= 0) { pauseTimer(); chime(); } }, 250);
  updateTimerBtn();
}
function pauseTimer() { T.running = false; clearInterval(tick); tick = null; updateTimerBtn(); }
function stopTimer() { clearInterval(tick); tick = null; T.running = false; }
function paintTimer() { const t = document.getElementById('timerText'), ring = document.getElementById('timerRing'); if (t) t.textContent = fmt(T.left); if (ring) { const C = 2 * Math.PI * 66; const f = T.total ? T.left / T.total : 1; ring.setAttribute('stroke-dashoffset', String(C * (1 - f))); } }
function updateTimerBtn() { const b = document.querySelector('[data-act="timerToggle"]'); if (b) b.textContent = T.running ? 'Pause' : 'Start'; }
function timerSVG() { const C = 2 * Math.PI * 66; const f = T.total ? T.left / T.total : 1; return '<svg viewBox="0 0 150 150" role="img" aria-label="Timer"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="timerRing" cx="75" cy="75" r="66" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - f)) + '" transform="rotate(-90 75 75)"/><text id="timerText" x="75" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="var(--fg)">' + fmt(T.left) + '</text></svg>'; }
function timerHTML(presets) { presets = presets || [120, 180, 300]; return '<div class="timer">' + timerSVG() + '<div class="row center"><button class="btn sm" data-act="timerToggle">' + (T.running ? 'Pause' : 'Start') + '</button><button class="btn sm line" data-act="timerReset">Reset</button></div><div class="row center">' + presets.map(function (t) { return '<button class="preset ' + (T.total === t ? 'on' : '') + '" data-act="timerSet" data-arg="' + t + '">' + Math.round(t / 60) + ' min</button>'; }).join('') + '</div></div>'; }
function chime() { try { if (!audio) return; [523.25, 659.25, 783.99].forEach(function (f, i) { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audio.destination); const t = audio.currentTime + i * 0.18; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); o.start(t); o.stop(t + 0.75); }); } catch (e) {} }
function confetti(cols) {
  if (reduced()) return; const cv = document.getElementById('confetti'); const ctx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight; cv.style.display = 'block';
  cols = cols || ['#A0824E', '#C4A96A', '#1B2A4A', '#FFFFFF', '#6E4A7E', '#2E6B4F', '#A4512F']; const P = [];
  for (let k = 0; k < 170; k++) P.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.6, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9, c: cols[k % cols.length], v: 2.2 + Math.random() * 3, a: Math.random() * Math.PI, s: (Math.random() - 0.5) * 0.2 });
  const t0 = Date.now();
  (function frame() { ctx.clearRect(0, 0, cv.width, cv.height); P.forEach(function (p) { p.y += p.v; p.a += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }); if (Date.now() - t0 < 3400) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; } })();
}
function countUp(id, from, to, ms, fmtFn) {
  const el = document.getElementById(id); if (!el) return; if (reduced()) { el.textContent = fmtFn(to); return; }
  const t0 = Date.now(); (function f() { const p = Math.min(1, (Date.now() - t0) / ms); const e = 1 - Math.pow(1 - p, 3); el.textContent = fmtFn(from + (to - from) * e); if (p < 1) requestAnimationFrame(f); })();
}

/* ---------- render ---------- */
function render() {
  const m = cur(); const s = m ? sub(m.id) : null;
  const home = state.screen === 'home' || state.screen === 'setup';
  app.setAttribute('data-mode', home ? 'home' : m.id);
  const key = state.screen + ':' + (m ? m.id : '') + ':' + (m && m.key ? m.key(s) : '');
  const old = document.getElementById('stage'); const top = old ? old.scrollTop : 0;
  app.innerHTML = header(m, s) + '<main class="stage" id="stage">' + (home ? (state.screen === 'home' ? homeHTML() : setupHTML()) : m.main(s)) + '</main><footer class="actions">' + (home ? homeFoot() : (m.foot ? m.foot(s) : '')) + '</footer>' + drawerHTML(m, s) + modalHTML(m, s);
  const st = document.getElementById('stage'); if (st && key === lastKey) st.scrollTop = top; lastKey = key;
  if (m && m.after && !home) m.after(s);
}
function header(m, s) {
  if (state.screen === 'home') return '';
  const name = state.screen === 'setup' ? 'The table' : m.name;
  return '<header class="bar"><div class="left"><button class="tool" data-act="home">Home</button><span class="brand">' + esc(name) + '</span>' + (state.table ? '<span class="tbl">' + esc(state.table) + '</span>' : '') + '</div><div class="mid">' + (m && m.head && state.screen !== 'setup' ? m.head(s) : '') + '</div><div class="tools">' + (m && m.tools && state.screen !== 'setup' ? m.tools(s) : '') + '<button class="tool ' + (state.drawer === 'notes' ? 'on' : '') + '" data-act="drawer" data-arg="notes">Facilitator</button></div></header>';
}
function homeHTML() {
  return '<div class="wrap home"><div class="kicker">' + (state.table ? esc(state.table) + (state.players.length ? ', ' + state.players.map(esc).join(', ') : '') : 'No table set up yet') + '</div><h1 class="display">At the Table</h1><p class="sub">One fictional family, eight games. One iPad per table, one advisor to keep the clock. Nothing real goes in; everyone leaves with something real.</p>' +
    '<div class="tiles">' + MODE_ORDER.map(function (id) { const m = MODES[id]; if (!m) return ''; const s = state.modes[id]; const started = s && m.progress ? m.progress(s) : ''; return '<button class="tile t-' + id + '" data-act="openMode" data-arg="' + id + '"><div class="tk">' + esc(started || m.dur) + '</div><div class="tn">' + esc(m.name) + '</div><div class="tt">' + esc(m.tag) + '</div><div class="tm">' + esc(m.who) + '</div></button>'; }).join('') + '</div></div>';
}
function homeFoot() {
  if (state.screen === 'setup') return '<button class="btn ghost" data-act="home">Back</button><button class="btn" data-act="setupDone" ' + (state.table.trim() ? '' : 'disabled') + '>' + (state.pending ? 'Start ' + esc(MODES[state.pending].name) : 'Save the table') + '</button>';
  return '<label class="toggle"><input type="checkbox" data-act="toggleDemo" ' + (state.demo ? 'checked' : '') + '> Demo mode: sample AI output, no network needed</label><button class="btn ghost" data-act="setup">' + (state.table ? 'Change the table' : 'Set up the table') + '</button>';
}
function setupHTML() {
  return '<div class="narrow"><div class="kicker">Before you play</div><h1 class="display">Set the table</h1><p class="lede gap muted">The name and the players carry across every game tonight.</p>' +
    '<div class="panel top"><h3>Name this table</h3><input class="field" data-model="table" value="' + esc(state.table) + '" placeholder="Table 1" autocomplete="off"></div>' +
    '<div class="panel gap"><h3>Who is sitting here</h3><div class="setup-players">' + state.players.map(function (p, i) { return '<span class="pl">' + esc(p) + '<button data-act="removePlayer" data-arg="' + i + '" aria-label="Remove ' + esc(p) + '">×</button></span>'; }).join('') + '</div><div class="row gap"><input class="field" style="flex:1;margin:0" data-model="playerDraft" value="' + esc(state.playerDraft) + '" placeholder="First name, then Enter" autocomplete="off"><button class="btn sm line" data-act="addPlayer">Add</button></div><p class="small muted gap">Up to six. First names only; the family in the games is fictional.</p></div></div>';
}
function drawerHTML(m, s) {
  const open = !!state.drawer; const isNotes = state.drawer === 'notes';
  let body = '';
  if (isNotes) body = (m && state.screen !== 'setup' ? m.notes(s) : '<div class="kicker">Tonight</div><p>Eight games, each twelve to thirty minutes. Values Auction opens well; Five Seats or Three Generations is the main event; The Call is a fifteen-minute jolt; Dinner with the Founder closes.</p><div class="nb"><b>House rules</b><ol><li>Everything on the iPad is fictional. Nothing about a real family is typed in.</li><li>The AI never decides. The table decides.</li><li>The advisor keeps the clock and asks the second question.</li></ol></div>') +
    '<div class="nb settings"><label class="toggle"><input type="checkbox" data-act="toggleDemo" ' + (state.demo ? 'checked' : '') + '> Demo mode: sample AI output, no network needed</label>' + (m && state.screen !== 'setup' ? '<button class="btn sm line" data-act="resetMode">Restart ' + esc(m.name) + '</button>' : '') + '<button class="btn sm line" data-act="newTable">New table: clear everything</button></div>';
  else if (open && m && m.drawer) body = m.drawer(s, state.drawer);
  const title = isNotes ? 'Facilitator' : (m && m.drawerTitle ? m.drawerTitle(state.drawer) : '');
  return '<div class="scrim ' + (open ? 'on' : '') + '" data-act="closeDrawer"></div><aside class="drawer ' + (open ? 'open' : '') + '" aria-label="' + esc(title) + '"><div class="dh"><b>' + esc(title) + '</b><button class="tool" data-act="closeDrawer">Close</button></div><div class="db">' + body + '</div></aside>';
}
function modalHTML(m, s) { return m && m.modal && state.screen !== 'setup' ? m.modal(s) : ''; }

/* ---------- events ---------- */
function openMode(id) { if (!state.table.trim()) { state.pending = id; state.screen = 'setup'; return; } state.mode = id; state.screen = 'mode'; state.drawer = null; sub(id); setTimer(0); if (MODES[id].enter) MODES[id].enter(sub(id)); }
function shellAct(act, arg, el, e) {
  switch (act) {
    case 'home': state.screen = 'home'; state.drawer = null; state.modal = null; stopTimer(); return true;
    case 'setup': state.screen = 'setup'; state.pending = null; return true;
    case 'setupDone': { if (!state.table.trim()) return true; const d = state.playerDraft.trim(); if (d && state.players.length < 6) { state.players.push(d); state.playerDraft = ''; } if (state.pending) { const id = state.pending; state.pending = null; openMode(id); } else state.screen = 'home'; return true; }
    case 'addPlayer': { const d = state.playerDraft.trim(); if (d && state.players.length < 6) { state.players.push(d); state.playerDraft = ''; } return true; }
    case 'removePlayer': state.players.splice(+arg, 1); return true;
    case 'openMode': openMode(arg); return true;
    case 'drawer': state.drawer = state.drawer === arg ? null : arg; return true;
    case 'closeDrawer': if (act === 'closeDrawer' && el.classList.contains('scrim') && e.target !== el) return true; state.drawer = null; return true;
    case 'toggleDemo': state.demo = !!el.checked; save(); return 'silent';
    case 'timerToggle': if (T.running) pauseTimer(); else startTimer(); return 'silent';
    case 'timerReset': setTimer(T.total || 180); return true;
    case 'timerSet': setTimer(+arg); return true;
    case 'resetMode': if (!window.confirm('Restart ' + MODES[state.mode].name + ' for this table?')) return 'silent'; state.modes[state.mode] = MODES[state.mode].init(); state.drawer = null; setTimer(0); if (MODES[state.mode].enter) MODES[state.mode].enter(sub(state.mode)); return true;
    case 'newTable': if (!window.confirm('Clear the table, the players and every game?')) return 'silent'; state = fresh(); stopTimer(); try { if (window.storage) window.storage.delete(STORAGE_KEY, false).catch(function () {}); } catch (x) {} return true;
  }
  return false;
}
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
  let r = shellAct(act, arg, el, e);
  if (r === false) { const m = cur(); if (m && state.screen === 'mode') r = m.act(sub(m.id), act, arg, el, e); }
  if (r === 'silent') return;
  if (r) { render(); save(); }
});
document.addEventListener('input', function (e) {
  const mdl = e.target.getAttribute && e.target.getAttribute('data-model'); if (!mdl) return; const v = e.target.value;
  if (mdl === 'table') { state.table = v; const b = document.querySelector('[data-act="setupDone"]'); if (b) b.disabled = !v.trim(); }
  else if (mdl === 'playerDraft') state.playerDraft = v;
  else { const m = cur(); if (m && m.input) m.input(sub(m.id), mdl, v, e.target); }
  save();
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.getAttribute) return; const mdl = e.target.getAttribute('data-model');
  if (mdl === 'playerDraft') { e.preventDefault(); shellAct('addPlayer'); render(); save(); const i = document.querySelector('[data-model="playerDraft"]'); if (i) i.focus(); }
  else if (mdl === 'table') { e.preventDefault(); const i = document.querySelector('[data-model="playerDraft"]'); if (i) i.focus(); }
  else { const m = cur(); if (m && m.enter_key && state.screen === 'mode') { const r = m.enter_key(sub(m.id), mdl, e); if (r) { e.preventDefault(); render(); save(); } } }
});

/* ================= MODE: FIVE SEATS (ported) ================= */
(function () {
let S = null; let dealPending = true;
function fresh() {
  return { screen:'seats', table:'', demo:false, players:{}, claimName:'', briefIdx:0, roundIdx:0, stage:'scenario', rounds:{}, stamps:[], spun:null, coachSeat:null, coachLog:[], coachText:'', coachLive:false, modal:null, stampDraft:{ from:null, about:null, text:'' } };
}
function sync(s) { S = s; S.demo = shellState().demo; S.table = shellState().table; }
/* ================= DATA ================= */
const FAMILY = {
  name: 'the Valmont family',
  company: 'Valmont Group',
  desc: 'a third-generation packaging and logistics group: €1.4 billion in revenue, 4,000 employees, entirely family-owned, with a board of seven (four family members, three independents). The Valmont Foundation gives €8 million a year to ocean conservation and education.'
};

const SEATS = [
  { id:'leader', num:1, name:'The Family Business Leader', short:'Leader', color:'#1B2A4A', tint:'#E8EBF1',
    tagline:'Runs the company. Carries the name.',
    bio:'Second generation. Chief executive of Valmont Group for nineteen years. Sixty-one, and starting to count.',
    cares:['Continuity: the business outlives everyone in this room','Reinvesting before paying out','Staying in control of decisions that affect 4,000 people'],

    style:'Leads with numbers and history. Listens more than it looks.',
    secret:'You privately doubt that anyone in the next generation actually wants your job. You have never said this out loud, and you will not say it first.' },
  { id:'founder', num:2, name:'The Independent Entrepreneur', short:'Entrepreneur', color:'#A4512F', tint:'#F5E6DF',

/* ================= STATE ================= */
function roundData(i) {
  const r = ROUNDS[i == null ? S.roundIdx : i];
  if (!S.rounds[r.id]) S.rounds[r.id] = { votes:{}, ratings:{}, picks:{}, pickSeat:null, message:'', msgSeat:null, idea:null, path:null, single:null, live:{}, ai:{}, done:false, curveballs:[], liveWith:{} };
  return S.rounds[r.id];
}
function claimed() { return SEATS.filter(function (s) { return S.players[s.id]; }); }
function playerName(id) { return S.players[id] ? S.players[id].name : 'AI'; }
function optLabel(round, id) { const o = round.decision.options.filter(function (x) { return x.id === id; })[0]; return o ? o.label : ''; }
function decisionLabel(round, r) {
  const d = round.decision;
  if (d.kind === 'vote') {
    const n = Object.keys(r.votes).length; if (!n) return 'No votes yet.';
    const tally = {}; Object.keys(r.votes).forEach(function (k) { tally[r.votes[k]] = (tally[r.votes[k]] || 0) + 1; });
    const sorted = Object.keys(tally).map(function (k) { return [k, tally[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    if (sorted.length > 1 && sorted[0][1] === sorted[1][1]) return 'Tied at ' + sorted[0][1] + ' votes each. The table has to break it.';
    return optLabel(round, sorted[0][0]) + ', with ' + sorted[0][1] + ' of ' + n + ' votes.';
  }
  if (d.kind === 'single') return r.single ? optLabel(round, r.single) : 'Not yet answered.';
  if (d.kind === 'consensus') { if (!r.path) return 'No path chosen.'; const yes = SEATS.filter(function (s) { return r.liveWith[s.id]; }).length; return optLabel(round, r.path) + '. ' + yes + ' of ' + SEATS.length + ' seats can live with it.'; }
  return '';
}

/* ================= AI ================= */
function systemPrompt() {
  return 'You are the game engine for "Five Seats", a private-bank workshop that helps next-generation family members understand perspectives different from their own. Everything is fiction.\n' +
    'The family: ' + FAMILY.name + '. ' + FAMILY.company + ' is ' + FAMILY.desc + '\n' +
    'The five seats (characters):\n' +
    SEATS.map(function (s) { return '- ' + s.name + ' (id: ' + s.id + '): ' + s.bio + ' Cares about: ' + s.cares.join('; ') + '. Fears: ' + s.fears.join('; ') + '. Style: ' + s.style; }).join('\n') + '\n' +
    'Rules: stay inside the fiction; be specific, vivid and brief; never moralise and never say which seat is right; use euros and a European business context; write in plain English that a 24-year-old and a 61-year-old both enjoy; no bullet points, no headings, no emoji. When asked for JSON, return only valid JSON with exactly the keys requested: no preamble, no code fences. Keep every field under 45 words.';
}
function tableContext() {
  return 'At this table: ' + SEATS.map(function (s) { return s.name + ' is ' + (S.players[s.id] ? 'played by ' + S.players[s.id].name : 'an empty seat, played by the AI'); }).join('; ') + '.';
}
function buildPrompt(round, r, id, arg) {
  const sc = 'Scenario (' + round.dim + ', "' + round.name + '"): ' + round.scenario;
  const ctx = tableContext();
  switch (id) {
    case 'case': { const s = SEAT[arg]; return { json:false, user: ctx + '\n' + sc + '\nWrite the opening statement of ' + s.name + ' to the family: first person, in character, 60 to 80 words, ending with how this seat votes (build the plant, pay the dividend, or split). Plain text only.' }; }
    case 'simulate': { const v = SEATS.map(function (s) { return s.name + ': ' + (optLabel(round, r.votes[s.id]) || 'did not vote'); }).join('; '); return { json:true, user: ctx + '\n' + sc + '\nThe family voted. ' + v + '. Outcome: ' + decisionLabel(round, r) + ' It is now 2031, five years later. Return JSON: {"seats":[{"id":"leader","mood":"one of: pleased, relieved, uneasy, angry","line":"how this seat feels in 2031 and why, first person, 30 to 40 words"} ... all five seats in the order leader, founder, pro, nextgen, phil],"tradeoff":"the trade-off the table probably did not discuss, 25 to 40 words"}' }; }

function spin() {

  const chips = Array.prototype.slice.call(document.querySelectorAll('#spinrow .chip')); if (!chips.length) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { S.spun = list[Math.floor(Math.random() * list.length)].id; render(); save(); return; }
  let i = 0, n = 0, delay = 70; const total = 12 + Math.floor(Math.random() * list.length) + list.length;
  (function step() {
    chips.forEach(function (c, k) { c.classList.toggle('on', k === i % list.length); });
    n++;
    if (n <= total) { i++; if (n > total - 5) delay *= 1.4; setTimeout(step, delay); }

}

function onAct(act, arg, el, e) {
  const r = S.screen === 'round' ? roundData() : null;
  switch (act) {
    case 'go': if (arg === 'seats') enterSeats(); else S.screen = arg; if (arg === 'hub') stopTimer(); break;
    case 'claim': S.modal = { type:'claim', seat:arg }; S.claimName = S.players[arg] ? S.players[arg].name : ''; break;
    case 'closeModal': if (e.target !== el) return 'silent'; S.modal = null; break;
    case 'confirmClaim': { const nm = (S.claimName || '').trim(); if (!nm) { const inp = document.getElementById('claimName'); if (inp) inp.focus(); return 'silent'; } S.players[arg] = { name:nm }; S.modal = null; break; }
    case 'release': delete S.players[arg]; S.modal = null; break;
    case 'startBriefs': S.briefIdx = 0; S.screen = 'brief'; break;
    case 'briefBack': if (S.briefIdx > 0) S.briefIdx--; else enterSeats(); break;
    case 'briefNext': if (S.briefIdx < claimed().length - 1) S.briefIdx++; else S.screen = 'hub'; break;
    case 'openRound': S.roundIdx = +arg; S.screen = 'round'; S.stage = 'scenario'; S.spun = null; shellState().drawer = null; setTimer(ROUNDS[S.roundIdx].activity.timer); break;
    case 'stage': S.stage = arg; if (arg === 'play' && !T.total) setTimer(ROUNDS[S.roundIdx].activity.timer); break;
    case 'finishRound': roundData().done = true; stopTimer(); S.screen = 'hub'; break;
    case 'passport': S.screen = 'passport'; setTimeout(confetti, 250); break;
    case 'spin': spin(); return 'silent';
    case 'vote': { const p = arg.split('|'); if (r.votes[p[0]] === p[1]) delete r.votes[p[0]]; else r.votes[p[0]] = p[1]; break; }
    case 'rate': { const p = arg.split('|'); if (r.ratings[p[0]] === +p[1]) delete r.ratings[p[0]]; else r.ratings[p[0]] = +p[1]; break; }
    case 'msgSeat': r.msgSeat = arg; break;
    case 'drawIdea': { const pool = IDEAS.filter(function (x) { return !r.idea || x.name !== r.idea.name; }); r.idea = Object.assign({}, pool[Math.floor(Math.random() * pool.length)]); r.ratings = {}; delete r.ai.stress; break; }
    case 'pickSeat': r.pickSeat = arg; break;
    case 'pickSkill': { const sid = r.pickSeat || SEATS[0].id; const arr = r.picks[sid] = r.picks[sid] || []; const i = arr.indexOf(arg); if (i >= 0) arr.splice(i, 1); else { if (arr.length >= 2) arr.shift(); arr.push(arg); } break; }
    case 'single': r.single = r.single === arg ? null : arg; break;
    case 'path': r.path = arg; r.liveWith = {}; break;
    case 'liveWith': r.liveWith[arg] = !r.liveWith[arg]; break;
    case 'ai': { const p = arg.split('|'); if (p[0] === 'forward' && !p[1]) return 'silent'; runAI(p[0], p[1] || null); return 'silent'; }
    case 'stampFrom': S.stampDraft.from = arg; if (S.stampDraft.about === arg) S.stampDraft.about = null; break;
    case 'stampAbout': S.stampDraft.about = arg; break;
    case 'addStamp': { const d = S.stampDraft; if (!(d.from && d.about && d.text.trim())) return 'silent'; S.stamps.push({ from:d.from, about:d.about, text:d.text.trim(), round:ROUNDS[S.roundIdx].id }); S.stampDraft = { from:null, about:null, text:'' }; break; }
    case 'coachSeat': S.coachSeat = arg; break;
    case 'askCoach': askCoach(); return 'silent';
    case 'claimChip': S.claimName = arg; break;
    default: return false;
  }
  return true;
}
