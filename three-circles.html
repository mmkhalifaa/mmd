<script>
(function () {
'use strict';
const app = document.getElementById('app'); const KEY = 'three-circles';

/* ================= THE MODEL ================= */
const CIRCLES = { F: 'Family', O: 'Ownership', B: 'Business' };
const ROLES = [
  { id: 'F', num: 1, name: 'Family member', short: 'Family only', circles: ['F'], desc: 'Not an owner, and not employed in the family enterprise or in managing the financial capital.', cares: 'Family identity and harmony.', lens: 'How will this affect relationships, traditions, and family cohesion?' },
  { id: 'O', num: 2, name: 'Owner', short: 'Ownership only', circles: ['O'], desc: 'A shareholder who is not employed in the enterprise and not involved in managing the family\'s financial capital. Has their own career.', cares: 'Ownership rights and responsibilities: performance, risk, transparency.', lens: 'Are we growing the family\'s enterprise and capital responsibly?' },
  { id: 'B', num: 3, name: 'Executive', short: 'Business only', circles: ['B'], desc: 'Works in the family enterprise or helps manage the family\'s financial capital; not a family member and not an owner.', cares: 'Operations, customers, and talent.', lens: 'Is this decision practical and good for the enterprise and the financial capital?' },
  { id: 'FO', num: 4, name: 'Family owner', short: 'Family + Ownership', circles: ['F', 'O'], desc: 'A family member who owns shares but does not work in the business.', cares: 'Dividends, the family name, and family values.', lens: 'How do we sustain what we own and meet shareholder expectations?' },
  { id: 'OB', num: 5, name: 'Owner-executive', short: 'Ownership + Business', circles: ['O', 'B'], desc: 'An owner who works in the business but is not part of the family.', cares: 'Performance, and the risks taken to get it.', lens: 'How do we balance performance with responsible risk-taking?' },
  { id: 'FB', num: 6, name: 'Family executive', short: 'Family + Business', circles: ['F', 'B'], desc: 'A family member who works in the business or manages the family\'s financial capital, but is not yet an owner.', cares: 'Merit, credibility, career path, and culture.', lens: 'What is fair, credible, and good for the culture over time?' },
  { id: 'FOB', num: 7, name: 'Family owner-executive', short: 'Family + Ownership + Business', circles: ['F', 'O', 'B'], desc: 'A family member who both owns and works in the business. Wears all three hats, and can be pulled in several directions at once.', cares: 'Making it work for the enterprise, the owners and the family together.', lens: 'How do we make this work for the enterprise, the owners, and the family, at the same time?' }
];
const R = {}; ROLES.forEach(function (r) { R[r.id] = r; });
const FAMILY = 'The Ardens. Arden Holdings, a third-generation building-materials company with €600 million of revenue and 2,400 employees, run by a non-family chief executive since 2022. A family office manages €350 million of financial capital from a partial sale in 2015. Fourteen family members across the third and fourth generations; six of them are shareholders.';
const SITUATIONS = [
  { id: 'ns', num: 1, name: 'Values and purpose', tag: 'The north star', pinned: true, question: 'From the perspective of each character: what are the enterprise and the family\'s financial capital for?',
    fact: 'Before any of the other situations, the table agrees what it is all for. Each character answers from their own seat; the AI drafts a plain-language shared vision for the group to react to and refine. It stays on screen through every situation that follows.',
    qs: [
      { id: 'q1', t: 'What is the enterprise for?', opts: ['To provide for the family, generation after generation', 'To be the best at what it does', 'To keep the family together through shared work', 'To create opportunity for the next generation', 'To serve its customers, its people and its town'] },
      { id: 'q2', t: 'What is the family\'s financial capital for?', opts: ['Security for every branch of the family', 'Freedom for individuals to follow their own path', 'Fuel for new ventures and growth', 'Giving, and the family\'s role in society', 'Keeping the enterprise independent'] },
      { id: 'q3', t: 'What must never be traded away?', opts: ['The family\'s control', 'The family\'s unity', 'Fair treatment of every member', 'The company\'s reputation and its people', 'Each person\'s freedom to choose'] }] },
  { id: 'div', num: 2, name: 'Dividends', tag: 'Distributions or reinvestment', question: 'How do we decide between distributions and reinvestment?',
    fact: 'Arden Holdings earned €48 million last year. The board proposes reinvesting €30 million in a new plant and paying €10 million in dividends, down from €18 million. Two third-generation shareholders rely on the dividend for their income. The fourth generation wants growth. The family office says its portfolio cannot fill the gap for more than two years.',
    qs: [
      { id: 'fear', t: 'What do I fear?', opts: ['That the family becomes dependent on distributions', 'That reinvestment starves the people who need income', 'That the decision is made by whoever argues loudest', 'That the business loses ground while we debate', 'That money becomes the only thing the family talks about'] },
      { id: 'protect', t: 'What do I want to protect?', opts: ['The company\'s ability to invest', 'Members\' income and independence', 'A fair, predictable process', 'The family\'s reputation as a good owner', 'Trust between the generations'] },
      { id: 'need', t: 'What do I need from the others?', opts: ['A written dividend policy, agreed in advance', 'Transparency on the numbers, every year', 'Recognition of what I contribute without a vote', 'A transition, not a cliff', 'To be asked before it is decided'] }] },
  { id: 'ent', num: 3, name: 'Entrepreneurship', tag: 'Funding a new venture', question: 'How and when should the family fund a new venture?',
    fact: 'A fourth-generation cousin, 28, asks the family to invest €4 million in her climate-technology venture. She has two outside investors ready and wants an answer within a month. There is no policy for family ventures. A previous family-funded venture lost €2 million in 2019, and nobody has spoken about it since.',
    qs: [
      { id: 'fear', t: 'What do I fear?', opts: ['That we fund people, not businesses', 'That saying no drives the next generation away', 'That one failure poisons every future request', 'That the enterprise\'s money is treated as a family purse', 'That we decide in a month what deserves a year'] },
      { id: 'protect', t: 'What do I want to protect?', opts: ['The next generation\'s ambition', 'The capital, and the discipline around it', 'Equal treatment of every cousin', 'The separation between family and enterprise money', 'The family\'s name if it goes wrong'] },
      { id: 'need', t: 'What do I need from the others?', opts: ['A venture policy that applies to everyone', 'An independent view before the family votes', 'Honesty about 2019', 'A yes or a no that does not become personal', 'Time to build a proper case'] }] },
  { id: 'emp', num: 4, name: 'Employment policy', tag: 'Rules for family employment', question: 'What are the rules for family employment, in the operating business or in managing the family\'s financial capital?',
    fact: 'Two fourth-generation members want to join the company this year. One has five years at a competitor; the other is finishing university. The non-family chief executive has asked for a written policy: outside experience first, open recruitment, market pay, and no family member reporting to another. The family office also has a vacancy, and no policy at all.',
    qs: [
      { id: 'fear', t: 'What do I fear?', opts: ['That family members are hired because of their name', 'That talented family members are kept out to look fair', 'That non-family managers stop telling the truth', 'That the policy is written for one case and applied to all', 'That the family office becomes the soft landing'] },
      { id: 'protect', t: 'What do I want to protect?', opts: ['The credibility of every family member who works here', 'The chief executive\'s authority', 'A path for the next generation into the enterprise', 'The culture the employees experience', 'The right to make exceptions when they are deserved'] },
      { id: 'need', t: 'What do I need from the others?', opts: ['One policy, written down, applied to everyone', 'Feedback that is honest even when it hurts', 'A mentor who is not my parent', 'Market pay, not family pay', 'A say in the rules before they apply to me'] }] },
  { id: 'liq', num: 5, name: 'Liquidity and sale', tag: 'Sell, or part of it', question: 'Should we sell the business, or part of it?',
    fact: 'An unsolicited offer has arrived for the whole of Arden Holdings at €520 million, about nine times earnings. Three shareholders want to sell, two want to keep it, one has not said. The buyer wants an answer in sixty days and will not commit to keeping the plants open. The town has depended on Arden for seventy years.',
    qs: [
      { id: 'fear', t: 'What do I fear?', opts: ['That we sell what we cannot buy back', 'That we keep a business nobody will run', 'That the people who want out are trapped', 'That the town and the employees pay for our decision', 'That the family splits over the number'] },
      { id: 'protect', t: 'What do I want to protect?', opts: ['The freedom of each shareholder to leave', 'The enterprise as the thing that holds the family together', 'The employees and the town', 'The value that three generations built', 'A process everyone can live with, whatever the answer'] },
      { id: 'need', t: 'What do I need from the others?', opts: ['A way out that does not require selling everything', 'An honest valuation, not a hope', 'Time beyond sixty days', 'To hear why the others want to stay, or go', 'A commitment to the people before the price'] }] },
  { id: 'exp', num: 6, name: 'Expansion and outside capital', tag: 'A third-party investor', question: 'Should we bring in third-party investors to support growth and accommodate the next generation?',
    fact: 'Doubling capacity in Asia needs €120 million. The options: a private-equity minority of 30% with an exit in five years, bank debt at the top of what the board is comfortable with, or slower organic growth. The private-equity partner would also buy out any shareholder who wants liquidity now. The chief executive favours the partner; the founder\'s daughter does not.',
    qs: [
      { id: 'fear', t: 'What do I fear?', opts: ['That an outside investor sets the clock for the family', 'That debt turns one bad year into a crisis', 'That slow growth is a slow decline', 'That liquidity for some becomes pressure on the rest', 'That we lose the freedom to decide for ourselves'] },
      { id: 'protect', t: 'What do I want to protect?', opts: ['The family\'s independence', 'The enterprise\'s competitive position', 'The option for shareholders to leave gracefully', 'The balance sheet', 'The next generation\'s place in what comes next'] },
      { id: 'need', t: 'What do I need from the others?', opts: ['A clear line on what control we will never give up', 'Numbers on all three options, side by side', 'A liquidity mechanism that does not depend on outsiders', 'A voice in the choice of partner', 'Patience with a growth plan that takes longer'] }] }
];
const S = {}; SITUATIONS.forEach(function (s) { S[s.id] = s; });
const THEORY = 'The three-circle model (Tagiuri and Davis, Harvard, 1982) describes a family enterprise as three overlapping systems: family, ownership and business. Everyone connected to the enterprise sits in exactly one of the seven sectors the overlaps create, and each sector has legitimate but different interests. Most conflict in family enterprises is structural, not personal: people argue from the sector they sit in. Seeing the model makes it possible to disagree without blaming.';

/* ================= STATE ================= */
let state = fresh(); let T = { total: 0, left: 0, running: false, endAt: 0 }; let tick = null, audio = null, saveT = null;
function fresh() { return { screen: 'welcome', table: '', players: [], draft: '', roles: {}, claimRole: null, claimName: '', agenda: ['ns'], idx: 0, stage: 'discuss', tab: null, answers: {}, synth: {}, vision: '', visionNotes: '', commits: {}, learned: {}, facts: {}, demo: false, drawer: null, live: {} }; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function claimed() { return ROLES.filter(function (r) { return state.roles[r.id]; }); }
function cur() { return S[state.agenda[state.idx]]; }
function fact(s) { return state.facts[s.id] || s.fact; }

/* ================= TIMER ================= */
function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function setTimer(sec) { stopTimer(); T = { total: sec, left: sec, running: false, endAt: 0 }; }
function startTimer() { if (T.left <= 0) T.left = T.total; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {} T.running = true; T.endAt = Date.now() + T.left * 1000; clearInterval(tick); tick = setInterval(function () { T.left = Math.max(0, Math.round((T.endAt - Date.now()) / 1000)); paintTimer(); if (T.left <= 0) { pauseTimer(); chime(); } }, 250); updateTimerBtn(); }
function pauseTimer() { T.running = false; clearInterval(tick); tick = null; updateTimerBtn(); }
function stopTimer() { clearInterval(tick); tick = null; T.running = false; }
function paintTimer() { const t = document.getElementById('timerText'), ring = document.getElementById('timerRing'); if (t) t.textContent = fmt(T.left); if (ring) { const C = 2 * Math.PI * 66; ring.setAttribute('stroke-dashoffset', String(C * (1 - (T.total ? T.left / T.total : 1)))); } }
function updateTimerBtn() { const b = document.querySelector('[data-act="timerToggle"]'); if (b) b.textContent = T.running ? 'Pause' : 'Start'; }
function timerHTML(presets) { const C = 2 * Math.PI * 66; const f = T.total ? T.left / T.total : 1; return '<div class="timer"><svg viewBox="0 0 150 150" role="img" aria-label="Timer"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="timerRing" cx="75" cy="75" r="66" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - f)) + '" transform="rotate(-90 75 75)"/><text id="timerText" x="75" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="var(--navy)">' + fmt(T.left) + '</text></svg><div class="row" style="justify-content:center"><button class="btn sm" data-act="timerToggle">' + (T.running ? 'Pause' : 'Start') + '</button><button class="btn sm line" data-act="timerReset">Reset</button></div><div class="row" style="justify-content:center">' + presets.map(function (t) { return '<button class="preset ' + (T.total === t ? 'on' : '') + '" data-act="timerSet" data-arg="' + t + '">' + Math.round(t / 60) + ' min</button>'; }).join('') + '</div></div>'; }
function chime() { try { if (!audio) return; [523.25, 659.25, 783.99].forEach(function (f, i) { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audio.destination); const t = audio.currentTime + i * 0.18; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); o.start(t); o.stop(t + 0.75); }); } catch (e) {} }

/* ================= AI ================= */
async function askAI(system, user, json) {
  if (state.demo) throw new Error('demo');
  const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1400, system: system, messages: [{ role: 'user', content: user }] }) });
  if (!res.ok) throw new Error('API ' + res.status);
  const data = await res.json(); const text = (data.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n').trim(); if (!text) throw new Error('empty');
  if (json) { const c = text.replace(/```json|```/g, '').trim(); return JSON.parse(c.slice(c.indexOf('{'), c.lastIndexOf('}') + 1)); } return text;
}
async function runAI(o) { if (state.live[o.key]) return; state.live[o.key] = true; render(); let r, sample = false; try { r = await askAI(o.system, o.user, o.json); if (o.validate && !o.validate(r)) throw new Error('shape'); } catch (e) { await wait(500); r = o.fallback(); sample = true; } delete state.live[o.key]; o.apply(r, sample); render(); save(); }
function answersText(s) { return claimed().map(function (r) { const a = ans(s.id, r.id); return r.short + (state.roles[r.id] ? ' (' + state.roles[r.id] + ')' : '') + ':\n' + s.qs.map(function (q) { return '  ' + q.t + ' ' + (a[q.id] != null ? q.opts[a[q.id]] : '(no choice)') + ((a[q.id + 't'] || '').trim() ? ' | In their own words: ' + a[q.id + 't'].trim() : ''); }).join('\n'); }).join('\n'); }
function synthSystem() { return 'You facilitate a structured exercise for a family enterprise, grounded in the three-circle model (family, ownership, business; seven sectors). Participants are playing roles that are not their real position. Your job is to find common ground, not to decide who is right. ' + THEORY + ' Return only JSON: {"agree":[{"point":"...","roles":["role ids"]}],"differ":[{"point":"...","roles":["role ids"],"why":"one sentence explaining the difference as structural, from the circles the roles sit in"}],"needs":[{"role":"role id","need":"..."}],"collaborate":["three concrete ways the group can work together from here, each one sentence"]' + (cur().id === 'ns' ? ',"vision":"a plain-language shared vision statement of two or three sentences, first person plural, no jargon"' : '') + '}. Use only these role ids: ' + claimed().map(function (r) { return r.id + ' = ' + r.short; }).join(', ') + '. Plain English, specific to what people said, no bullet characters inside strings.'; }
function synthFallback(s) {
  const rs = claimed(); const byOpt = {}; const needs = []; const agree = [], differ = [];
  s.qs.forEach(function (q) { const m = {}; rs.forEach(function (r) { const a = ans(s.id, r.id); if (a[q.id] != null) (m[a[q.id]] = m[a[q.id]] || []).push(r.id); if (q.id === 'need' || q.id === 'q3') needs.push({ role: r.id, need: a[q.id] != null ? q.opts[a[q.id]] : ((a[q.id + 't'] || '').trim() || 'Not stated') }); }); Object.keys(m).forEach(function (k) { const item = { point: q.opts[k], roles: m[k] }; if (m[k].length >= 2) agree.push(item); else differ.push(Object.assign(item, { why: 'Seen from the ' + R[m[k][0]].circles.map(function (c) { return CIRCLES[c].toLowerCase(); }).join(' and ') + ' circle' + (R[m[k][0]].circles.length > 1 ? 's' : '') + ', where ' + R[m[k][0]].cares.toLowerCase().replace(/\.$/, '') + ' come first.' })); }); });
  const out = { agree: agree.slice(0, 6), differ: differ.slice(0, 6), needs: needs.slice(0, 7), collaborate: ['Start every conversation about ' + s.name.toLowerCase() + ' with the north star, and only then the numbers.', 'Agree the process before the outcome: who is consulted, who decides, and by when.', 'Write down what each circle needs from the others, and read it back before the next decision.'] };
  if (s.id === 'ns') { const top = function (q) { const c = {}; rs.forEach(function (r) { const a = ans(s.id, r.id); if (a[q.id] != null) c[a[q.id]] = (c[a[q.id]] || 0) + 1; }); const k = Object.keys(c).sort(function (x, y) { return c[y] - c[x]; })[0]; return k != null ? q.opts[k] : q.opts[0]; }; out.vision = 'Our enterprise exists ' + top(s.qs[0]).charAt(0).toLowerCase() + top(s.qs[0]).slice(1) + '. Our financial capital is for ' + top(s.qs[1]).charAt(0).toLowerCase() + top(s.qs[1]).slice(1) + '. Whatever we decide, we will not trade away ' + top(s.qs[2]).charAt(0).toLowerCase() + top(s.qs[2]).slice(1) + '.'; }
  return out;
}

><p class="small muted">Built only from what the seats chose and wrote. It never says who is right.</p><div class="row gap"><button class="btn sm line" data-act="synth">Read the answers again</button></div></div>') + '</div></div>' : '') + '</div>'; }
  const y = state.synth[s.id]; const cs = state.commits[s.id] || (state.commits[s.id] = (y ? y.collaborate : []).map(function (t) { return { text: t, agreed: false }; }));
  return '<div class="wrap">' + head + '<div class="grid2 top"><div class="panel"><div class="kicker">Second round</div><h3>How we collaborate from here, not who is right</h3><p class="small muted">Three proposals from the synthesis. Edit them, tick the ones the whole table can live with, add your own.</p>' + cs.map(function (c, i) { return '<div class="commit"><input type="checkbox" data-act="agree" data-arg="' + i + '" ' + (c.agreed ? 'checked' : '') + '><textarea class="field" data-model="commit|' + i + '">' + esc(c.text) + '</textarea></div>'; }).join('') + '<div class="row gap"><button class="btn sm line" data-act="addCommit">Add one of our own</button></div></div><div class="stack"><div class="panel">' + timerHTML([180, 300]) + '</div><div class="panel"><h3>Questions for the round</h3><ol class="small"><li>Which of these could your real family sign today?</li><li>Which seat did you understand better after the synthesis?</li><li>What would each circle have to give up for the others?</li></ol></div></div></div></div>';
}
function closeHTML() {
  return '<div class="narrow"><div class="kicker">' + esc(state.table) + '</div><h1 class="display">What this table can agree on</h1>' + (state.vision ? '<div class="northstar top">' + esc(state.vision) + '</div>' : '') + '<div class="panel top record">' + state.agenda.filter(function (id) { return id !== 'ns'; }).map(function (id) { const cs = (state.commits[id] || []).filter(function (c) { return c.agreed && c.text.trim(); }); return '<div class="rr"><b>' + esc(S[id].name) + '</b>' + (cs.length ? '<ul>' + cs.map(function (c) { return '<li>' + esc(c.text) + '</li>'; }).join('') + '</ul>' : '<p class="muted small">No commitment agreed.</p>') + '</div>'; }).join('') + '</div><div class="panel gap"><h3>One thing I now understand about a seat that is not mine</h3>' + claimed().map(function (r) { return '<div class="lbl">' + esc(state.roles[r.id]) + ', ' + esc(r.short) + '</div><input class="field" data-model="learned|' + r.id + '" value="' + esc(state.learned[r.id] || '') + '" placeholder="About the seat of...">'; }).join('') + '</div><p class="small muted top">Nothing here is a decision. It is a record of what one table, playing seats that were not their own, found it could share.</p></div>';
}
function modalHTML() {
  if (!state.claimRole) return ''; const r = R[state.claimRole]; const free = state.players.filter(function (p) { return !Object.keys(state.roles).some(function (k) { return state.roles[k] === p; }); });
  return '<div class="scrim on" data-act="closeClaim"></div><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;pointer-events:none"><div class="panel" style="width:min(560px,100%);pointer-events:auto;border-top:6px solid var(--' + r.id + ')"><div class="kicker" style="color:var(--' + r.id + ')">Seat ' + r.num + '</div><h2 class="display" style="font-size:30px">' + esc(r.short) + '</h2><p class="small gap">' + esc(r.desc) + '</p><p class="lens gap">' + esc(r.lens) + '</p><div class="lbl">Who takes this seat</div><input class="field" id="claimName" data-model="claimName" value="' + esc(state.claimName) + '" placeholder="First name" autocomplete="off">' + (free.length ? '<div class="row gap">' + free.map(function (p) { return '<button class="chip" data-act="claimChip" data-arg="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' : '') + '<div class="row top"><button class="btn" data-act="confirmClaim" ' + (state.claimName.trim() ? '' : 'disabled') + '>Take this seat</button>' + (state.roles[r.id] ? '<button class="btn line" data-act="release">Free the seat</button>' : '') + '<button class="btn ghost" data-act="closeClaim">Cancel</button></div></div></div>';
}
function drawerHTML() {
  const open = !!state.drawer; const s = state.screen === 'situation' ? cur() : null;
  return '<div class="scrim ' + (open ? 'on' : '') + '" data-act="closeDrawer"></div><aside class="drawer ' + (open ? 'open' : '') + '"><div class="dh"><b>Facilitator</b><button class="tool" data-act="closeDrawer">Close</button></div><div class="db">' +
    '<div class="kicker">The model</div><p class="small">' + esc(THEORY) + '</p>' +
    '<div class="nb"><b>Fifteen minutes per situation</b><ol class="small"><li>Discuss, 5 min: read it aloud; each seat speaks once from its lens before anyone replies.</li><li>Answer, 4 min: pass the iPad; three questions each.</li><li>Common ground, 3 min: read the synthesis aloud. Ask which difference surprised them.</li><li>Second round, 3 min: how we collaborate from here. Tick what the whole table can live with.</li></ol></div>' +
    '<div class="nb"><b>Say at the start</b><p class="small">"You are arguing for the seat, not for yourself. If you find yourself agreeing with everyone, you have drifted back into your own chair."</p></div>' +
    (s ? '<div class="nb"><b>Fact pattern: ' + esc(s.name) + '</b><p class="small muted">Edit it here to use the team\'s own version. It saves on this iPad.</p><textarea class="field gap" data-model="fact|' + s.id + '" style="min-height:140px">' + esc(fact(s)) + '</textarea><div class="row gap"><button class="btn sm line" data-act="factReset" data-arg="' + s.id + '">Restore the original</button></div></div>' : '') +
    '<div class="nb settings"><label class="toggle"><input type="checkbox" data-act="toggleDemo" ' + (state.demo ? 'checked' : '') + '> Demo mode: sample AI output, no network</label><button class="btn sm line" data-act="reset">Start a new table</button></div></div></aside>';
}

/* ================= ACTIONS ================= */
function act(a, arg, el, e) {
  const s = state.screen === 'situation' ? cur() : null;
  switch (a) {
    case 'toggleDemo': state.demo = !!el.checked; save(); return 'silent';
    case 'drawer': state.drawer = state.drawer ? null : 'notes'; return true;
    case 'closeDrawer': if (el.classList.contains('scrim') && e.target !== el) return 'silent'; state.drawer = null; return true;
    case 'addPlayer': { const d = state.draft.trim(); if (d && state.players.length < 7) { state.players.push(d); state.draft = ''; } return true; }
    case 'removePlayer': state.players.splice(+arg, 1); return true;
    case 'start': if (!state.table.trim()) return true; state.screen = 'roles'; return true;
    case 'go': state.screen = arg; state.drawer = null; if (arg !== 'situation') stopTimer(); return true;
    case 'claim': state.claimRole = arg; state.claimName = state.roles[arg] || ''; return true;
    case 'claimChip': state.claimName = arg; return true;
    case 'confirmClaim': { const n = state.claimName.trim(); if (!n) return 'silent'; Object.keys(state.roles).forEach(function (k) { if (state.roles[k] === n && k !== state.claimRole) delete state.roles[k]; }); state.roles[state.claimRole] = n; if (state.players.indexOf(n) < 0 && state.players.length < 7) state.players.push(n); state.claimRole = null; state.claimName = ''; return true; }
    case 'release': delete state.roles[state.claimRole]; state.claimRole = null; return true;
    case 'closeClaim': if (el.classList.contains('scrim') && e.target !== el) return 'silent'; state.claimRole = null; return true;
    case 'toggleSit': { const i = state.agenda.indexOf(arg); if (i >= 0) state.agenda.splice(i, 1); else state.agenda.push(arg); state.agenda = SITUATIONS.map(function (x) { return x.id; }).filter(function (id) { return state.agenda.indexOf(id) >= 0; }); return true; }
    case 'begin': state.screen = 'situation'; state.idx = 0; state.stage = 'discuss'; state.tab = null; setTimer(300); return true;
    case 'stage': state.stage = arg; if (arg === 'discuss') setTimer(300); if (arg === 'collaborate') setTimer(180); if (arg !== 'discuss' && arg !== 'collaborate') stopTimer(); return true;
    case 'tab': state.tab = arg; return true;
    case 'pick': { const p = arg.split('|'); const a = ans(s.id, state.tab); a[p[0]] = a[p[0]] === +p[1] ? null : +p[1]; delete state.synth[s.id]; delete state.commits[s.id]; return true; }
    case 'synth': { const sid = s.id; runAI({ key: 'synth-' + sid, system: synthSystem(), user: 'Situation: ' + s.name + '. ' + s.question + '\nFacts: ' + fact(s) + '\n' + (state.vision && sid !== 'ns' ? 'The table\'s north star: ' + state.vision + '\n' : '') + 'Answers:\n' + answersText(s), json: true, validate: function (r) { return r && Array.isArray(r.agree) && Array.isArray(r.differ) && Array.isArray(r.needs) && Array.isArray(r.collaborate); }, fallback: function () { return synthFallback(s); }, apply: function (r, sample) { r.sample = sample; state.synth[sid] = r; if (sid === 'ns' && r.vision && !state.vision) state.vision = r.vision; delete state.commits[sid]; } }); return 'silent'; }
    case 'refine': runAI({ key: 'refine', system: 'You are helping a family-enterprise table refine its shared vision statement. Rewrite the statement using the table\'s notes. Two or three sentences, first person plural, plain language, nothing the notes did not ask for. Return only the statement.', user: 'Current statement: ' + state.vision + '\nThe table\'s notes: ' + (state.visionNotes || 'none') + '\nWhat the seats answered:\n' + answersText(S.ns), json: false, fallback: function () { return state.vision + (state.visionNotes.trim() ? ' And, as the table added: ' + state.visionNotes.trim().replace(/\.$/, '') + '.' : ''); }, apply: function (t) { state.vision = t.trim(); } }); return 'silent';
    case 'agree': { const c = state.commits[s.id][+arg]; if (c) c.agreed = !!el.checked; save(); return 'silent'; }
    case 'addCommit': state.commits[s.id].push({ text: '', agreed: false }); return true;
    case 'nextSit': if (state.idx >= state.agenda.length - 1) { state.screen = 'close'; stopTimer(); } else { state.idx++; state.stage = 'discuss'; state.tab = null; setTimer(300); } return true;
    case 'factReset': delete state.facts[arg]; return true;
    case 'timerToggle': if (T.running) pauseTimer(); else startTimer(); return 'silent';
    case 'timerReset': setTimer(T.total || 300); return true;
    case 'timerSet': setTimer(+arg); return true;
    case 'reset': if (!window.confirm('Start a new table? Roles, answers and the record on this iPad will be cleared.')) return 'silent'; { const d = state.demo; state = fresh(); state.demo = d; stopTimer(); } return true;
  }
  return false;
}
document.addEventListener('click', function (e) { const el = e.target.closest('[data-act]'); if (!el) return; const r = act(el.getAttribute('data-act'), el.getAttribute('data-arg'), el, e); if (r === 'silent') return; if (r) { render(); save(); } });
document.addEventListener('input', function (e) {
  const m = e.target.getAttribute && e.target.getAttribute('data-model'); if (!m) return; const v = e.target.value;
  if (m === 'table') { state.table = v; const b = document.querySelector('[data-act="start"]'); if (b) b.disabled = !v.trim(); }
  else if (m === 'draft') state.draft = v; else if (m === 'claimName') { state.claimName = v; const b = document.querySelector('[data-act="confirmClaim"]'); if (b) b.disabled = !v.trim(); }
  else if (m === 'visionNotes') state.visionNotes = v;
  else if (m.indexOf('own|') === 0) { const a = ans(cur().id, state.tab); a[m.slice(4) + 't'] = v; delete state.synth[cur().id]; }
  else if (m.indexOf('commit|') === 0) { const c = state.commits[cur().id][+m.slice(7)]; if (c) c.text = v; }
  else if (m.indexOf('learned|') === 0) state.learned[m.slice(8)] = v;
  else if (m.indexOf('fact|') === 0) state.facts[m.slice(5)] = v;
  save();
});
document.addEventListener('keydown', function (e) { if (e.key !== 'Enter' || !e.target.getAttribute) return; const m = e.target.getAttribute('data-model'); if (m === 'draft') { e.preventDefault(); act('addPlayer'); render(); save(); const i = document.querySelector('[data-model="draft"]'); if (i) i.focus(); } else if (m === 'claimName') { e.preventDefault(); if (act('confirmClaim') === true) { render(); save(); } } });
render(); load();
})();
</script>
