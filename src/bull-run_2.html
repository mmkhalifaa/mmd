// chunky HUD face — heavy system sans, never default browser text
const HUDF = '"Arial Black", "Arial Bold", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif';

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);
const easeInOutCube = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[(Math.random() * arr.length) | 0];

// deterministic RNG so the skyline is stable across resizes within a run
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mixHex(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, t));
  const g = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, t));
  const bl = Math.round(lerp(a & 255, b & 255, t));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

// viewport metrics, refreshed on resize
const V = { w: 0, h: 0, dpr: 1, horizonY: 0, groundY: 0, S: 1, camH: 1, short: 0, portrait: false };

// camera state
const CAM = { x: 0, bob: 0, zoom: 1, shakeX: 0, shakeY: 0, shake: 0, pitch: 0 };

function resize() {
  const w = Math.max(320, window.innerWidth | 0);
  const h = Math.max(360, window.innerHeight | 0);
  // cap devicePixelRatio at 2, then cap total backing-store pixels so a
  // retina laptop or a 3x phone still has the fill-rate headroom for 60fps
  let dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  const MAX_PX = 3400000;
  if (w * h * dpr * dpr > MAX_PX) dpr = Math.max(1, Math.sqrt(MAX_PX / (w * h)));
  V.w = w; V.h = h; V.dpr = dpr;
  V.portrait = h > w;
  V.short = Math.min(w, h);
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  V.horizonY = Math.round(h * CONFIG.horizonFrac);
  V.groundY  = Math.round(h * CONFIG.groundFrac);
  // uniform world→screen scale: keeps the runner near 13-15% of the viewport
  // and the three tracks filling the frame in both orientations
  V.S = clamp(Math.min(h / 478, w / 276), 0.66, 2.6);
  V.camH = (V.groundY - V.horizonY) / V.S;
  buildSprites();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// horizon with camera bob / quiz pull-back applied
function horizon() { return V.horizonY + CAM.bob + CAM.pitch; }
function scaleNow() { return V.S * CAM.zoom; }

// perspective projection: world (x across, y up, z into screen) → screen px
function projX(worldX, p) { return V.w * 0.5 + (worldX - CAM.x) * p * scaleNow(); }
function projY(worldY, p) { const hy = horizon(); return hy + (V.groundY - hy) * p - worldY * p * scaleNow(); }
function persp(z) { return CONFIG.camDepth / (CONFIG.camDepth + Math.max(z, -CONFIG.camDepth * 0.85)); }

const laneX = i => (i - 1) * CONFIG.laneWidth;   // lanes 0,1,2 → -w, 0, +w

/* ===========================================================================
   ENGINE — 2. Audio (Web Audio API, everything synthesised)
   =========================================================================== */
const Audio_ = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  muted: false, started: false, ambientTimer: 0, step: 0,

  init() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.55; this.musicGain.connect(this.master);
      this.sfxGain   = this.ctx.createGain(); this.sfxGain.gain.value   = 0.85; this.sfxGain.connect(this.master);
      this.started = true;
    } catch (e) { this.started = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
  },
  duck(on) {
    if (!this.started) return;
    this.musicGain.gain.setTargetAtTime(on ? 0.16 : 0.55, this.ctx.currentTime, 0.12);
  },
  tone(freq, dur, type, vol, dest, slideTo) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, filtFreq, sweepTo) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime, len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(filtFreq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    f.Q.value = 0.9;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t); src.stop(t + dur);
  },
  coin()    { this.tone(1180, 0.09, 'triangle', 0.14, null, 1760); },
  jump()    { this.noise(0.16, 0.12, 320, 900); },
  land()    { this.noise(0.11, 0.10, 180, 90); },
  correct() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.tone(f, 0.30, 'sine', 0.15), i * 62)); },
  wrong()   { this.tone(190, 0.34, 'sawtooth', 0.11, null, 78); this.noise(0.24, 0.09, 260, 120); },
  hit()     { this.noise(0.30, 0.20, 150, 60); this.tone(96, 0.26, 'square', 0.09, null, 52); },
  gate()    { this.tone(392, 0.5, 'sine', 0.06, this.musicGain); },
  over()    { [392, 349, 293, 233].forEach((f, i) => setTimeout(() => this.tone(f, 0.5, 'sine', 0.13), i * 165)); },

  // slow ambient pulse — a two-note navy heartbeat under the run
  ambient(dt, speedRatio) {
    if (!this.started || this.muted) return;
    this.ambientTimer -= dt;
    if (this.ambientTimer <= 0) {
      this.ambientTimer = lerp(1.5, 0.92, speedRatio);
      const roots = [65.41, 87.31, 98.0, 73.42];
      const f = roots[this.step % roots.length];
      this.tone(f, 1.25, 'sine', 0.085, this.musicGain);
      this.tone(f * 3, 0.7, 'triangle', 0.022, this.musicGain);
      if (this.step % 4 === 2) this.tone(f * 6, 0.5, 'sine', 0.014, this.musicGain);
      this.step++;
    }
  }
};

/* ===========================================================================
   ENGINE — 3. Input (keyboard + touch)
   =========================================================================== */
const Input = { left:false, right:false, up:false, down:false, anyPress:false, pointer:{x:0,y:0,down:false} };

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', Space:'up', ArrowDown:'down', KeyS:'down',
  KeyP:'pause', Escape:'pause', KeyM:'mute', KeyT:'theme', Enter:'confirm',
};

window.addEventListener('keydown', e => {
  const act = KEYMAP[e.code];
  if (act) e.preventDefault();
  if (e.repeat) return;
  Audio_.init(); Audio_.resume();
  switch (act) {
    case 'left':  Game.onAction('left');  break;
    case 'right': Game.onAction('right'); break;
    case 'up':    Game.onAction('up');    break;
    case 'down':  Game.onAction('down');  break;
    case 'pause': Game.togglePause();     break;
    case 'mute':  Game.toggleMute();      break;
    case 'theme': Game.toggleTheme();     break;
    case 'confirm': Game.onAction('tap'); break;
  }
}, { passive:false });

// --- touch: swipe in four directions, tap to start / dismiss ----------------
let touchStart = null, touchMoved = false;
canvas.addEventListener('touchstart', e => {
  Audio_.init(); Audio_.resume();
  const t = e.changedTouches[0];
  touchStart = { x:t.clientX, y:t.clientY, t:performance.now() };
  touchMoved = false;
  Input.pointer.x = t.clientX; Input.pointer.y = t.clientY; Input.pointer.down = true;
  e.preventDefault();
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (!touchMoved && Math.hypot(dx, dy) > 34) {
    touchMoved = true;
    if (Math.abs(dx) > Math.abs(dy)) Game.onAction(dx > 0 ? 'right' : 'left');
    else Game.onAction(dy > 0 ? 'down' : 'up');
  }
  e.preventDefault();
}, { passive:false });

canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  Input.pointer.down = false;
  if (touchStart && !touchMoved) Game.onTap(t.clientX, t.clientY);
  touchStart = null;
  e.preventDefault();
}, { passive:false });

canvas.addEventListener('mousedown', e => {
  Audio_.init(); Audio_.resume();
  Game.onTap(e.clientX, e.clientY);
});
window.addEventListener('blur', () => { if (Game.state === 'RUNNING' || Game.state === 'FEEDBACK') Game.togglePause(true); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (Game.state === 'RUNNING' || Game.state === 'FEEDBACK')) Game.togglePause(true);
});

/* ===========================================================================
   ENGINE — 4. Persistence (localStorage with in-memory fallback)
   =========================================================================== */
const Store = {
  mem: {},
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? (this.mem[k] !== undefined ? this.mem[k] : d) : v; }
    catch (e) { return this.mem[k] !== undefined ? this.mem[k] : d; }
  },
  set(k, v) {
    this.mem[k] = String(v);
    try { localStorage.setItem(k, String(v)); } catch (e) { /* sandboxed preview — memory only */ }
  }
};

/* ===========================================================================
   ENGINE — 5. Sprite factory
   Everything with a complex silhouette is drawn ONCE into an offscreen canvas
   here, then blitted with drawImage in the frame loop. Cel shading throughout:
   every form gets a base tone, one darker side tone and one lighter top tone.
   =========================================================================== */
function makeC(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function spr(c, ax, ay, hw) { return { c, ax, ay, hw }; }   // anchor + reference height

// blit a sprite so its anchor lands on (x,y) and its reference span is h px tall
function blit(s, x, y, h, alpha, rot) {
  if (!s || h < 0.6) return;
  const k = h / s.hw;
  const w = s.c.width * k, hh = s.c.height * k;
  if (!rot) {                                     // cheap screen-bounds cull
    const x0 = x - s.ax * k, y0 = y - s.ay * k;
    if (x0 > V.w + 4 || x0 + w < -4 || y0 > V.h + 4 || y0 + hh < -4) return;
  }
  if (alpha !== undefined && alpha < 0.999) ctx.globalAlpha = alpha;
  if (rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.drawImage(s.c, -s.ax * k, -s.ay * k, w, hh);
    ctx.restore();
  } else {
    ctx.drawImage(s.c, x - s.ax * k, y - s.ay * k, w, hh);
  }
  if (alpha !== undefined && alpha < 0.999) ctx.globalAlpha = 1;
}

function rr(g, x, y, w, h, r) {
  const k = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
  g.beginPath();
  g.moveTo(x + k, y);
  g.arcTo(x + w, y, x + w, y + h, k);
  g.arcTo(x + w, y + h, x, y + h, k);
  g.arcTo(x, y + h, x, y, k);
  g.arcTo(x, y, x + w, y, k);
  g.closePath();
}
// cel-shaded rounded box: base + darker right/bottom + lighter top band
function celBox(g, x, y, w, h, r, base, dark, light) {
  rr(g, x, y, w, h, r); g.fillStyle = base; g.fill();
  g.save(); rr(g, x, y, w, h, r); g.clip();
  g.fillStyle = dark; g.fillRect(x + w * 0.66, y, w * 0.34, h);
  if (light) { g.fillStyle = light; g.fillRect(x, y, w, h * 0.20); }
  g.restore();
}
function celBall(g, x, y, r, base, dark, light) {
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = base; g.fill();
  g.save(); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.clip();
  g.beginPath(); g.arc(x + r * 0.42, y + r * 0.30, r * 0.95, 0, 6.2832); g.fillStyle = dark; g.fill();
  if (light) { g.beginPath(); g.ellipse(x - r * 0.30, y - r * 0.40, r * 0.44, r * 0.30, -0.5, 0, 6.2832); g.fillStyle = light; g.fill(); }
  g.restore();
}
// soft radial glow sprite in a given colour
function makeGlow(col, size, inner) {
  const c = makeC(size, size), g = c.getContext('2d'), h = size / 2;
  const rg = g.createRadialGradient(h, h, 0, h, h, h);
  rg.addColorStop(0, rgba(col, inner === undefined ? 0.95 : inner));
  rg.addColorStop(0.35, rgba(col, (inner === undefined ? 0.95 : inner) * 0.35));
  rg.addColorStop(1, rgba(col, 0));
  g.fillStyle = rg; g.fillRect(0, 0, size, size);
  return spr(c, h, h, size);
}

/* --- railway tie ---------------------------------------------------------- */

/* --- viaduct arch (day) --------------------------------------------------- */
function bakeArch(dark, rim, variant) {
  const W = 190, H = 330, c = makeC(W, H), g = c.getContext('2d');
  const ax = 24, aw = W - 48, ay = 96, ah = H - ay - 12;
  g.beginPath();
  g.moveTo(ax, H - 12);
  g.lineTo(ax, ay + aw * 0.5);
  g.arc(W / 2, ay + aw * 0.5, aw * 0.5, Math.PI, 0);
  g.lineTo(ax + aw, H - 12);
  g.closePath();
  g.fillStyle = dark; g.fill();
  g.save(); g.clip();
  g.fillStyle = rgba(rim, 0.5); g.fillRect(ax, ay, aw * 0.15, ah);
  g.fillStyle = rgba('#000000', 0.28); g.fillRect(ax + aw * 0.74, ay, aw * 0.26, ah);
  g.restore();
  // keystone + springing blocks
  g.fillStyle = rgba(rim, 0.85);
  rr(g, W / 2 - 13, ay + aw * 0.5 - aw * 0.5 - 14, 26, 22, 4); g.fill();
  // pilasters either side, so the repeating bay reads as structure
  g.fillStyle = rgba(rim, 0.34); g.fillRect(0, 20, 13, H - 20);
  g.fillStyle = rgba('#000000', 0.13); g.fillRect(W - 13, 20, 13, H - 20);
  if (variant) {                            // a small roundel above the arch
    g.beginPath(); g.arc(W / 2, 54, 20, 0, 6.2832); g.fillStyle = dark; g.fill();
    g.beginPath(); g.arc(W / 2, 54, 20, 0, 6.2832);
    g.strokeStyle = rgba(rim, 0.9); g.lineWidth = 6; g.stroke();
  } else {
    g.fillStyle = rgba(rim, 0.55);
    rr(g, 22, 46, W - 44, 12, 5); g.fill();
  }
  return spr(c, W / 2, H, H);
}

/* --- lit building bay (night) -------------------------------------------- */
function bakeWindows(win, halo, frame, variant) {
  const W = 210, H = 390, c = makeC(W, H), g = c.getContext('2d');
  const cols = 3, rows = variant ? 5 : 6;
  const cw = 44, ch = variant ? 52 : 42;
  const gapx = (W - cols * cw) / (cols + 1);
  const gapy = (H - 46 - rows * ch) / (rows + 1);
  for (let r = 0; r < rows; r++) {
    for (let i = 0; i < cols; i++) {
      const lit = ((r * 5 + i * 3 + (variant ? 2 : 0)) % 7) !== 3;
      const x = gapx + i * (cw + gapx), y = 40 + gapy + r * (ch + gapy);
      // sill and lintel so the facade reads as masonry, not a light grid
      celBox(g, x - 5, y - 5, cw + 10, ch + 12, 4, '#8A5638', '#6B4028', '#A06848');
      if (lit) {
        const gl = g.createRadialGradient(x + cw / 2, y + ch / 2, 4, x + cw / 2, y + ch / 2, cw * 1.1);
        gl.addColorStop(0, rgba(halo, 0.34)); gl.addColorStop(1, rgba(halo, 0));
        g.fillStyle = gl; g.fillRect(x - cw * 0.7, y - ch * 0.5, cw * 2.4, ch * 2);
        celBox(g, x, y, cw, ch, 3, win, mixHex(win, '#B07A10', 0.30), '#FFF6CE');
      } else {
        celBox(g, x, y, cw, ch, 3, '#4E3B2C', '#33241A', '#634C3A');
      }
      g.fillStyle = rgba(frame, 0.8);
      g.fillRect(x + cw / 2 - 2, y, 4, ch);
      g.fillRect(x, y + ch / 2 - 2, cw, 4);
    }
  }
  return spr(c, W / 2, H, H);
}

/* --- broccoli tree cluster (day) ----------------------------------------- */
function bakeTreeDay(seed, c1, c2, c3, trunk) {
  const W = 210, H = 230, c = makeC(W, H), g = c.getContext('2d');
  const rng = mulberry32(seed);
  g.fillStyle = trunk; rr(g, W / 2 - 11, H - 62, 22, 62, 6); g.fill();
  const blobs = [];
  for (let i = 0; i < 9; i++) {
    blobs.push({ x: W / 2 + (rng() - 0.5) * 128, y: 66 + rng() * 96, r: 30 + rng() * 30 });
  }
  blobs.sort((a, b) => b.y - a.y);
  for (const b of blobs) celBall(g, b.x, b.y, b.r, c1, c3, c2);
  for (let i = 0; i < 4; i++) {                                 // crown highlights
    celBall(g, W / 2 + (rng() - 0.5) * 90, 58 + rng() * 34, 20 + rng() * 16, c2, c1, '#8FDA6A');
  }
  return spr(c, W / 2, H, H);
}

/* --- decorated conifer (night) ------------------------------------------- */
function bakeTreeNight(seed, c1, c2, c3, snow) {
  const W = 170, H = 250, c = makeC(W, H), g = c.getContext('2d');
  const rng = mulberry32(seed);
  g.fillStyle = '#4A3524'; rr(g, W / 2 - 9, H - 42, 18, 42, 5); g.fill();
  for (let t = 0; t < 4; t++) {
    const w = 132 - t * 26, yb = H - 42 - t * 46, ht = 74;
    g.beginPath();
    g.moveTo(W / 2, yb - ht); g.lineTo(W / 2 + w / 2, yb); g.lineTo(W / 2 - w / 2, yb);
    g.closePath();
    g.fillStyle = c1; g.fill();
    g.save(); g.clip();
    g.fillStyle = c3; g.fillRect(W / 2 + 2, yb - ht, w, ht);
    g.fillStyle = c2; g.fillRect(W / 2 - w * 0.5, yb - ht, w * 0.22, ht);
    g.restore();
    // snow on the branch edge
    g.beginPath();
    g.moveTo(W / 2 - w / 2, yb); g.lineTo(W / 2 + w / 2, yb);
    g.lineTo(W / 2 + w / 2 - 10, yb - 9); g.lineTo(W / 2 - w / 2 + 10, yb - 9);
    g.closePath(); g.fillStyle = snow; g.fill();
    // ornaments
    const orn = ['#E31902', '#FFED6D', '#6AEEFD', '#F7BE76'];
    for (let i = 0; i < 3; i++) {
      const ox = W / 2 + (rng() - 0.5) * w * 0.8, oy = yb - 12 - rng() * 34;
      celBall(g, ox, oy, 6.5, orn[(t + i) % 4], mixHex(orn[(t + i) % 4], '#000000', 0.35), '#FFFFFF');
    }
  }
  celBall(g, W / 2, H - 42 - 4 * 46 - 62, 11, '#FFED6D', '#D9B92E', '#FFFDE0');
  return spr(c, W / 2, H, H);
}

/* --- coin: 8 spin frames + glint ---------------------------------------- */
function bakeCoins() {
  const frames = [], N = 8, S = 84;
  for (let i = 0; i < N; i++) {
    const c = makeC(S, S), g = c.getContext('2d');
    const t = i / N * Math.PI * 2;
    const sx = Math.max(0.13, Math.abs(Math.cos(t)));
    const R = 34;
    g.translate(S / 2, S / 2); g.scale(sx, 1);
    // rim
    g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.fillStyle = '#C08A17'; g.fill();
    g.beginPath(); g.arc(0, 0, R * 0.85, 0, 6.2832); g.fillStyle = '#FFC63C'; g.fill();
    // embossed star
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? R * 0.24 : R * 0.52;
      k ? g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2) : g.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    g.closePath(); g.fillStyle = '#E3A81C'; g.fill();
    g.strokeStyle = 'rgba(255,247,210,0.9)'; g.lineWidth = 2.2; g.stroke();
    // top-left sheen
    g.beginPath(); g.ellipse(-R * 0.34, -R * 0.40, R * 0.30, R * 0.18, -0.6, 0, 6.2832);
    g.fillStyle = 'rgba(255,252,225,0.75)'; g.fill();
    frames.push(spr(c, S / 2, S / 2, S));
  }
  return frames;
}
function bakeGlint() {
  const S = 72, c = makeC(S, S), g = c.getContext('2d'), h = S / 2;
  g.translate(h, h);
  g.fillStyle = '#FFFFFF';
  for (let i = 0; i < 4; i++) {
    g.rotate(Math.PI / 2);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(5, -8); g.lineTo(0, -32); g.lineTo(-5, -8); g.closePath(); g.fill();
  }
  return spr(c, h, h, S);
}

/* --- clouds & moon ------------------------------------------------------- */
function bakeCloud(seed) {
  const W = 300, H = 130, c = makeC(W, H), g = c.getContext('2d');
  const rng = mulberry32(seed);
  for (let i = 0; i < 7; i++) {
    const x = 46 + rng() * (W - 92), y = 56 + rng() * 40, r = 26 + rng() * 30;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = 'rgba(255,255,255,0.92)'; g.fill();
  }
  g.save(); g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(196,228,248,0.85)'; g.fillRect(0, 78, W, H - 78);

}
function bakeMoon() {
  const S = 260, c = makeC(S, S), g = c.getContext('2d'), h = S / 2;
  const rg = g.createRadialGradient(h, h, 40, h, h, h);

  g.fillStyle = rg; g.fillRect(0, 0, S, S);

  g.beginPath(); g.arc(h + 16, h + 10, 8, 0, 6.2832); g.fill();

/* --- distant hills / snowy peaks ---------------------------------------- */
function bakeRidge(seed, base, dark, light, snowCap) {
  const W = 1100, H = 260, c = makeC(W, H), g = c.getContext('2d');
  const rng = mulberry32(seed);
  let x = -40;
  const peaks = [];
  while (x < W + 60) { const w = 150 + rng() * 210, h = 90 + rng() * 150; peaks.push({ x, w, h }); x += w * 0.62; }
  peaks.sort((a, b) => a.h - b.h);
  for (const p of peaks) {
    g.beginPath();
    g.moveTo(p.x, H); g.lineTo(p.x + p.w * 0.5, H - p.h); g.lineTo(p.x + p.w, H);
    g.closePath();
    g.fillStyle = base; g.fill();
    g.save(); g.clip();
    g.fillStyle = dark; g.fillRect(p.x + p.w * 0.5, 0, p.w, H);
    g.fillStyle = light; g.fillRect(p.x, 0, p.w * 0.18, H);
    if (snowCap) {
      g.fillStyle = snowCap;
      g.beginPath();
      g.moveTo(p.x + p.w * 0.5, H - p.h);
      g.lineTo(p.x + p.w * 0.5 + p.h * 0.30, H - p.h * 0.62);
      g.lineTo(p.x + p.w * 0.5 + p.h * 0.16, H - p.h * 0.66);
      g.lineTo(p.x + p.w * 0.5, H - p.h * 0.50);
      g.lineTo(p.x + p.w * 0.5 - p.h * 0.18, H - p.h * 0.64);
      g.lineTo(p.x + p.w * 0.5 - p.h * 0.30, H - p.h * 0.62);
      g.closePath(); g.fill();
    }
    g.restore();
  }
  return spr(c, 0, H, H);
}

/* --- glowing quiz portal ------------------------------------------------ */
function bakeGate(col, deep, pale) {
  const W = 186, H = 340, c = makeC(W, H), g = c.getContext('2d');
  const t = 20, x0 = 12, x1 = W - 12, spring = 168;
  // outer halo
  const rg = g.createRadialGradient(W / 2, H * 0.55, 30, W / 2, H * 0.55, W * 0.85);
  rg.addColorStop(0, rgba(col, 0.35)); rg.addColorStop(1, rgba(col, 0));
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // arch band
  g.lineCap = 'butt';
  const path = () => {
    g.beginPath();
    g.moveTo(x0, H - 6);
    g.lineTo(x0, spring);
    g.arc(W / 2, spring, (x1 - x0) / 2, Math.PI, 0);
    g.lineTo(x1, H - 6);
  };
  g.lineWidth = t + 12; g.strokeStyle = rgba(pale, 0.35); path(); g.stroke();
  g.lineWidth = t;      g.strokeStyle = col;             path(); g.stroke();
  g.lineWidth = t * 0.42; g.strokeStyle = pale;          path(); g.stroke();
  g.lineWidth = t * 0.16; g.strokeStyle = '#FFFFFF';
  g.beginPath(); g.moveTo(x0 + t * 0.30, H - 6); g.lineTo(x0 + t * 0.30, spring);
  g.arc(W / 2, spring, (x1 - x0) / 2 - t * 0.30, Math.PI, -Math.PI * 0.55); g.stroke();
  // inner luminous field
  g.save();
  g.beginPath();
  g.moveTo(x0 + t, H - 6); g.lineTo(x0 + t, spring);
  g.arc(W / 2, spring, (x1 - x0) / 2 - t, Math.PI, 0);
  g.lineTo(x1 - t, H - 6); g.closePath();
  const ig = g.createLinearGradient(0, spring - 90, 0, H);
  ig.addColorStop(0, rgba(pale, 0.30)); ig.addColorStop(1, rgba(col, 0.10));
  g.fillStyle = ig; g.fill();
  g.restore();
  // base plinths
  celBox(g, x0 - 8, H - 26, t + 24, 26, 7, deep, mixHex(deep, '#000000', 0.3), col);
  celBox(g, x1 - t - 16, H - 26, t + 24, 26, 7, deep, mixHex(deep, '#000000', 0.3), col);
  return spr(c, W / 2, H, H);
}

/* --- HUD coin chip ------------------------------------------------------ */
function bakeHudCoin() {
  const S = 64, c = makeC(S, S), g = c.getContext('2d'), h = S / 2;
  g.beginPath(); g.arc(h, h, 26, 0, 6.2832); g.fillStyle = '#C08A17'; g.fill();
  g.beginPath(); g.arc(h, h, 21, 0, 6.2832); g.fillStyle = '#FFC63C'; g.fill();
  g.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, r2 = k % 2 ? 6 : 13;
    k ? g.lineTo(h + Math.cos(a) * r2, h + Math.sin(a) * r2) : g.moveTo(h + Math.cos(a) * r2, h + Math.sin(a) * r2);
  }
  g.closePath(); g.fillStyle = '#E3A81C'; g.fill();
  g.beginPath(); g.ellipse(h - 8, h - 9, 7, 4, -0.6, 0, 6.2832); g.fillStyle = 'rgba(255,252,225,0.8)'; g.fill();
  return spr(c, h, h, S);
}

// sprite metrics — head is ~33% of the runner, per the art bible
const RUN_W = 240, RUN_H = 320, RUN_FOOT = 300, RUN_REF = 278;
const HEAD_Y = 68, HEAD_R = 46, SH_Y = 110, HIP_Y = 178;

function limbSeg(g, x, y, a1, l1, a2, l2, w, col, colD) {
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const fx = kx + Math.sin(a2) * l2, fy = ky + Math.cos(a2) * l2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = colD; g.lineWidth = w;         g.beginPath(); g.moveTo(x, y);   g.lineTo(kx, ky); g.stroke();
  g.strokeStyle = colD; g.lineWidth = w * 0.90;  g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
  g.strokeStyle = col;  g.lineWidth = w * 0.62;  g.beginPath(); g.moveTo(x, y);   g.lineTo(kx, ky); g.stroke();
  g.strokeStyle = col;  g.lineWidth = w * 0.56;  g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
  return [fx, fy, a2];
}

// oversized sneaker; when the heel kicks up we see the tread instead
function drawSneaker(g, x, y, a, showSole, lit) {
  g.save(); g.translate(x, y); g.rotate(a * 0.42);
  if (showSole) {
    celBox(g, -23, -15, 46, 30, 13, KIT.sole, KIT.soleD, '#FFFFFF');
    g.fillStyle = 'rgba(150,166,182,0.55)';
    for (let i = -1; i <= 1; i++) g.fillRect(-15, i * 9 - 2, 30, 4);
    g.fillStyle = KIT.shoeD;
    g.beginPath(); g.ellipse(0, 0, 12, 8, 0, 0, 6.2832); g.fill();
  } else {
    celBox(g, -25, -14, 50, 22, 11, lit ? KIT.shoe : KIT.shoeD, KIT.shoeD, KIT.shoeL);
    celBox(g, -26, 4, 52, 12, 6, KIT.sole, KIT.soleD, '#FFFFFF');
    g.fillStyle = KIT.shoeD; g.fillRect(-8, -12, 5, 14);
    g.fillStyle = KIT.shoeL; g.fillRect(6, -12, 4, 12);
  }
  g.restore();
}

function drawRunner(g, pose, ph) {
  const cx = RUN_W / 2;
  let hipY = HIP_Y, shY = SH_Y, headY = HEAD_Y, headR = HEAD_R;
  let bodyRot = 0, bob = 0, legA, legB, armA, armB, sq = 1;

  if (pose === 'slide') {
    hipY = RUN_FOOT - 58; shY = RUN_FOOT - 96; headY = RUN_FOOT - 138; headR = 44;
    legA = { a1: 1.42, a2: 1.12, sole: true }; legB = { a1: 1.18, a2: 1.50, sole: true };
    armA = { a1: -1.15, a2: -0.35 }; armB = { a1: -0.75, a2: 0.15 };
    bodyRot = 0.20;
  } else if (pose === 'jump') {
    hipY = HIP_Y - 6; shY = SH_Y - 6; headY = HEAD_Y - 6;
    legA = { a1: 1.05, a2: 2.45, sole: false }; legB = { a1: 0.72, a2: 2.20, sole: false };
    armA = { a1: -2.55, a2: -2.95 }; armB = { a1: -2.25, a2: -2.70 };
    bodyRot = -0.05;
  } else {
    const lA = 0.5 + 0.5 * Math.sin(ph), lB = 1 - lA;
    const leg = l => ({ a1: -0.16 + l * 0.46, a2: -0.16 + l * 0.46 + l * l * 2.35, sole: l > 0.60 });
    legA = leg(lA); legB = leg(lB);
    const sw = Math.sin(ph + Math.PI);
    armA = { a1: 0.30 + sw * 0.42, a2: 0.30 + sw * 0.42 - 1.05 - Math.max(0, sw) * 0.55 };
    armB = { a1: -0.30 - sw * 0.42, a2: -0.30 - sw * 0.42 + 1.05 + Math.max(0, -sw) * 0.55 };
    bob = -Math.abs(Math.sin(ph)) * 8;
    bodyRot = Math.sin(ph * 2) * 0.05;
    sq = 1 + Math.sin(ph * 2) * 0.02;
  }
  const dy = bob;

  g.save();
  g.translate(cx, RUN_FOOT + dy); g.rotate(bodyRot); g.scale(1, sq); g.translate(-cx, -(RUN_FOOT + dy));

  // ---- far-side leg and arm, held back in shadow ----
  let f = limbSeg(g, cx - 19, hipY + dy, legB.a1, 55, legB.a2, 55, 30, KIT.pantD, mixHex(KIT.pantD, '#000000', 0.3));
  drawSneaker(g, f[0], f[1], f[2], legB.sole, false);
  f = limbSeg(g, cx - 40, shY + 16 + dy, armB.a1, 36, armB.a2, 32, 21, KIT.hoodD, mixHex(KIT.hoodD, '#000000', 0.3));
  celBall(g, f[0], f[1], 11, KIT.skinD, mixHex(KIT.skinD, '#000000', 0.22), KIT.skin);

  // ---- hoodie torso ----
  celBox(g, cx - 40, shY + dy, 80, hipY - shY + 18, 26, KIT.hood, KIT.hoodD, KIT.hoodL);
  celBox(g, cx - 38, hipY + dy + 8, 76, 16, 8, KIT.hoodD, mixHex(KIT.hoodD, '#000000', 0.22), KIT.hood);
  // shoulder yoke seam
  g.fillStyle = rgba(KIT.hoodD, 0.55); g.fillRect(cx - 36, shY + 22 + dy, 72, 3);

  // ---- backpack, small enough that the hoodie still reads ----
  celBox(g, cx - 28, shY + 14 + dy, 56, 62, 19, KIT.pack, KIT.packD, KIT.packL);
  g.fillStyle = KIT.packD; g.fillRect(cx - 25, shY + 46 + dy, 50, 4);
  celBox(g, cx - 12, shY + 52 + dy, 24, 17, 6, KIT.packD, mixHex(KIT.packD, '#000000', 0.2), KIT.pack);
  celBox(g, cx - 6, shY + 40 + dy, 12, 9, 3, '#FFC63C', '#C08A17', '#FFF0B0');
  g.strokeStyle = KIT.hoodD; g.lineWidth = 11; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - 30, shY + 4 + dy); g.lineTo(cx - 36, shY + 40 + dy); g.stroke();
  g.beginPath(); g.moveTo(cx + 30, shY + 4 + dy); g.lineTo(cx + 36, shY + 40 + dy); g.stroke();
  g.strokeStyle = KIT.hoodL; g.lineWidth = 4;
  g.beginPath(); g.moveTo(cx - 30, shY + 6 + dy); g.lineTo(cx - 35, shY + 38 + dy); g.stroke();
  g.beginPath(); g.moveTo(cx + 30, shY + 6 + dy); g.lineTo(cx + 35, shY + 38 + dy); g.stroke();

  // ---- neck, head, cap ----
  celBox(g, cx - 13, headY + headR * 0.62 + dy, 26, 22, 8, KIT.skinD, mixHex(KIT.skinD, '#000000', 0.2), KIT.skin);
  celBall(g, cx, headY + dy, headR, KIT.skin, KIT.skinD, '#FFD9B8');
  // hair filling the back of the skull below the cap band
  g.save();
  g.beginPath(); g.arc(cx, headY + dy, headR, 0, 6.2832); g.clip();
  celBox(g, cx - headR, headY + dy + 4, headR * 2, headR, 16, '#4A3323', '#33220F', '#63452E');
  g.restore();
  // hood collar bunched at the nape
  celBox(g, cx - 30, headY + headR * 0.72 + dy, 60, 20, 10, KIT.hood, KIT.hoodD, KIT.hoodL);
  // cap: dome, back panel seam, band and adjuster
  g.save();
  g.beginPath(); g.arc(cx, headY + dy + 4, headR * 1.02, Math.PI * 1.0, Math.PI * 2.0); g.closePath();
  g.fillStyle = KIT.cap; g.fill(); g.clip();
  g.fillStyle = KIT.capD; g.fillRect(cx + headR * 0.26, headY + dy - headR * 1.3, headR * 1.5, headR * 2);
  g.fillStyle = KIT.capL;
  g.beginPath(); g.ellipse(cx - headR * 0.34, headY + dy - headR * 0.50, headR * 0.44, headR * 0.22, -0.42, 0, 6.2832); g.fill();
  g.fillStyle = rgba(KIT.capD, 0.6);
  g.fillRect(cx - 1.6, headY + dy - headR, 3.2, headR);
  g.restore();
  celBox(g, cx - headR * 1.02, headY + dy - 4, headR * 2.04, 15, 6, KIT.capD, mixHex(KIT.capD, '#000000', 0.25), KIT.cap);
  celBox(g, cx - 10, headY + dy - 2, 20, 11, 4, '#F4F6F8', '#C9D0D8', '#FFFFFF');
  // brim edges peeking past the skull
  g.fillStyle = KIT.capD;
  g.beginPath(); g.ellipse(cx - headR * 0.94, headY + dy - 12, headR * 0.22, headR * 0.13, 0.35, 0, 6.2832); g.fill();
  g.beginPath(); g.ellipse(cx + headR * 0.94, headY + dy - 12, headR * 0.22, headR * 0.13, -0.35, 0, 6.2832); g.fill();

  // ---- near-side leg and arm, catching the light ----
  f = limbSeg(g, cx + 19, hipY + dy, legA.a1, 55, legA.a2, 55, 32, KIT.pant, KIT.pantD);
  drawSneaker(g, f[0], f[1], f[2], legA.sole, true);
  f = limbSeg(g, cx + 40, shY + 16 + dy, armA.a1, 36, armA.a2, 32, 22, KIT.hood, KIT.hoodD);
  celBall(g, f[0], f[1], 11.5, KIT.skin, KIT.skinD, '#FFE0C6');

  g.restore();
}

function bakeRunner() {
  const frames = [];
  for (let i = 0; i < 8; i++) {
    const c = makeC(RUN_W, RUN_H), g = c.getContext('2d');
    drawRunner(g, 'run', i / 8 * Math.PI * 2);
    frames.push(spr(c, RUN_W / 2, RUN_FOOT, RUN_REF));
  }
  const mk = pose => { const c = makeC(RUN_W, RUN_H), g = c.getContext('2d'); drawRunner(g, pose, 0); return spr(c, RUN_W / 2, RUN_FOOT, RUN_REF); };
  return { run: frames, jump: mk('jump'), slide: mk('slide') };
}

/* --- blob shadow -------------------------------------------------------- */
function bakeShadow() {
  const W = 200, H = 90, c = makeC(W, H), g = c.getContext('2d');
  const rg = g.createRadialGradient(W / 2, H / 2, 4, W / 2, H / 2, W / 2);
  rg.addColorStop(0, 'rgba(20,14,6,0.55)'); rg.addColorStop(0.55, 'rgba(20,14,6,0.30)'); rg.addColorStop(1, 'rgba(20,14,6,0)');
  g.save(); g.translate(W / 2, H / 2); g.scale(1, H / W); g.translate(-W / 2, -H / 2);
  g.fillStyle = rg; g.fillRect(0, 0, W, W);
  g.restore();
  return spr(c, W / 2, H / 2, H);
}

/* --- gravel / snow speckle field (world-space, scrolls with the track) --- */
const GRIT_PERIOD = 1400;
const GRIT = (() => {
  const rng = mulberry32(4711), a = [];
  for (let i = 0; i < 900; i++) {
    a.push({ x: (rng() - 0.5) * 430, z: rng() * GRIT_PERIOD, r: 1.5 + rng() * 3.8, t: rng() });
  }
  return a;
})();

const CLOUDS = (() => {
  const rng = mulberry32(99), a = [];
  for (let i = 0; i < 5; i++) a.push({ x: rng(), y: 0.10 + rng() * 0.42, sp: 0.15 + rng() * 0.3, s: 0.6 + rng() * 0.7, i: i % 3 });
  return a;
})();

const FLAKES = (() => {
  const rng = mulberry32(31337), a = [];
  for (let i = 0; i < 150; i++) a.push({ x: rng(), y: rng(), r: 1.2 + rng() * 3.4, sp: 0.25 + rng() * 0.9, dr: rng() * 6.28 });
  return a;
})();

let SPRITES_READY = false;

  if (SPRITES_READY) return;
  const D = THEMES.day, N = THEMES.night;

                  bakeWindows('#FFD24A', '#FFC24A', '#7A4A2E', 1)];

                  bakeTreeDay(29, D.tree1, D.tree2, D.tree3, '#7A5330'),

                   bakeTreeNight(41, N.tree1, N.tree2, N.tree3, '#EAF4FA')];
  SPR.coin = bakeCoins();

  SPR.hudCoin = bakeHudCoin();

    teal:  bakeGate('#19C6A6', '#0B6E5C', '#C6FEFE'),
    blue:  bakeGate('#3BA7F0', '#1B5C97', '#C6ECFE'),
    amber: bakeGate('#FFB43C', '#9A6410', '#FFEEC0'),

  SPR.glowRed = makeGlow('#E31902', 200, 0.8);
