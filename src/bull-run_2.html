}

/* ===========================================================================
   ENGINE — 6. Entity pools
   =========================================================================== */
function Pool(factory) {
  return { items: [], free: [],
    get() { const o = this.free.length ? this.free.pop() : factory(); o.alive = true; this.items.push(o); return o; },
    release(o) { o.alive = false; this.free.push(o); },
    sweep() { let n = 0; for (let i = 0; i < this.items.length; i++) { const it = this.items[i]; if (it.alive) this.items[n++] = it; } this.items.length = n; },
    clear() { for (const it of this.items) { it.alive = false; this.free.push(it); } this.items.length = 0; }
  };
}

const obstacles = Pool(() => ({ kind:'candle', lane:1, x:0, z:0, w:60, h:80, depth:34, hit:false, alive:false, wob:0 }));
const coins     = Pool(() => ({ lane:1, x:0, y:0, z:0, spin:0, alive:false, taken:false }));
const gates     = Pool(() => ({ lane:1, x:0, z:0, idx:0, correct:false, label:'', alive:false, flash:0 }));
const particles = Pool(() => ({ x:0, y:0, z:0, vx:0, vy:0, vz:0, life:0, max:1, size:1, col:'#fff', grav:0, kind:'spark', alive:false, screen:false, sx:0, sy:0 }));

function spawnParticle(o) {
  if (particles.items.length >= CONFIG.maxParticles) return null;
  const p = particles.get();
  p.x = o.x || 0; p.y = o.y || 0; p.z = o.z || 0;
  p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
  p.life = p.max = o.life || 0.6;
  p.size = o.size || 3; p.col = o.col || PAL.gold;
  p.grav = o.grav === undefined ? -520 : o.grav;
  p.kind = o.kind || 'spark';
  p.screen = !!o.screen; p.sx = o.sx || 0; p.sy = o.sy || 0;
  return p;
}

function burst(x, y, z, n, col, power, kind) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(0.35, 1) * (power || 260);
    spawnParticle({
      x, y, z, vx: Math.cos(a) * s, vy: Math.abs(Math.sin(a)) * s * 1.15 + 55, vz: rand(-25, 110),
      life: rand(0.35, 0.78), size: rand(1.8, 4.4), col: col || PAL.gold, kind: kind || 'spark'
    });
  }
}

/* ===========================================================================
   ENGINE — 7. Game state
   =========================================================================== */
const Game = {
  state: 'MENU',            // MENU · RUNNING · FEEDBACK · PAUSED · GAME_OVER
  prevState: 'MENU',
  time: 0, distance: 0, speed: CONFIG.baseSpeed, timeScale: 1,
  score: 0, coins: 0, shields: CONFIG.shields, streak: 0, bestStreak: 0,
  asked: 0, correct: 0,
  boost: 0, invuln: 0, flashRed: 0, flashGold: 0, flashWhite: 0, nightT: 0,
  themeT: 0, themeForce: null,          // render-only: day → winter-night blend
  nextObstacleDist: 0, nextCoinDist: 0, nextQuizDist: CONFIG.firstQuizDist,
  quiz: null, feedback: null, reviewScroll: 0, best: 0,
  menuT: 0, gameOverT: 0, startedOnce: false,
  bank: { remaining: [], missedQueue: [], missedLog: [], cycles: 0, lastWasRequeue: false },

  player: {
    lane: 1, targetLane: 1, x: 0, fromX: 0, tween: 1,
    y: 0, vy: 0, jumping: false, sliding: false, slideT: 0,
    run: 0, squash: 1, stretch: 1, land: 0, tilt: 0
  },

  /* ---- lifecycle -------------------------------------------------------- */
  reset() {
    this.time = 0; this.distance = 0; this.speed = CONFIG.baseSpeed; this.timeScale = 1;
    this.score = 0; this.coins = 0; this.shields = CONFIG.shields; this.streak = 0; this.bestStreak = 0;
    this.invuln = 0; this.shieldPop = 0;
    this.asked = 0; this.correct = 0; this.boost = 0; this.flashRed = 0; this.flashGold = 0; this.nightT = 0;
    this.flashWhite = 0; this.themeT = 0; this.themeForce = null;
    HUD.score = 0; HUD.coins = 0; HUD.scorePop = 0; HUD.coinPop = 0; HUD.flies.length = 0;
    this.quiz = null; this.feedback = null; this.reviewScroll = 0; this.gameOverT = 0;
    this.nextObstacleDist = 420; this.nextCoinDist = 260; this.nextQuizDist = CONFIG.firstQuizDist;
    obstacles.clear(); coins.clear(); gates.clear(); particles.clear();
    const p = this.player;
    p.lane = p.targetLane = 1; p.x = p.fromX = 0; p.tween = 1;
    p.y = 0; p.vy = 0; p.jumping = false; p.sliding = false; p.slideT = 0;
    p.run = 0; p.squash = 1; p.stretch = 1; p.land = 0; p.tilt = 0;
    CAM.x = 0; CAM.bob = 0; CAM.zoom = 1; CAM.shake = 0; CAM.pitch = 0;
    this.bank.remaining = QUESTION_BANK.map((_, i) => i);
    this.bank.missedQueue = []; this.bank.missedLog = []; this.bank.cycles = 0; this.bank.lastWasRequeue = false;
    this.best = parseFloat(Store.get('bullrun.best', '0')) || 0;
  },

  start() {
    this.reset();
    this.state = 'RUNNING';
    this.startedOnce = true;
    Audio_.init(); Audio_.resume();
  },

  gameOver() {
    if (this.state === 'GAME_OVER') return;
    this.state = 'GAME_OVER';
    this.gameOverT = 0;
    this.timeScale = 1;
    this.quiz = null; this.feedback = null; this.reviewScroll = 0;
    CAM.zoom = 1; CAM.pitch = 0;
    Audio_.duck(false);
    Audio_.over();
    if (this.score > this.best) { this.best = Math.round(this.score); Store.set('bullrun.best', this.best); }
  },

  togglePause(force) {
    if (this.state === 'RUNNING' || this.state === 'FEEDBACK') { this.prevState = this.state; this.state = 'PAUSED'; }
    else if (this.state === 'PAUSED' && !force) { this.state = this.prevState; }
  },

  toggleMute() { Audio_.init(); Audio_.setMuted(!Audio_.muted); },

  // purely cosmetic: flip between the day and winter-night art direction
  toggleTheme() { this.themeForce = (this.themeT > 0.5) ? 0 : 1; },

  /* ---- input routing ---------------------------------------------------- */
  onAction(a) {
    if (this.state === 'MENU') { if (a === 'up' || a === 'tap') this.start(); return; }
    if (this.state === 'GAME_OVER') {
      if (a === 'up' || a === 'tap') { if (this.gameOverT > 0.5) this.start(); }
      else if (a === 'down') this.reviewScroll += 1;
      else if (a === 'left') this.reviewScroll = Math.max(0, this.reviewScroll - 1);
      return;
    }
    if (this.state === 'PAUSED') { if (a === 'tap' || a === 'up') this.togglePause(); return; }
    if (this.state === 'FEEDBACK') { this.dismissFeedback(); return; }
    if (this.state !== 'RUNNING') return;
    const p = this.player;
    if (a === 'left'  && p.targetLane > 0) this.changeLane(p.targetLane - 1);
    if (a === 'right' && p.targetLane < 2) this.changeLane(p.targetLane + 1);
    if (a === 'up' && !p.jumping) {
      p.jumping = true; p.vy = CONFIG.jumpVel; p.sliding = false; p.slideT = 0;
      p.stretch = 1.22; p.squash = 0.86; Audio_.jump();
      for (let i = 0; i < 8; i++) burst(p.x + rand(-18, 18), 2, CONFIG.playerZ + rand(-8, 8), 1, rgba('#B9C6D8', 0.55), 95, 'dust');
    }
    if (a === 'down') {
      if (p.jumping) { p.vy = Math.min(p.vy, -520); }           // fast-fall into a slide
      p.sliding = true; p.slideT = CONFIG.slideMs / 1000;
    }
  },

  changeLane(n) {
    const p = this.player;
    if (n === p.targetLane) return;
    p.fromX = p.x; p.targetLane = n; p.tween = 0; p.tilt = (n > p.lane ? 1 : -1);
    p.lane = n;
    Audio_.tone(520, 0.06, 'sine', 0.05);
  },

  onTap(cx, cy) {
    // HUD hit-tests first (pause / mute chips, top-right)
    if (this.state !== 'MENU') {
      const c = chips(), hitR = c.r * 1.45;
      if (Math.hypot(cx - c.mute.x, cy - c.mute.y) < hitR) { this.toggleMute(); return; }
      if (Math.hypot(cx - c.pause.x, cy - c.pause.y) < hitR &&
          (this.state === 'RUNNING' || this.state === 'PAUSED' || this.state === 'FEEDBACK')) { this.togglePause(); return; }
    }
    if (this.state === 'MENU') { this.start(); return; }
    if (this.state === 'FEEDBACK') { this.dismissFeedback(); return; }
    if (this.state === 'PAUSED') { this.togglePause(); return; }
    if (this.state === 'GAME_OVER') {
      // scroll the review list by tapping its lower half, restart from the button
      if (this.gameOverT > 0.5) {
        if (cy > V.h * 0.80) { this.reviewScroll += 1; return; }
        this.start();
      }
      return;
    }
    // in-run tap: left third / right third steer, middle jumps
    if (this.state === 'RUNNING') {
      if (cx < V.w * 0.33) this.onAction('left');
      else if (cx > V.w * 0.67) this.onAction('right');
      else this.onAction('up');
    }
  },

  /* ---- question selection: tiers, spaced repetition ---------------------- */
  nextQuestion() {
    const b = this.bank;
    // A missed question comes back when it falls due — but never two requeues
    // in a row, so fresh material keeps flowing however badly the run is going.
    if (!b.lastWasRequeue) {
      let best = -1, bestDue = Infinity;
      for (let i = 0; i < b.missedQueue.length; i++) {
        const m = b.missedQueue[i];
        if (m.due <= this.distance && m.due < bestDue) { best = i; bestDue = m.due; }
      }
      if (best >= 0) { b.lastWasRequeue = true; return b.missedQueue.splice(best, 1)[0].idx; }
    }
    b.lastWasRequeue = false;
    if (!b.remaining.length) {                       // bank exhausted → recycle
      b.cycles++;
      b.remaining = QUESTION_BANK.map((_, i) => i);
      if (b.missedQueue.length) {
        const q = b.missedQueue.shift();
        b.remaining = b.remaining.filter(i => i !== q.idx);
        b.lastWasRequeue = true;
        return q.idx;
      }
    }
    const maxTier = this.distance > CONFIG.tier3Dist ? 3 : (this.distance > CONFIG.tier2Dist ? 2 : 1);
    let pool = b.remaining.filter(i => QUESTION_BANK[i].t <= maxTier);
    if (!pool.length) pool = b.remaining.slice();
    // weight toward the lowest available tier so headline views come first
    const lowest = Math.min.apply(null, pool.map(i => QUESTION_BANK[i].t));
    const low = pool.filter(i => QUESTION_BANK[i].t === lowest);
    const idx = (Math.random() < 0.72 || pool.length === low.length) ? pick(low) : pick(pool);
    b.remaining.splice(b.remaining.indexOf(idx), 1);
    return idx;
  },

  /* ---- quiz sequencing --------------------------------------------------- */
  startQuiz() {
    const idx = this.nextQuestion();
    const q = QUESTION_BANK[idx];
    // shuffle option → lane mapping so the answer isn't always in the same place
    const order = [0, 1, 2];
    for (let i = 2; i > 0; i--) { const j = randi(0, i); const t = order[i]; order[i] = order[j]; order[j] = t; }
    const gz = clamp(this.speed * CONFIG.gateLeadSeconds, 620, 1500);
    this.quiz = { idx, q, order, answered: false, gateZ: gz, banner: 0, resolved: false, chosenLane: -1 };
    // clear the track ahead so the set-piece reads cleanly
    for (const o of obstacles.items) if (o.alive && o.z > 190) { o.hit = true; obstacles.release(o); }
    this.nextObstacleDist = this.distance + gz + 260;
    this.nextCoinDist = this.distance + gz + 200;
    for (let i = 0; i < 3; i++) {
      const g = gates.get();
      g.lane = i; g.x = laneX(i); g.z = gz; g.idx = order[i];
      g.correct = (order[i] === q.c); g.label = q.a[order[i]]; g.flash = 0;
    }
    this.asked++;
    Audio_.duck(true); Audio_.gate();
  },

  resolveQuiz(laneIdx) {
    const z = this.quiz;
    if (!z || z.answered) return;
    z.answered = true; z.chosenLane = laneIdx;
    const chosenOption = z.order[laneIdx];
    const right = chosenOption === z.q.c;
    const p = this.player;
    if (right) {
      this.correct++; this.streak++;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
      const mult = clamp(this.streak, 1, CONFIG.maxMultiplier);
      this.score += CONFIG.correctScore * mult;
      this.boost = CONFIG.boostMs / 1000;
      this.flashGold = 0.55;
      // a run of right answers buys back a life — learning is the way to survive
      if (this.streak % CONFIG.shieldPerCorrect === 0 && this.shields < CONFIG.shields) {
        this.shields++;
        this.flashGold = 0.9;
        this.shieldPop = 1;
        Audio_.tone(1046, 0.34, 'sine', 0.13);
        Audio_.tone(1568, 0.30, 'triangle', 0.07);
      }
      burst(p.x, 50, CONFIG.playerZ + 28, 16, '#FFED6D', 250);
      burst(p.x, 46, CONFIG.playerZ + 28, 12, '#6AEEFD', 215);
      burst(p.x, 44, CONFIG.playerZ + 30, 12, '#FFFFFF', 190);
      burst(p.x, 24, CONFIG.playerZ + 32, 12, '#F7BE76', 150);
      Audio_.correct();
      setTimeout(() => Audio_.duck(false), 420);
      this.endQuizSoon();
    } else {
      this.streak = 0;
      this.shields--;
      this.invuln = CONFIG.invulnMs / 1000;
      this.flashRed = 0.75;
      CAM.shake = 1;
      burst(p.x, 40, CONFIG.playerZ + 22, 22, '#D4536A', 300, 'soft');
      Audio_.wrong();
      // record for the end-screen review, once per question
      if (!this.bank.missedLog.some(m => m.idx === z.idx)) this.bank.missedLog.push({ idx: z.idx });
      // one pending requeue per question, so the queue can never outgrow the bank
      if (!this.bank.missedQueue.some(m => m.idx === z.idx)) {
        this.bank.missedQueue.push({ idx: z.idx, due: this.distance + CONFIG.requeueDist });
      }
      if (this.shields <= 0) { this.endQuizSoon(); this.gameOver(); return; }
      this.feedback = { t: 0, q: z.q, correctText: z.q.a[z.q.c] };
      this.state = 'FEEDBACK';
      this.endQuizSoon();
    }
  },

  endQuizSoon() {
    this.nextQuizDist = this.distance + CONFIG.quizIntervalDist;
    if (this.quiz) this.quiz.resolved = true;
  },

  dismissFeedback() {
    if (this.state !== 'FEEDBACK') return;
    this.feedback = null;
    this.state = 'RUNNING';
    this.timeScale = 1;
    Audio_.duck(false);
  },

  hurt(worldX) {
    if (this.state === 'GAME_OVER' || this.invuln > 0) return;   // grace period
    this.shields--; this.streak = 0;
    this.invuln = CONFIG.invulnMs / 1000;
    this.flashRed = 0.7; this.flashWhite = 0.75; CAM.shake = 1.2;
    burst(worldX, 34, CONFIG.playerZ + 14, 18, '#D4536A', 330, 'soft');
    burst(worldX, 20, CONFIG.playerZ + 10, 12, rgba('#B9C6D8', .7), 200, 'dust');
    Audio_.hit();
    this.speed = Math.max(CONFIG.baseSpeed * 0.82, this.speed - 70);
    if (this.shields <= 0) this.gameOver();
  }
};

/* ===========================================================================
   ENGINE — 8. Spawning
   =========================================================================== */
const BEAM_LO = 0.42, BEAM_HI = 0.62;   // gold bar spans these fractions of beam height

const OBSTACLE_KINDS = [
  // candle: tall bearish block — change lane. hurdle: low — jump. beam: overhead — slide.
  { kind:'candle', w:62, h:96,  depth:36, weight:4 },
  { kind:'hurdle', w:74, h:34,  depth:26, weight:4 },
  { kind:'beam',   w:86, h:152, depth:20, weight:2 },
];

function weightedKind() {
  let total = 0; for (const k of OBSTACLE_KINDS) total += k.weight;
  let r = Math.random() * total;
  for (const k of OBSTACLE_KINDS) { r -= k.weight; if (r <= 0) return k; }
  return OBSTACLE_KINDS[0];
}

let lastCluster = [];
function spawnObstacleCluster() {
  let lanes = [0, 1, 2];
  // never block every lane: pick one or two lanes to occupy
  const count = (Math.random() < CONFIG.clusterTwoChance && Game.distance > 1400) ? 2 : 1;
  for (let i = lanes.length - 1; i > 0; i--) { const j = randi(0, i); const t = lanes[i]; lanes[i] = lanes[j]; lanes[j] = t; }
  // bias away from the lanes used last time so the player is never walled in
  lanes.sort((a, b) => (lastCluster.indexOf(a) >= 0 ? 1 : 0) - (lastCluster.indexOf(b) >= 0 ? 1 : 0));
  const chosen = lanes.slice(0, count);
  lastCluster = chosen;
  for (const ln of chosen) {
    const k = weightedKind();
    const o = obstacles.get();
    o.kind = k.kind; o.lane = ln; o.x = laneX(ln); o.z = CONFIG.spawnZ;
    o.w = k.w; o.h = k.h; o.depth = k.depth; o.hit = false; o.wob = Math.random() * 6.28;
  }
}

function spawnCoinRun() {
  const ln = randi(0, 2);
  const n = randi(CONFIG.coinRunMin, CONFIG.coinRunMax);
  const arc = Math.random() < 0.34;                 // an arc of coins rewards a jump
  for (let i = 0; i < n; i++) {
    const c = coins.get();
    c.lane = ln; c.x = laneX(ln); c.z = CONFIG.spawnZ + i * CONFIG.coinSpacing;
    c.y = arc ? 26 + Math.sin((i / (n - 1)) * Math.PI) * 96 : 28;
    c.spin = i * 0.5; c.taken = false;
  }
  return n * CONFIG.coinSpacing;
}

/* ===========================================================================
   ENGINE — 9. Update
   =========================================================================== */
function updatePlayer(dt) {
  const p = Game.player;
  // eased lane tween (no teleporting)
  if (p.tween < 1) {
    p.tween = Math.min(1, p.tween + dt / (CONFIG.laneTweenMs / 1000));
    p.x = lerp(p.fromX, laneX(p.targetLane), easeInOutCube(p.tween));
  } else { p.x = laneX(p.targetLane); }
  p.tilt = lerp(p.tilt, 0, Math.min(1, dt * 9));

  // vertical
  if (p.jumping) {
    p.vy -= CONFIG.gravity * dt;
    p.y += p.vy * dt;
    if (p.y <= 0) {
      p.y = 0; p.vy = 0; p.jumping = false;
      p.squash = 1.24; p.stretch = 0.8; p.land = 0.22;
      Audio_.land();
      for (let i = 0; i < 9; i++) {
        spawnParticle({ x: p.x + rand(-22, 22), y: rand(1, 8), z: CONFIG.playerZ + rand(-10, 10),
          vx: rand(-70, 70), vy: rand(30, 130), vz: rand(-40, 40), life: rand(0.3, 0.6),
          size: rand(2, 5), col: rgba(PAL.cream, 0.34), grav: -260, kind: 'dust' });
      }
    }
  }
  // slide timer
  if (p.sliding) { p.slideT -= dt; if (p.slideT <= 0) { p.sliding = false; p.slideT = 0; } }

  // squash & stretch recovery
  p.squash = lerp(p.squash, 1, Math.min(1, dt * 11));
  p.stretch = lerp(p.stretch, 1, Math.min(1, dt * 11));
  p.land = Math.max(0, p.land - dt);

  // run cycle phase scales with speed
  if (!p.jumping && !p.sliding) p.run += dt * (5.2 + Game.speed / 90);
}

function updateWorld(dt) {
  const G = Game;
  const move = G.speed * dt;
  G.distance += move;
  G.score += move * CONFIG.distanceScore;
  G.nightT = clamp(G.distance / CONFIG.nightDistance, 0, 1);

  // speed ramp + boost, paused during the quiz approach for a cinematic beat
  const target = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + G.time * CONFIG.speedRamp) + (G.boost > 0 ? CONFIG.boostSpeed : 0);
  G.speed = lerp(G.speed, target, Math.min(1, dt * 1.6));
  if (G.boost > 0) G.boost -= dt;
  if (G.invuln > 0) G.invuln = Math.max(0, G.invuln - dt);

  // ---- spawning (suppressed while a quiz set-piece is on screen) ----
  const quizActive = !!G.quiz;
  if (!quizActive) {
    if (G.distance >= G.nextObstacleDist) {
      spawnObstacleCluster();
      const tighten = Math.min(CONFIG.gapTightenPerKm * (G.distance / 1000), 120);
      const gap = Math.max(CONFIG.minGapFloor, rand(CONFIG.obstacleGapMin, CONFIG.obstacleGapMax) - tighten);
      G.nextObstacleDist = G.distance + gap;
    }
    if (G.distance >= G.nextCoinDist) {
      const len = spawnCoinRun();
      G.nextCoinDist = G.distance + len + rand(300, 760);
    }
    if (G.distance >= G.nextQuizDist) G.startQuiz();
  }

  // ---- obstacles ----
  const p = G.player;
  for (const o of obstacles.items) {
    if (!o.alive) continue;
    o.z -= move;
    if (o.z + o.depth < CONFIG.cullZ) { obstacles.release(o); continue; }
    if (o.hit) continue;
    const overlapZ = o.z < CONFIG.playerZ + 24 && o.z + o.depth > CONFIG.playerZ - 24;
    if (!overlapZ) continue;
    if (G.invuln > 0) continue;                       // pass straight through while blinking
    if (Math.abs(p.x - o.x) > o.w * 0.5 + 22) continue;
    let hit = false;
    if (o.kind === 'beam') hit = !p.sliding && p.y < o.h * BEAM_HI;  // duck under (or clear it)
    else if (o.kind === 'hurdle') hit = p.y < o.h - 4;             // hop over
    else hit = p.y < o.h - 10;                                     // tall candle: change lane
    if (hit) { o.hit = true; G.hurt(o.x); }
  }

  // ---- coins ----
  for (const c of coins.items) {
    if (!c.alive) continue;
    c.z -= move; c.spin += dt * 5.4;
    if (c.z < CONFIG.cullZ) { coins.release(c); continue; }
    if (c.taken) continue;
    if (Math.abs(c.z - CONFIG.playerZ) < 26 && Math.abs(p.x - c.x) < 40) {
      const py = p.y + (p.sliding ? 12 : 34);
      if (Math.abs(py - c.y) < 52) {
        c.taken = true; coins.release(c);
        G.coins++; G.score += CONFIG.coinValue;
        Audio_.coin();
        burst(c.x, c.y, c.z, 6, '#FFED6D', 150);
        spawnCoinFly(c.x, c.y, c.z);
      }
    }
    // sparkle trail
    if (c.alive && c.z < 520 && Math.random() < dt * 5) {
      spawnParticle({ x: c.x + rand(-6, 6), y: c.y + rand(-6, 6), z: c.z, vx: 0, vy: rand(6, 26), vz: 0,
        life: rand(0.25, 0.5), size: rand(1.2, 2.4), col: rgba(PAL.goldLight, 0.8), grav: 0, kind: 'spark' });
    }
  }

  // ---- gates ----
  if (G.quiz) {
    const q = G.quiz;
    q.banner = Math.min(1, q.banner + dt * 2.6);
    let anyAlive = false;
    for (const g of gates.items) {
      if (!g.alive) continue;
      g.z -= move; g.flash = Math.max(0, g.flash - dt * 2);
      if (g.z < CONFIG.cullZ - 40) { gates.release(g); continue; }
      anyAlive = true;
      // exactly one answer registers: fire on the frame the gate plane is crossed
      if (!q.answered && g.z <= CONFIG.playerZ) {
        const nearest = clamp(Math.round(p.x / CONFIG.laneWidth) + 1, 0, 2);
        for (const gg of gates.items) if (gg.alive) gg.flash = 1;
        G.resolveQuiz(nearest);
      }
    }
    // camera pull-back on approach, restored once the gates are behind
    const approach = clamp(1 - (gates.items.find(g => g.alive) ? 0 : 1), 0, 1);
    const wantZoom = (!q.answered && approach > 0) ? 0.90 : 1;
    CAM.zoom = lerp(CAM.zoom, wantZoom, Math.min(1, dt * 2.2));
    CAM.pitch = lerp(CAM.pitch, (!q.answered && approach > 0) ? -V.h * 0.022 : 0, Math.min(1, dt * 2.2));
    if (!anyAlive && q.resolved) { G.quiz = null; CAM.zoom = 1; }
    if (!anyAlive && !q.answered) { G.quiz = null; }   // safety valve
  } else {
    CAM.zoom = lerp(CAM.zoom, 1, Math.min(1, dt * 3));
    CAM.pitch = lerp(CAM.pitch, 0, Math.min(1, dt * 3));
  }

  // ---- particles ----
  for (const pt of particles.items) {
    if (!pt.alive) continue;
    pt.life -= dt;
    if (pt.life <= 0) { particles.release(pt); continue; }
    if (pt.screen) { pt.sx += pt.vx * dt; pt.sy += pt.vy * dt; continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.z += pt.vz * dt - move;
    pt.vy += pt.grav * dt;
    if (pt.y < 0) { pt.y = 0; pt.vy *= -0.32; pt.vx *= 0.7; }
  }

  // ---- camera feel ----
  CAM.x = lerp(CAM.x, p.x * 0.34, Math.min(1, dt * 6));
  const bobAmp = V.h * 0.006 * (p.jumping ? 0.2 : 1);
  CAM.bob = Math.sin(p.run * 2) * bobAmp;
  if (CAM.shake > 0) {
    CAM.shake = Math.max(0, CAM.shake - dt * 2.6);
    const m = Math.min(20, CAM.shake * CAM.shake * 15 * clamp(V.S, .8, 1.6));
    CAM.shakeX = rand(-m, m); CAM.shakeY = rand(-m, m);
  } else { CAM.shakeX = CAM.shakeY = 0; }

  G.flashRed = Math.max(0, G.flashRed - dt * 1.7);
  G.flashGold = Math.max(0, G.flashGold - dt * 1.5);
  G.flashWhite = Math.max(0, G.flashWhite - dt * 2.6);
  // cosmetic only — the district turns to winter night deeper into the run
  const wantNight = G.themeForce !== null ? G.themeForce : (G.distance > CONFIG.nightAt ? 1 : 0);
  G.themeT = lerp(G.themeT, wantNight, Math.min(1, dt * 0.55));

  obstacles.sweep(); coins.sweep(); gates.sweep(); particles.sweep();
  Audio_.ambient(dt, clamp((G.speed - CONFIG.baseSpeed) / (CONFIG.maxSpeed - CONFIG.baseSpeed), 0, 1));
}

function update(dt) {
  const G = Game;
  if (G.state === 'MENU') { G.menuT += dt; return; }
  if (G.state === 'PAUSED') return;
  if (G.state === 'GAME_OVER') {
    G.gameOverT += dt;
    for (const pt of particles.items) { if (!pt.alive) continue; pt.life -= dt; if (pt.life <= 0) particles.release(pt); }
    particles.sweep();
    return;
  }
  if (G.state === 'FEEDBACK') {
    G.feedback.t += dt;
    G.timeScale = lerp(G.timeScale, CONFIG.slowMoScale, Math.min(1, dt * 6));
    if (G.feedback.t > CONFIG.feedbackMs / 1000) { G.dismissFeedback(); }
  } else {
    G.timeScale = lerp(G.timeScale, 1, Math.min(1, dt * 5));
  }
  const sdt = dt * G.timeScale;
  G.time += sdt;
  updatePlayer(sdt);
  updateWorld(sdt);
}

/* ===========================================================================
   ENGINE — 10. Rendering: theme blend, sky, parallax, ground, track
   Painter's algorithm throughout: sky → ridge → ground → ballast → ties →
   rails → scenery → shadows → entities → wires → particles → effects → HUD.
   =========================================================================== */

// --- world geometry used only for drawing ---------------------------------
const RAIL_GAUGE = 40;      // distance between the two rails of one track
const RAIL_W     = 6;
const RAIL_H     = 8;
const TIE_W      = 66;
const TIE_SP     = 34;      // world units between ties
const TIE_MAXZ   = 900;
const BALLAST_HALF = 214;
const WALL_X     = 262;   // just outside the ballast, so sky and trees still read
const WALL_H     = 366;   // taller than the camera (≈227u) so walls break the horizon
const ARCH_H     = 336;
const WIN_H      = 366;
const BAY_SP     = 200;
const TREE_SP    = 164;
const POLE_X     = 214;
const POLE_H     = 430;
const POLE_SP    = 430;
const PROP_SP    = 620;
const Z_FAR      = 1500;
const Z_NEAR     = -110;

const hash = n => { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// cached gradients (sky only — everything else is flat cel fill or a sprite)
const GC = { skyKey: '', sky: null };

// shrink a string until it fits, and leave ctx.font set to the result
function fitText(text, maxW, baseSize, weight, family) {
  let fs = Math.max(6, baseSize);
  ctx.font = (weight || '600 ') + fs + 'px ' + (family || 'Georgia, serif');
  while (ctx.measureText(text).width > maxW && fs > 6) {
    fs -= 1;
    ctx.font = (weight || '600 ') + fs + 'px ' + (family || 'Georgia, serif');
  }
  return fs;
}

// --- live theme: day and night blended by Game.themeT ---------------------
const TH = {};
let _thKey = -1;
function themeNow() {
  const t = Game.themeT;
  const k = Math.round(t * 60);
  if (k === _thKey) return TH;
  _thKey = k;
  const D = THEMES.day, N = THEMES.night;
  for (const key in D) TH[key] = (t <= 0) ? D[key] : (t >= 1 ? N[key] : mixHex(D[key], N[key], t));
  return TH;
}

// --- projection helpers ---------------------------------------------------
function groundQuad(xL, xR, z0, z1, fill) {
  const p0 = persp(z0), p1 = persp(z1);
  ctx.beginPath();
  ctx.moveTo(projX(xL, p0), projY(0, p0));
  ctx.lineTo(projX(xR, p0), projY(0, p0));
  ctx.lineTo(projX(xR, p1), projY(0, p1));
  ctx.lineTo(projX(xL, p1), projY(0, p1));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function levelQuad(xL, xR, y, z0, z1, fill) {
  const p0 = persp(z0), p1 = persp(z1);
  ctx.beginPath();
  ctx.moveTo(projX(xL, p0), projY(y, p0));
  ctx.lineTo(projX(xR, p0), projY(y, p0));
  ctx.lineTo(projX(xR, p1), projY(y, p1));
  ctx.lineTo(projX(xL, p1), projY(y, p1));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function wallQuad(x, y0, y1, z0, z1, fill) {
  const p0 = persp(z0), p1 = persp(z1);
  ctx.beginPath();
  ctx.moveTo(projX(x, p0), projY(y0, p0));
  ctx.lineTo(projX(x, p0), projY(y1, p0));
  ctx.lineTo(projX(x, p1), projY(y1, p1));
  ctx.lineTo(projX(x, p1), projY(y0, p1));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function blitW(s, x, y, w, alpha) {
  if (!s || w < 1) return;
  const k = w / s.c.width;
  const x0 = x - s.ax * k, y0 = y - s.ay * k;
  if (x0 > V.w + 4 || x0 + w < -4 || y0 > V.h + 4 || y0 + s.c.height * k < -4) return;
  if (alpha !== undefined && alpha < 0.999) ctx.globalAlpha = alpha;
  ctx.drawImage(s.c, x - s.ax * k, y - s.ay * k, s.c.width * k, s.c.height * k);
  if (alpha !== undefined && alpha < 0.999) ctx.globalAlpha = 1;
}
// world-height blit: sprite reference span = h world units tall at depth z
function blitZ(s, worldX, worldY, z, worldH, alpha, rot) {
  const p = persp(z);
  if (p <= 0.012) return;
  blit(s, projX(worldX, p), projY(worldY, p), worldH * p * scaleNow(), alpha, rot);
}
function blobShadow(worldX, z, worldW, alpha) {
  const p = persp(z);
  if (p <= 0.02) return;
  const w = worldW * p * scaleNow();
  if (w < 2) return;
  blitW(SPR.shadow, projX(worldX, p), projY(0, p), w, alpha);
}

/* --- sky ------------------------------------------------------------------ */
function drawSky() {
  const T = themeNow(), hy = horizon(), t = Game.themeT;
  const key = V.w + 'x' + V.h + '|' + Math.round(t * 60);
  if (GC.skyKey !== key) {
    const g = ctx.createLinearGradient(0, -V.h * 0.06, 0, V.horizonY + V.h * 0.03);
    g.addColorStop(0, T.skyTop); g.addColorStop(0.55, T.skyMid); g.addColorStop(1, T.skyLow);
    GC.sky = g; GC.skyKey = key;
  }
  ctx.fillStyle = GC.sky;
  ctx.fillRect(-70, -V.h * 0.10, V.w + 140, hy + V.h * 0.12);

  // moon fades in with the night theme
  if (t > 0.05) blit(SPR.moon, V.w * 0.30, hy * 0.36, V.short * 0.40, t);

  // drifting clouds (day) — snow takes over at night
  if (t < 0.95) {
    for (const c of CLOUDS) {
      const w = V.short * 0.42 * c.s;
      const x = ((c.x + Game.time * c.sp * 0.014 + Game.distance * 0.000018) % 1.35 - 0.18) * (V.w + w * 2) - w;
      blitW(SPR.cloud[c.i], x, hy * c.y, w, (1 - t) * 0.9);
    }
  }
}

/* --- distant ridge -------------------------------------------------------- */
function drawRidge() {
  const hy = horizon(), t = Game.themeT;
  const h = V.h * 0.17;
  const off = (Game.distance * 0.012) % 1100;
  const w = 1100 * (h / 260);
  const n = Math.ceil(V.w / w) + 1;
  for (let i = -1; i < n; i++) {
    const x = i * w - (off / 1100) * w;
    if (t < 0.98) blitW(SPR.ridgeDay, x, hy + 2, w, (1 - t));
    if (t > 0.02) blitW(SPR.ridgeNight, x, hy + 2, w, t);
  }
}

/* --- ground, ballast, grit ------------------------------------------------ */
function drawGround() {
  const T = themeNow(), hy = horizon();
  ctx.fillStyle = T.beyond;
  ctx.fillRect(-70, hy - 1, V.w + 140, V.h - hy + 70);

  // ballast bed
  groundQuad(-BALLAST_HALF, BALLAST_HALF, Z_NEAR, Z_FAR, T.ground);
  // shoulder shading on both edges
  groundQuad(-BALLAST_HALF, -BALLAST_HALF + 26, Z_NEAR, Z_FAR, T.groundDark);
  groundQuad(BALLAST_HALF - 26, BALLAST_HALF, Z_NEAR, Z_FAR, T.groundDark);

  // stippled grit — real world-space points, so it scrolls and converges.
  // Batched into two paths (light / dark) to keep the state changes at two.
  const S = scaleNow(), off = Game.distance % GRIT_PERIOD;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let i = 0; i < GRIT.length; i++) {
      const gp = GRIT[i];
      if ((gp.t > 0.55) !== (pass === 1)) continue;
      let z = gp.z - off; if (z < Z_NEAR) z += GRIT_PERIOD;
      if (z > 720) continue;
      const pz = persp(z);
      const r = gp.r * pz * S;
      if (r < 0.5) continue;
      const x = projX(gp.x, pz);
      if (x < -20 || x > V.w + 20) continue;
      ctx.rect(x - r * 0.5, projY(0, pz) - r * 0.32, r, r * 0.72);
    }
    ctx.globalAlpha = pass === 1 ? 0.75 : 0.5;
    ctx.fillStyle = pass === 1 ? T.groundLight : T.groundDark;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* --- ties and rails ------------------------------------------------------- */
function drawTrack() {
  const T = themeNow(), S = scaleNow(), t = Game.themeT;
  const off = Game.distance % TIE_SP;
  const nTies = Math.ceil((TIE_MAXZ - Z_NEAR) / TIE_SP);

  // ties, far to near so nearer ones overlap correctly
  for (let i = nTies; i >= 0; i--) {
    const z = i * TIE_SP - off + Z_NEAR;
    if (z < Z_NEAR - TIE_SP || z > TIE_MAXZ) continue;
    const p = persp(z);
    const w = TIE_W * p * S;
    if (w < 1.4) continue;
    const y = projY(0, p);
    for (let ln = 0; ln < 3; ln++) {
      const x = projX(laneX(ln), p);
      if (t < 0.98) blitW(SPR.tieDay, x, y, w, 1 - t);
      if (t > 0.02) blitW(SPR.tieNight, x, y, w, t);
    }
  }

  // rails: dark seat, silver body, specular top line
  for (let ln = 0; ln < 3; ln++) {
    const lx = laneX(ln);
    for (let d = -1; d <= 1; d += 2) {
      const rx = lx + d * RAIL_GAUGE * 0.5;
      levelQuad(rx - RAIL_W * 0.9, rx + RAIL_W * 0.9, 1, Z_NEAR, TIE_MAXZ, T.railLow);
      levelQuad(rx - RAIL_W * 0.5, rx + RAIL_W * 0.5, RAIL_H, Z_NEAR, TIE_MAXZ, T.rail);
      levelQuad(rx - RAIL_W * 0.22, rx + RAIL_W * 0.12, RAIL_H + 0.6, Z_NEAR, TIE_MAXZ, T.railHi);
    }
  }
}

/* --- flanking structures, trees and props -------------------------------- */
function drawScenery() {
  const T = themeNow(), t = Game.themeT, S = scaleNow();

  // trees stand behind the wall, so they are painted first
  const tOff = Game.distance % TREE_SP;
  const tBase = Math.floor(Game.distance / TREE_SP);
  for (let i = Math.ceil((Z_FAR) / TREE_SP); i >= 0; i--) {
    const z = i * TREE_SP - tOff;
    if (z < 130 || z > 860) continue;   // near trees are off-frame and hugely overdrawn
    for (let d = -1; d <= 1; d += 2) {
      const id = (tBase + i) * 2 + (d > 0 ? 1 : 0);
      const h1 = hash(id), h2 = hash(id * 3.1 + 7);
      if (h1 > 0.93) continue;                       // occasional gap in the treeline
      const x = d * (WALL_X + 74 + h2 * 190);
      const hh = 400 + h1 * 150;
      if (t < 0.98) blitZ(SPR.treeDay[Math.floor(h2 * 3) % 3], x, 0, z, hh, 1 - t);
      if (t > 0.02) blitZ(SPR.treeNight[Math.floor(h2 * 2) % 2], x, 0, z, hh * 0.95, t);
    }
  }

  // continuous wall body + coping on both sides
  for (let d = -1; d <= 1; d += 2) {
    const x = d * WALL_X;
    wallQuad(x, 0, WALL_H, Z_NEAR, Z_FAR, d < 0 ? T.wall : T.wallDark);
    wallQuad(x, 0, WALL_H * 0.10, Z_NEAR, 620, rgba('#000000', 0.18));
    // masonry courses so the face is never a flat plane
    wallQuad(x, WALL_H * 0.49, WALL_H * 0.505, Z_NEAR, Z_FAR, rgba('#000000', 0.10));
    wallQuad(x, WALL_H * 0.895, WALL_H * 0.925, Z_NEAR, Z_FAR, T.wallLight);   // string course
    wallQuad(x, WALL_H, WALL_H + 26, Z_NEAR, Z_FAR, T.coping);
    levelQuad(x - 10 * d, x + 10 * d, WALL_H + 26, Z_NEAR, Z_FAR, T.copingTop);
  }

  // arch openings (day) / lit windows (night)
  const bOff = Game.distance % BAY_SP;
  const bBase = Math.floor(Game.distance / BAY_SP);
  for (let i = Math.ceil(Z_FAR / BAY_SP); i >= 0; i--) {
    const z = i * BAY_SP - bOff;
    if (z < Z_NEAR || z > 900) continue;
    for (let d = -1; d <= 1; d += 2) {
      const x = d * WALL_X;
      const v = Math.floor(hash((bBase + i) * 9.13 + (d > 0 ? 4 : 0)) * 2) % 2;
      if (t < 0.98) blitZ(SPR.arch[v], x, 0, z, ARCH_H, (1 - t) * (d < 0 ? 1 : 0.88));
      if (t > 0.02) blitZ(SPR.windows[v], x, 0, z, WIN_H, t);
    }
  }

  // trackside props between the wall and the outer rails
  const pOff = Game.distance % PROP_SP;
  const pBase = Math.floor(Game.distance / PROP_SP);
  for (let i = Math.ceil(Z_FAR / PROP_SP); i >= 0; i--) {
    const z = i * PROP_SP - pOff;
    if (z < -40 || z > 1100) continue;
    const id = pBase + i;
    const h1 = hash(id * 5.7), side = hash(id * 2.3) > 0.5 ? 1 : -1;
    const x = side * (WALL_X - 40);
    blobShadow(x, z, 60, 0.5);
    if (t > 0.5) {
      blitZ(SPR.candy, x, 0, z, 150, 1);
    } else if (h1 < 0.34) blitZ(SPR.signal, x, 0, z, 210, 1);
    else if (h1 < 0.68) blitZ(SPR.sign, x, 0, z, 175, 1);
    else blitZ(SPR.bench, x, 0, z, 78, 1);
  }
}

/* --- catenary poles and overhead wires (drawn late: they pass overhead) --- */
function drawOverhead() {
  const T = themeNow(), t = Game.themeT, S = scaleNow();
  const off = Game.distance % POLE_SP;
  const base = Math.floor(Game.distance / POLE_SP);
  const zs = [];
  for (let i = Math.ceil(Z_FAR / POLE_SP); i >= 0; i--) {
    const z = i * POLE_SP - off;
    if (z < Z_NEAR || z > 1300) continue;
    zs.push(z);
    for (let d = -1; d <= 1; d += 2) {
      const x = d * POLE_X;
      wallQuad(x, 0, POLE_H, z, z + 16, T.pole);
      wallQuad(x - d * 5, 0, POLE_H, z, z + 16, T.poleTop);        // lit edge
      // cross-arm reaching out over the tracks
      levelQuad(x, x - d * (POLE_X + 24), POLE_H - 34, z + 2, z + 14, T.pole);
      levelQuad(x, x - d * (POLE_X + 24), POLE_H - 22, z + 2, z + 14, T.poleTop);
      wallQuad(x - d * (POLE_X + 24), POLE_H - 34, POLE_H, z + 4, z + 12, T.pole);
    }
  }
  // wires / string lights sagging between consecutive poles
  zs.sort((a, b) => b - a);
  const wires = [-94, 0, 94];
  ctx.lineCap = 'round';
  for (let i = 0; i < zs.length - 1; i++) {
    const zA = zs[i], zB = zs[i + 1];
    const pA = persp(zA), pB = persp(zB), pM = persp((zA + zB) * 0.5);
    if (pB <= 0.02) continue;
    for (const wx of wires) {
      const ax = projX(wx, pA), ay = projY(POLE_H - 30, pA);
      const bx = projX(wx, pB), by = projY(POLE_H - 30, pB);
      const sag = 26 * pM * S;                       // control point: 2× the wanted dip
      const cxq = (ax + bx) * 0.5, cyq = (ay + by) * 0.5 + sag * 2;
      ctx.beginPath(); ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(cxq, cyq, bx, by);
      ctx.strokeStyle = T.wire; ctx.lineWidth = Math.max(0.7, 2.6 * pB * S); ctx.stroke();
      if (t > 0.15) {                                   // festive bulbs at night
        const n = 5;
        for (let k = 1; k < n; k++) {
          const u = k / n, iu = 1 - u;
          const px = iu * iu * ax + 2 * iu * u * cxq + u * u * bx;
          const py = iu * iu * ay + 2 * iu * u * cyq + u * u * by;
          const r = Math.max(1, 5 * pB * S);
          ctx.globalAlpha = t;
          blitW(SPR.glowGold, px, py, r * 9);
          ctx.fillStyle = ['#FFED6D', '#E31902', '#6AEEFD', '#C6FEFE'][k % 4];
          ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
  }
}

/* ===========================================================================
   ENGINE — 11. Rendering: obstacles, coins, gates, the runner, particles
   =========================================================================== */

// cel-shaded 3D box: front, one side and the top, each its own flat tone
function celPrism(cx, w, y0, y1, zN, zF, base, dark, light) {
  const x0 = cx - w * 0.5, x1 = cx + w * 0.5;
  const pn = persp(zN), pf = persp(zF);
  const P = (x, y, p) => [projX(x, p), projY(y, p)];
  const nlb = P(x0, y0, pn), nrb = P(x1, y0, pn), nlt = P(x0, y1, pn), nrt = P(x1, y1, pn);
  const flt = P(x0, y1, pf), frt = P(x1, y1, pf), flb = P(x0, y0, pf), frb = P(x1, y0, pf);
  const poly = (pts, col) => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  if (y1 < V.camH) poly([nlt, nrt, frt, flt], light);
  if (cx > CAM.x) poly([nlb, nlt, flt, flb], dark); else poly([nrb, nrt, frt, frb], dark);
  poly([nlb, nrb, nrt, nlt], base);
}

const TRAIN_SKINS = [
  { base: '#2E6FD6', dark: '#1E4C99', light: '#5C9BF0', roof: '#1A3E7E', trim: '#FFED6D' },
  { base: '#E31902', dark: '#A81200', light: '#FF6B4A', roof: '#8A1000', trim: '#FFF3C0' },
  { base: '#F2B21C', dark: '#C1860E', light: '#FFD962', roof: '#9A6410', trim: '#354093' },
];

function drawObstacle(o) {
  const p = persp(o.z);
  if (p <= 0.02) return;
  const S = scaleNow();
  blobShadow(o.x, o.z + o.depth * 0.5, o.w * 1.5, 0.6);

  if (o.kind === 'candle') {
    // parked rolling stock: a chunky carriage you have to steer around
    const sk = TRAIN_SKINS[Math.abs(Math.round(o.wob * 100)) % 3];
    celPrism(o.x, o.w * 0.92, 8, o.h * 0.82, o.z, o.z + o.depth, sk.base, sk.dark, sk.light);
    celPrism(o.x, o.w, o.h * 0.82, o.h, o.z - 1, o.z + o.depth + 1, sk.roof, mixHex(sk.roof, '#000000', 0.3), mixHex(sk.roof, '#FFFFFF', 0.25));
    // window band + headlamp on the face
    const px = projX(o.x, p);
    const wy0 = projY(o.h * 0.52, p), wy1 = projY(o.h * 0.72, p);
    const ww = o.w * 0.62 * p * S;
    ctx.fillStyle = '#C6FEFE';
    ctx.fillRect(px - ww * 0.5, wy1, ww, Math.max(1, wy0 - wy1));
    ctx.fillStyle = rgba('#354093', 0.55);
    ctx.fillRect(px - 1 * p * S, wy1, Math.max(1, 2 * p * S), Math.max(1, wy0 - wy1));
    // undercarriage
    celPrism(o.x, o.w * 0.8, 0, 10, o.z + 2, o.z + o.depth - 2, '#2A3038', '#181C22', '#3C444E');
    const ly = projY(o.h * 0.30, p), lr = Math.max(1.5, 7 * p * S);
    blitW(SPR.glowGold, px, ly, lr * 7, 0.85);
    ctx.fillStyle = '#FFF3C0'; ctx.beginPath(); ctx.arc(px, ly, lr, 0, 6.2832); ctx.fill();

  } else if (o.kind === 'hurdle') {
    // red / white diagonal barrier on steel legs
    celPrism(o.x - o.w * 0.40, 9, 0, o.h * 0.62, o.z + o.depth * 0.3, o.z + o.depth * 0.7, '#C8D0D8', '#96A0AA', '#EEF4F8');
    celPrism(o.x + o.w * 0.40, 9, 0, o.h * 0.62, o.z + o.depth * 0.3, o.z + o.depth * 0.7, '#C8D0D8', '#96A0AA', '#EEF4F8');
    celPrism(o.x, o.w, o.h * 0.55, o.h, o.z, o.z + o.depth, '#F4F6F8', '#CBD3DA', '#FFFFFF');
    // stripes painted across the face
    const x0 = projX(o.x - o.w * 0.5, p), x1 = projX(o.x + o.w * 0.5, p);
    const y1 = projY(o.h, p), y0 = projY(o.h * 0.55, p);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y1, x1 - x0, y0 - y1); ctx.clip();
    ctx.fillStyle = '#E31902';
    const sw = (x1 - x0) / 4.2;
    for (let i = -2; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(x0 + i * sw, y0); ctx.lineTo(x0 + i * sw + sw * 0.5, y0);
      ctx.lineTo(x0 + i * sw + sw * 0.5 + sw * 0.55, y1); ctx.lineTo(x0 + i * sw + sw * 0.55, y1);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

  } else {
    // overhead half-gate: duck under the striped bar
    celPrism(o.x - o.w * 0.47, 10, 0, o.h * 0.95, o.z + o.depth * 0.32, o.z + o.depth * 0.68, '#C8D0D8', '#96A0AA', '#EEF4F8');
    celPrism(o.x + o.w * 0.47, 10, 0, o.h * 0.95, o.z + o.depth * 0.32, o.z + o.depth * 0.68, '#C8D0D8', '#96A0AA', '#EEF4F8');
    celPrism(o.x, o.w * 1.02, o.h * 0.86, o.h * 0.98, o.z, o.z + o.depth, '#354093', '#242C6B', '#4C5AC0');
    // the collider bar, striped
    celPrism(o.x, o.w * 0.96, o.h * BEAM_LO, o.h * BEAM_HI, o.z, o.z + o.depth, '#F4F6F8', '#CBD3DA', '#FFFFFF');
    const x0 = projX(o.x - o.w * 0.48, p), x1 = projX(o.x + o.w * 0.48, p);
    const y1 = projY(o.h * BEAM_HI, p), y0 = projY(o.h * BEAM_LO, p);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y1, x1 - x0, y0 - y1); ctx.clip();
    ctx.fillStyle = '#E31902';
    const sw = (x1 - x0) / 4.2;
    for (let i = -2; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(x0 + i * sw, y0); ctx.lineTo(x0 + i * sw + sw * 0.5, y0);
      ctx.lineTo(x0 + i * sw + sw * 0.5 + sw * 0.55, y1); ctx.lineTo(x0 + i * sw + sw * 0.55, y1);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    if (o.z > 40 && o.z < 640) {
      const fs = clamp(26 * p * scaleNow(), 7, 20);
      ctx.font = '800 ' + fs + 'px ' + HUDF;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFED6D';
      ctx.fillText('SLIDE', projX(o.x, p), projY(o.h * 0.92, p));
    }
  }
}

function drawCoin(c) {
  const p = persp(c.z);
  if (p <= 0.02) return;
  const S = scaleNow();
  const size = 42 * p * S;
  if (size < 1.2) return;
  const bob = Math.sin(c.spin * 0.6 + c.z * 0.02) * 4;
  const x = projX(c.x, p), y = projY(c.y + bob, p);
  blobShadow(c.x, c.z, 34, 0.35 * clamp(1 - c.y / 170, 0.25, 1));
  blitW(SPR.glowGold, x, y, size * 1.8, 0.45);
  const f = ((c.spin * 1.35) | 0) % 8;
  blitW(SPR.coin[(f + 8) % 8], x, y, size);
  // a glint about once a second
  const gl = (Game.time * 0.9 + c.z * 0.013) % 1;
  if (gl < 0.13 && size > 6) blitW(SPR.glint, x - size * 0.22, y - size * 0.24, size * (0.5 + gl * 3), 1 - gl / 0.13);
}

const GATE_ORDER = ['teal', 'blue', 'amber'];

function drawGate(g) {
  const p = persp(g.z);
  if (p <= 0.02) return;
  const S = scaleNow();
  const q = Game.quiz;
  const answered = q ? q.answered : true;
  const isChosen = !!q && answered && q.chosenLane === g.lane;
  let skin = GATE_ORDER[g.lane];
  let dim = 1;
  if (answered) {
    if (g.correct) skin = 'teal';
    else if (isChosen) skin = 'red';
    else dim = 0.35;
  }
  const pulse = 0.86 + 0.14 * Math.sin(Game.time * 5.2 + g.lane * 1.25);
  const H = 224;
  const x = projX(g.x, p), yb = projY(0, p);
  blitW(SPR.glowWhite, x, projY(H * 0.55, p), H * 1.1 * p * S, 0.16 * dim * pulse);
  blitZ(SPR.gate[skin], g.x, 0, g.z, H * (answered && g.correct ? 1.03 : 1) * pulse, dim);

  // answer plate — text stays live so it is always crisp
  const plateY = H * 0.44;
  const pw = CONFIG.laneWidth * 1.00 * p * S;
  const px0 = x - pw * 0.5, py = projY(plateY, p), ph = 40 * p * S;
  if (pw > 26) {
    ctx.globalAlpha = Math.max(dim, 0.8);   // the plate stays legible even when dimmed
    roundRect(px0, py - ph * 0.5, pw, ph, 8 * p * S);
    ctx.fillStyle = 'rgba(11,20,38,0.86)'; ctx.fill();
    ctx.lineWidth = Math.max(1, 2.4 * p * S);
    ctx.strokeStyle = rgba('#FFFFFF', 0.5); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let longest = g.label;
    if (q) for (const o of q.q.a) if (o.length > longest.length) longest = o;
    const fs = fitText(longest, pw * 0.88, Math.max(8, 21 * p * S), '800 ', HUDF);
    ctx.font = '800 ' + fs + 'px ' + HUDF;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(g.label, x, py);
    // lane arrow above the arch shoulder
    ctx.font = '800 ' + Math.max(8, 20 * p * S) + 'px ' + HUDF;
    ctx.fillStyle = '#FFED6D';
    ctx.fillText(['◀', '▲', '▶'][g.lane], x, projY(H * 0.80, p));
    ctx.globalAlpha = 1;
  }
  if (g.flash > 0 && g.correct) blitW(SPR.glowGold, x, projY(H * 0.5, p), H * 2.4 * p * S, g.flash * 0.7);
}

/* --- the runner ----------------------------------------------------------- */
const PLAYER_WORLD_H = 78;
function drawPlayer() {
  const P = Game.player, z = CONFIG.playerZ;
  const p = persp(z), S = scaleNow();
  const airT = clamp(P.y / 210, 0, 1);
  const gx = projX(P.x, p), gy = projY(0, p);

  blobShadow(P.x, z, 74 * (1 - airT * 0.42), 0.85 * (1 - airT * 0.5));

  let s = SPR.runner.run[0];
  if (P.sliding) s = SPR.runner.slide;
  else if (P.jumping) s = SPR.runner.jump;
  else s = SPR.runner.run[(((P.run * 1.35) | 0) % 8 + 8) % 8];

  const h = PLAYER_WORLD_H * p * S;
  const fy = projY(P.y, p);
  const k = h / s.hw;
  const blink = Game.invuln > 0 && (Math.floor(Game.time * 15) & 1) === 0;
  ctx.save();
  if (blink) ctx.globalAlpha = 0.35;
  ctx.translate(gx, fy);
  ctx.rotate(P.tilt * 0.07);
  ctx.scale(P.squash, P.stretch);
  ctx.drawImage(s.c, -s.ax * k, -s.ay * k, s.c.width * k, s.c.height * k);
  ctx.restore();

  if (P.land > 0) {
    const t = clamp(1 - P.land / 0.22, 0, 1);
    const rr2 = (18 + t * 78) * p * S;
    ctx.globalAlpha = (1 - t) * 0.5;
    ctx.strokeStyle = Game.themeT > 0.5 ? '#FFFFFF' : '#EBD8B0';
    ctx.lineWidth = Math.max(1, 3 * p * S);
    ctx.beginPath(); ctx.ellipse(gx, gy, rr2, rr2 * 0.30, 0, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* --- particles, snow and speed lines -------------------------------------- */
function drawParticles() {
  for (let pass = 0; pass < 2; pass++) {
    if (pass === 1) ctx.globalCompositeOperation = 'lighter';
    for (const pt of particles.items) {
      if (!pt.alive) continue;
      const soft = pt.kind === 'dust' || pt.kind === 'soft';
      if ((pass === 0) !== soft) continue;
      if (pt.z < -6) continue;
      const p = persp(pt.z);
      if (p <= 0.02) continue;
      const a = clamp(pt.life / pt.max, 0, 1);
      const x = projX(pt.x, p), y = projY(pt.y, p);
      const r = Math.max(0.4, pt.size * p * scaleNow() * (0.4 + a * 0.6));
      ctx.globalAlpha = pt.kind === 'dust' ? a * 0.5 : (soft ? a * 0.85 : a * 0.95);
      ctx.fillStyle = pt.col;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawSnow() {
  const t = Game.themeT;
  if (t < 0.03) return;
  ctx.fillStyle = '#FFFFFF';
  const dr = Game.time;
  for (let i = 0; i < FLAKES.length; i++) {
    const f = FLAKES[i];
    const y = ((f.y + dr * f.sp * 0.06 + Game.distance * 0.00006) % 1) * V.h;
    const x = ((f.x + Math.sin(dr * 0.5 + f.dr) * 0.012) % 1) * V.w;
    ctx.globalAlpha = t * (0.45 + f.r * 0.14);
    ctx.beginPath(); ctx.arc(x, y, f.r * clamp(V.S * 0.6, 0.6, 1.6), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSpeedLines() {
  const t = clamp((Game.speed - CONFIG.baseSpeed * 1.3) / (CONFIG.maxSpeed - CONFIG.baseSpeed), 0, 1)
          + (Game.boost > 0 ? 0.55 : 0);
  if (t <= 0.02) return;
  const cx = V.w * 0.5, cy = horizon() + (V.groundY - horizon()) * 0.55;
  ctx.strokeStyle = rgba('#FFFFFF', 0.22 * clamp(t, 0, 1));
  ctx.lineWidth = Math.max(1.5, 3 * clamp(V.S, .7, 1.6));
  ctx.lineCap = 'round';
  const n = Math.round(7 + t * 13);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.2832 + Game.time * 0.7;
    const r0 = V.short * (0.42 + (i % 3) * 0.08);
    const r1 = r0 + V.short * (0.12 + t * 0.20);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.9);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.9);
    ctx.stroke();
  }
}

/* --- world composite ------------------------------------------------------ */
const drawList = [];
function drawWorld() {
  drawSky();
  drawRidge();
  drawGround();
  drawTrack();
  drawScenery();

  drawList.length = 0;
  for (const o of obstacles.items) if (o.alive && o.z > CONFIG.cullZ) drawList.push({ z: o.z, t: 0, r: o });
  for (const c of coins.items)     if (c.alive && c.z > CONFIG.cullZ) drawList.push({ z: c.z, t: 1, r: c });
  for (const g of gates.items)     if (g.alive && g.z > CONFIG.cullZ) drawList.push({ z: g.z, t: 2, r: g });
  drawList.push({ z: CONFIG.playerZ, t: 3, r: null });
  drawList.sort((a, b) => b.z - a.z);
  for (const d of drawList) {
    if (d.t === 0) drawObstacle(d.r);
    else if (d.t === 1) drawCoin(d.r);
    else if (d.t === 2) drawGate(d.r);
    else if (Game.state !== 'MENU') drawPlayer();
  }

  drawOverhead();
  drawParticles();
  drawSnow();
  drawSpeedLines();

  if (Game.flashRed > 0) {
    const fg = ctx.createRadialGradient(V.w * 0.5, V.h * 0.55, V.short * 0.10, V.w * 0.5, V.h * 0.55, V.short * 0.85);
    fg.addColorStop(0, rgba('#E31902', Game.flashRed * 0.08));
    fg.addColorStop(1, rgba('#E31902', Game.flashRed * 0.66));
    ctx.fillStyle = fg; ctx.fillRect(0, 0, V.w, V.h);
  }
  if (Game.flashWhite > 0) {
    ctx.fillStyle = rgba('#FFFFFF', Game.flashWhite * 0.55);
    ctx.fillRect(0, 0, V.w, V.h);
  }
  if (Game.flashGold > 0) {
    const g2 = ctx.createRadialGradient(V.w * 0.5, V.h * 0.62, 0, V.w * 0.5, V.h * 0.62, V.short * 0.9);
    g2.addColorStop(0, rgba('#FFD24A', Game.flashGold * 0.42));
    g2.addColorStop(1, rgba('#FFD24A', 0));
    ctx.fillStyle = g2; ctx.fillRect(0, 0, V.w, V.h);
  }
}

/* ===========================================================================
   ENGINE — 12. UI (HUD, quiz banner, cards, menu, pause, end screen)
   =========================================================================== */
const SANS = "'Helvetica Neue', Helvetica, Arial, sans-serif";
const SERIF = "Georgia, 'Times New Roman', serif";

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function panel(x, y, w, h, r, fill, stroke, strokeW) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = fill || rgba(PAL.navyDeep, 0.92); ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeW || 1.2; ctx.stroke(); }
}

function wrap(text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// single line, ellipsised to fit (font must already be set)
function clip1(text, maxW) {
  let t = String(text);
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length > 4 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

/* --- HUD: chunky panels, zero-padded score, yellow multiplier, blue buttons -- */
const HUD = { score: 0, coins: 0, scorePop: 0, coinPop: 0, flies: [] };

// HUD scale is bound by the viewport's narrow axis, so the panels can never
// collide on a phone or grow absurd on a large display
function hudScale() { return clamp(Math.min(V.S, V.w / 400, V.h / 640), 0.60, 1.35); }

function chips() {
  const s = hudScale();
  const r = 24 * s, pad = 13 * s;
  return { s, r, pause: { x: pad + r, y: pad + r }, mute: { x: pad + r * 3.35, y: pad + r } };
}

function hudPanel(x, y, w, h, r) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = 'rgba(14,22,38,0.62)'; ctx.fill();
  ctx.save(); roundRect(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(x, y, w, h * 0.34);
  ctx.restore();
  roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = Math.max(1, 1.6 * V.S * 0.7); ctx.stroke();
}

function squareBtn(cx, cy, r, kind, active) {
  const x = cx - r, y = cy - r, s2 = r * 2;
  roundRect(x, y, s2, s2, r * 0.42);
  ctx.fillStyle = '#1B5C97'; ctx.fill();
  roundRect(x, y, s2, s2 * 0.86, r * 0.42);
  ctx.fillStyle = '#3BA7F0'; ctx.fill();
  ctx.save(); roundRect(x, y, s2, s2 * 0.86, r * 0.42); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fillRect(x, y, s2, s2 * 0.26);
  ctx.restore();
  ctx.fillStyle = '#FFFFFF';
  if (kind === 'pause') {
    if (active) {
      ctx.beginPath(); ctx.moveTo(cx - r * 0.24, cy - r * 0.40); ctx.lineTo(cx + r * 0.40, cy - r * 0.02);
      ctx.lineTo(cx - r * 0.24, cy + r * 0.36); ctx.closePath(); ctx.fill();
    } else {
      roundRect(cx - r * 0.34, cy - r * 0.42, r * 0.24, r * 0.78, r * 0.09); ctx.fill();
      roundRect(cx + r * 0.10, cy - r * 0.42, r * 0.24, r * 0.78, r * 0.09); ctx.fill();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.44, cy - r * 0.20); ctx.lineTo(cx - r * 0.20, cy - r * 0.20);
    ctx.lineTo(cx + r * 0.06, cy - r * 0.46); ctx.lineTo(cx + r * 0.06, cy + r * 0.32);
    ctx.lineTo(cx - r * 0.20, cy + r * 0.08); ctx.lineTo(cx - r * 0.44, cy + r * 0.08);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(1.4, r * 0.11); ctx.lineCap = 'round';
    if (active) {
      ctx.beginPath(); ctx.moveTo(cx + r * 0.22, cy - r * 0.24); ctx.lineTo(cx + r * 0.52, cy + r * 0.20);
      ctx.moveTo(cx + r * 0.52, cy - r * 0.24); ctx.lineTo(cx + r * 0.22, cy + r * 0.20); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx + r * 0.18, cy - r * 0.06, r * 0.22, -0.85, 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + r * 0.18, cy - r * 0.06, r * 0.42, -0.85, 0.85); ctx.stroke();
    }
  }
}

function shieldGlyph(cx, cy, r, filled) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.lineTo(cx + r * 0.84, cy - r * 0.52);
  ctx.quadraticCurveTo(cx + r * 0.84, cy + r * 0.58, cx, cy + r);
  ctx.quadraticCurveTo(cx - r * 0.84, cy + r * 0.58, cx - r * 0.84, cy - r * 0.52);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#FFC63C'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#E3A81C'; ctx.fillRect(cx, cy - r, r, r * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(cx - r, cy - r, r * 2, r * 0.4);
    ctx.restore();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

// coins fly from the pickup point up to the HUD counter
function spawnCoinFly(worldX, worldY, z) {
  if (HUD.flies.length > 14) return;
  const p = persp(z);
  HUD.flies.push({ x: projX(worldX, p), y: projY(worldY, p), t: 0, sp: 0.9 + Math.random() * 0.35,
                   ox: (Math.random() - 0.5) * 60, oy: -40 - Math.random() * 50 });
}
function updateFlies(dt) {
  const c = chips(), tx = V.w - 20 * c.s - 34 * c.s, ty = 22 * c.s + 62 * c.s;
  for (let i = HUD.flies.length - 1; i >= 0; i--) {
    const f = HUD.flies[i];
    f.t += dt * f.sp * 1.7;
    if (f.t >= 1) { HUD.flies.splice(i, 1); HUD.coinPop = 1; continue; }
    const e = easeInOutCube(clamp(f.t, 0, 1));
    const cx = f.x + f.ox, cy = f.y + f.oy;
    const u = 1 - e;
    f.cx = u * u * f.x + 2 * u * e * cx + e * e * tx;
    f.cy = u * u * f.y + 2 * u * e * cy + e * e * ty;
  }
}
function drawFlies() {
  for (const f of HUD.flies) {
    if (f.cx === undefined) continue;
    const sz = lerp(30, 16, f.t) * clamp(V.S, .7, 1.4);
    blitW(SPR.glowGold, f.cx, f.cy, sz * 2.2, 0.5);
    blitW(SPR.coin[((Game.time * 22 + f.t * 30) | 0) % 8], f.cx, f.cy, sz);
  }
}

function drawHUD() {
  const c = chips(), s = c.s;
  const pad = 13 * s;

  // pop animations
  if (Math.round(Game.score) - HUD.score > 20) HUD.scorePop = 1;
  HUD.score = Math.round(Game.score);
  if (Game.coins !== HUD.coins) HUD.coins = Game.coins;
  HUD.scorePop = Math.max(0, HUD.scorePop - 0.055);
  HUD.coinPop = Math.max(0, HUD.coinPop - 0.055);

  squareBtn(c.pause.x, c.pause.y, c.r, 'pause', Game.state === 'PAUSED');
  squareBtn(c.mute.x, c.mute.y, c.r, 'mute', Audio_.muted);

  // ---- score row, top right ----
  ctx.textBaseline = 'middle';
  const scoreTxt = String(Math.min(999999, HUD.score)).padStart(6, '0');
  const fs = 30 * s;
  ctx.font = '900 ' + fs + 'px ' + HUDF;
  const sw = ctx.measureText(scoreTxt).width;
  const rowH = 46 * s;
  const sx = V.w - pad - (sw + 26 * s);
  hudPanel(sx, pad, sw + 26 * s, rowH, 12 * s);
  ctx.save();
  const spop = 1 + HUD.scorePop * 0.16;
  ctx.translate(sx + (sw + 26 * s) * 0.5, pad + rowH * 0.5);
  ctx.scale(spop, spop);
  ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(scoreTxt, 0, 1 * s);
  ctx.restore();

  // multiplier chip, left of the score — or on the row below when space is tight
  const mult = clamp(Math.max(1, Game.streak), 1, CONFIG.maxMultiplier);
  let multBox = null;
  if (Game.streak > 0) {
    ctx.font = '900 ' + (21 * s) + 'px ' + HUDF;
    const mt = '×' + mult;
    const mw = ctx.measureText(mt).width + 22 * s;
    const mx = sx - mw - 8 * s;
    const buttonsRight = c.mute.x + c.r + 10 * s;
    if (mx > buttonsRight) {
      hudPanel(mx, pad + rowH * 0.14, mw, rowH * 0.72, 9 * s);
      ctx.textAlign = 'center'; ctx.fillStyle = '#FFED6D';
      ctx.fillText(mt, mx + mw * 0.5, pad + rowH * 0.50);
    } else {
      multBox = { mt, mw };          // drawn beside the coin panel below
    }
  }

  // ---- coin counter ----
  const cy2 = pad + rowH + 9 * s;
  ctx.font = '900 ' + (22 * s) + 'px ' + HUDF;
  const ct = String(Game.coins);
  const cw = ctx.measureText(ct).width + 54 * s;
  const cx2 = V.w - pad - cw;
  hudPanel(cx2, cy2, cw, 36 * s, 10 * s);
  if (multBox) {
    ctx.font = '900 ' + (19 * s) + 'px ' + HUDF;
    hudPanel(cx2 - multBox.mw - 7 * s, cy2, multBox.mw, 36 * s, 10 * s);
    ctx.textAlign = 'center'; ctx.fillStyle = '#FFED6D';
    ctx.fillText(multBox.mt, cx2 - multBox.mw * 0.5 - 7 * s, cy2 + 19 * s);
    ctx.font = '900 ' + (22 * s) + 'px ' + HUDF;
  }
  const cpop = 1 + HUD.coinPop * 0.30;
  blitW(SPR.hudCoin, cx2 + 21 * s, cy2 + 18 * s, 27 * s * cpop);
  ctx.textAlign = 'right'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(ct, V.w - pad - 14 * s, cy2 + 19 * s);

  // ---- shields, tucked to the left of the coin panel ----
  Game.shieldPop = Math.max(0, (Game.shieldPop || 0) - 0.05);
  const sr = 9.5 * s, sy2 = cy2 + 18 * s;
  const sRight = cx2 - 14 * s - (multBox ? multBox.mw + 7 * s : 0);
  for (let i = 0; i < CONFIG.shields; i++) {
    const on = i < Game.shields;
    const pop = (on && i === Game.shields - 1) ? 1 + Game.shieldPop * 0.55 : 1;
    shieldGlyph(sRight - sr - (CONFIG.shields - 1 - i) * (sr * 2.45), sy2, sr * pop, on);
  }

  // ---- distance, bottom left of the score stack ----
  ctx.font = '900 ' + (14 * s) + 'px ' + HUDF;
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const dm = Math.round(Game.distance / 10) + ' M';
  const dw = ctx.measureText(dm).width + 22 * s;
  hudPanel(pad, pad + c.r * 2 + 10 * s, dw, 28 * s, 9 * s);
  ctx.fillText(dm, pad + 11 * s, pad + c.r * 2 + 24 * s);

  drawFlies();
}

/* --- cartoon title block for the menu ------------------------------------ */
function titleBlock(cx, y, s) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = fitText('BULL RUN', Math.min(V.w * 0.84, 640 * s), 68 * s, '900 ', HUDF);
  ctx.font = '900 ' + fs + 'px ' + HUDF;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#12203A'; ctx.lineWidth = fs * 0.20; ctx.strokeText('BULL RUN', cx, y + fs * 0.06);
  ctx.fillStyle = '#12203A'; ctx.fillText('BULL RUN', cx, y + fs * 0.06);
  ctx.strokeStyle = '#12203A'; ctx.lineWidth = fs * 0.20; ctx.strokeText('BULL RUN', cx, y);
  const g = ctx.createLinearGradient(0, y - fs * 0.55, 0, y + fs * 0.55);
  g.addColorStop(0, '#FFF6C0'); g.addColorStop(0.48, '#FFD24A'); g.addColorStop(0.52, '#F2A81C'); g.addColorStop(1, '#FFE58A');
  ctx.fillStyle = g; ctx.fillText('BULL RUN', cx, y);
}

function drawQuizBanner() {
  const q = Game.quiz;
  if (!q) return;
  const s = clamp(V.S, 0.8, 1.4);
  const t = easeOutCubic(clamp(q.banner, 0, 1));
  const w = Math.min(V.w * 0.88, 700 * s);
  const x = (V.w - w) * 0.5;
  const hudBottom = chips().s * 108 + 14;      // score row + coin row + shields
  const yTarget = Math.max(V.h * (V.portrait ? 0.115 : 0.145), hudBottom);
  const y = lerp(-V.h * 0.2, yTarget, t);

  ctx.font = 'italic 600 ' + (20 * s) + 'px ' + SERIF;
  const lines = wrap(q.q.q, w - 46 * s);
  const h = 30 * s + lines.length * 25 * s;

  ctx.globalAlpha = t;
  panel(x, y, w, h, 8 * s, rgba(PAL.navy, 0.94), rgba(PAL.gold, 0.75), 1.4);
  // gold rule under the header
  ctx.fillStyle = rgba(PAL.gold, 0.85);
  ctx.fillRect(x + 18 * s, y + 9 * s, 26 * s, 1.5);
  ctx.font = '500 ' + (9.5 * s) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.gold, 0.85);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('TIER ' + q.q.t + ' · PICK YOUR LANE', x + 52 * s, y + 10 * s);

  ctx.font = 'italic 600 ' + (20 * s) + 'px ' + SERIF;
  ctx.fillStyle = PAL.cream;
  lines.forEach((ln, i) => ctx.fillText(ln, x + 20 * s, y + 30 * s + i * 25 * s));

  // lane legend chips — one type size across all three
  const cw = w / 3, cy = y + h + 8 * s;
  let longest = q.q.a[0];
  for (const o of q.q.a) if (o.length > longest.length) longest = o;
  const chipFs = fitText(longest, cw - 34 * s, 12.5 * s, '500 ', SANS);
  for (let i = 0; i < 3; i++) {
    const cx0 = x + i * cw + 3 * s, cwid = cw - 6 * s;
    const g = gates.items.find(gg => gg.alive && gg.lane === i);
    const label = g ? g.label : q.q.a[q.order[i]];
    const isChosen = q.answered && q.chosenLane === i;
    const isRight = q.answered && q.order[i] === q.q.c;
    const col = isRight ? PAL.teal : (isChosen ? PAL.red : PAL.gold);
    panel(cx0, cy, cwid, 25 * s, 5 * s, rgba(PAL.navyDeep, 0.86), rgba(col, q.answered ? 0.9 : 0.45), 1.1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 ' + (10 * s) + 'px ' + SANS;
    ctx.fillStyle = rgba(col, 0.95);
    ctx.fillText(['◀', '▲', '▶'][i], cx0 + 12 * s, cy + 13 * s);
    ctx.font = '500 ' + chipFs + 'px ' + SANS;
    ctx.fillStyle = PAL.cream;
    ctx.fillText(label, cx0 + cwid * 0.5 + 8 * s, cy + 13 * s);
  }
  ctx.globalAlpha = 1;
}

function drawFeedbackCard() {
  const f = Game.feedback;
  if (!f) return;
  const s = clamp(V.S, 0.8, 1.4);
  const t = easeOutCubic(clamp(f.t / 0.28, 0, 1));
  const w = Math.min(V.w * 0.9, 560 * s);

  ctx.font = '400 ' + (14 * s) + 'px ' + SERIF;
  const tips = wrap(f.q.k, w - 40 * s);
  const h = (86 + tips.length * 19) * s;
  const x = (V.w - w) * 0.5, y = V.h * 0.5 - h * 0.5 + (1 - t) * 26 * s;

  ctx.globalAlpha = t;
  ctx.fillStyle = 'rgba(3,8,16,0.45)'; ctx.fillRect(0, 0, V.w, V.h);
  panel(x, y, w, h, 9 * s, rgba(PAL.navy, 0.97), rgba(PAL.gold, 0.8), 1.6);
  // red accent bar
  ctx.fillStyle = PAL.red; roundRect(x, y, 4.5 * s, h, 3 * s); ctx.fill();

  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '600 ' + (10.5 * s) + 'px ' + SANS;
  ctx.fillStyle = rgba('#E4808F', 0.95);
  ctx.fillText('NOT QUITE — THE HOUSE VIEW IS', x + 20 * s, y + 15 * s);

  ctx.font = 'italic 700 ' + (21 * s) + 'px ' + SERIF;
  ctx.fillStyle = PAL.goldLight;
  ctx.fillText(f.correctText, x + 20 * s, y + 32 * s);

  ctx.font = '400 ' + (14 * s) + 'px ' + SERIF;
  ctx.fillStyle = rgba(PAL.cream, 0.88);
  tips.forEach((ln, i) => ctx.fillText(ln, x + 20 * s, y + 64 * s + i * 19 * s));

  // auto-dismiss progress
  const pr = clamp(f.t / (CONFIG.feedbackMs / 1000), 0, 1);
  ctx.fillStyle = rgba(PAL.cream, 0.12); ctx.fillRect(x + 20 * s, y + h - 13 * s, w - 40 * s, 2);
  ctx.fillStyle = rgba(PAL.gold, 0.8);  ctx.fillRect(x + 20 * s, y + h - 13 * s, (w - 40 * s) * (1 - pr), 2);
  ctx.font = '400 ' + (9.5 * s) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.cream, 0.4); ctx.textAlign = 'right';
  ctx.fillText('TAP OR PRESS SPACE', x + w - 20 * s, y + h - 27 * s);
  ctx.globalAlpha = 1;
}

// a titled panel used for both start-screen columns
function labelPanel(x, y, w, h, label, s) {
  panel(x, y, w, h, 8 * s, rgba(PAL.navyDeep, 0.80), rgba(PAL.gold, 0.38), 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (9.5 * s) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.gold, 0.92);
  ctx.fillText(label, x + 20 * s, y + 15 * s);
  ctx.fillStyle = rgba(PAL.gold, 0.26);
  ctx.fillRect(x + 20 * s, y + 24 * s, w - 40 * s, 1);
}

function drawMenu() {
  const base = clamp(V.S, 0.72, 1.25);
  const twoCol = !V.portrait && V.w > 720;
  const cx = V.w * 0.5;

  const rows = V.portrait
    ? [['SWIPE ←  →', 'change lane'], ['SWIPE ↑', 'jump'], ['SWIPE ↓', 'slide'], ['TAP', 'start · dismiss']]
    : [['←  →  /  A  D', 'change lane'], ['↑  /  W  /  SPACE', 'jump'], ['↓  /  S', 'slide'], ['P · M · T', 'pause · mute · theme']];
  const rules = [
    'Cross the gate in your answer’s lane',
    '5 shields — a hit or a wrong answer costs 1',
    '2 right in a row earns a shield back',
    'Jump the barriers, slide under the low bars',
  ];

  // measure the whole stack in layout units, then shrink so it always fits
  const ctrlU = 26 + rows.length * 25 + 14;
  const ruleU = 26 + rules.length * 21 + 14;
  const stackU = 144 + (twoCol ? Math.max(ctrlU, ruleU) : ctrlU + 12 + ruleU) + 96;
  const top = V.h * (V.portrait ? 0.155 : 0.115);
  const avail = V.h - top - 62 * base;
  const s = base * clamp(avail / (stackU * base), 0.60, 1);

  ctx.fillStyle = 'rgba(4,10,20,0.42)'; ctx.fillRect(0, 0, V.w, V.h);

  let y = top + 38 * s;
  titleBlock(cx, y, s);
  y += 40 * s;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sub = 'The Global Investment Strategy View · July 2026';
  ctx.font = 'italic 400 ' + fitText(sub, V.w * 0.88, 16 * s, 'italic 400 ', SERIF) + 'px ' + SERIF;
  ctx.fillStyle = rgba(PAL.cream, 0.85);
  ctx.fillText(sub, cx, y); y += 20 * s;

  ctx.fillStyle = rgba(PAL.gold, 0.55);
  ctx.fillRect(cx - 60 * s, y, 120 * s, 1); y += 20 * s;

  const tag = 'Run the district. Cross the right gate. Learn the house view.';
  ctx.font = '400 ' + fitText(tag, V.w * 0.88, 13 * s, '400 ', SANS) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.cream, 0.62);
  ctx.fillText(tag, cx, y); y += 26 * s;

  // ---- the two panels: controls, and how the run actually works ----
  const gap = 12 * s;
  const totalW = Math.min(V.w * 0.92, (twoCol ? 680 : 420) * s);
  const px0 = cx - totalW * 0.5;
  const colW = twoCol ? (totalW - gap) * 0.5 : totalW;
  const ctrlH = ctrlU * s, ruleH = ruleU * s;

  labelPanel(px0, y, colW, ctrlH, 'CONTROLS', s);
  rows.forEach((r, i) => {
    const yy = y + 40 * s + i * 25 * s;
    ctx.textAlign = 'left'; ctx.font = '700 ' + (12 * s) + 'px ' + SANS;
    ctx.fillStyle = rgba(PAL.goldLight, 0.95); ctx.fillText(r[0], px0 + 20 * s, yy);
    ctx.textAlign = 'right'; ctx.font = '400 ' + (12 * s) + 'px ' + SANS;
    ctx.fillStyle = rgba(PAL.cream, 0.66); ctx.fillText(r[1], px0 + colW - 20 * s, yy);
  });

  const rx = twoCol ? px0 + colW + gap : px0;
  const ry = twoCol ? y : y + ctrlH + gap;
  labelPanel(rx, ry, colW, ruleH, 'HOW IT WORKS', s);
  // one type size across all four lines, sized to the longest
  let longest = rules[0];
  for (const r of rules) if (r.length > longest.length) longest = r;
  const rfs = fitText(longest, colW - 46 * s, 12 * s, '400 ', SANS);
  rules.forEach((r, i) => {
    const yy = ry + 40 * s + i * 21 * s;
    ctx.fillStyle = rgba(PAL.gold, 0.85);
    ctx.beginPath(); ctx.arc(rx + 24 * s, yy, 2.4 * s, 0, 6.2832); ctx.fill();
    ctx.textAlign = 'left'; ctx.font = '400 ' + rfs + 'px ' + SANS;
    ctx.fillStyle = rgba(PAL.cream, 0.80);
    ctx.fillText(r, rx + 34 * s, yy);
  });

  y += (twoCol ? Math.max(ctrlH, ruleH) : ctrlH + gap + ruleH) + 26 * s;

  // ---- call to action ----
  const pulse = 0.62 + 0.38 * Math.sin(Game.menuT * 3.1);
  const cw = Math.min(V.w * 0.7, 300 * s), ch = 46 * s;
  const cxx = cx - cw * 0.5;
  panel(cxx, y, cw, ch, ch * 0.5, rgba(PAL.gold, 0.10 + pulse * 0.12), rgba(PAL.gold, 0.55 + pulse * 0.45), 1.6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (15 * s) + 'px ' + SANS;
  ctx.fillStyle = mixHex('#F5F0E6', '#FFF6D8', pulse);
  ctx.fillText(Game.startedOnce ? 'RUN AGAIN' : 'START THE RUN', cx, y + ch * 0.5);

  if (Game.best > 0) {
    ctx.font = '400 ' + (12 * s) + 'px ' + SANS;
    ctx.fillStyle = rgba(PAL.cream, 0.5);
    ctx.fillText('BEST  ' + Math.round(Game.best).toLocaleString(), cx, y + ch + 20 * s);
  }

  // scrim so the footer stays legible over the bright ballast
  const fg = ctx.createLinearGradient(0, V.h - 74 * base, 0, V.h);
  fg.addColorStop(0, 'rgba(4,10,20,0)'); fg.addColorStop(1, 'rgba(4,10,20,0.62)');
  ctx.fillStyle = fg; ctx.fillRect(0, V.h - 74 * base, V.w, 74 * base);

  const disc = 'For educational purposes only. Not investment advice.';
  ctx.font = 'italic 400 ' + fitText(disc, V.w * 0.9, 11.5 * base, 'italic 400 ', SERIF) + 'px ' + SERIF;
  ctx.fillStyle = rgba(PAL.cream, 0.62);
  ctx.fillText(disc, cx, V.h - 24 * base);
  const cnt = QUESTION_BANK.length + ' questions drawn from this month’s views';
  ctx.font = '400 ' + fitText(cnt, V.w * 0.9, 10 * base, '400 ', SANS) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.cream, 0.45);
  ctx.fillText(cnt, cx, V.h - 41 * base);
}

function drawPause() {
  const s = clamp(V.S, 0.8, 1.3);
  ctx.fillStyle = 'rgba(4,10,20,0.72)'; ctx.fillRect(0, 0, V.w, V.h);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'italic 700 ' + (40 * s) + 'px ' + SERIF;
  ctx.fillStyle = PAL.goldLight;
  ctx.fillText('PAUSED', V.w * 0.5, V.h * 0.44);
  const ptxt = 'P or tap to resume  ·  M to mute';
  ctx.font = '400 ' + fitText(ptxt, V.w * 0.86, 13 * s, '400 ', SANS) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.cream, 0.65);
  ctx.fillText(ptxt, V.w * 0.5, V.h * 0.44 + 34 * s);
}

function drawGameOver() {
  const s = clamp(V.S, 0.7, 1.2);
  const t = easeOutCubic(clamp(Game.gameOverT / 0.6, 0, 1));
  ctx.fillStyle = 'rgba(4,10,20,' + (0.80 * t) + ')'; ctx.fillRect(0, 0, V.w, V.h);
  const cx = V.w * 0.5;
  ctx.globalAlpha = t;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'italic 700 ' + fitText('RUN COMPLETE', V.w * 0.8, 34 * s, 'italic 700 ', SERIF) + 'px ' + SERIF;
  ctx.fillStyle = PAL.goldLight;
  ctx.fillText('RUN COMPLETE', cx, V.h * 0.085 + (1 - t) * 20);

  // stats row
  const acc = Game.asked ? Math.round(Game.correct / Game.asked * 100) : 0;
  const stats = [
    ['DISTANCE', Math.round(Game.distance / 10) + ' m'],
    ['COINS', String(Game.coins)],
    ['QUIZ', acc + '%'],
    ['BEST STREAK', String(Game.bestStreak)],
    ['SCORE', String(Math.round(Game.score))],
  ];
  const bw = Math.min(V.w * 0.94, 760 * s), bx = cx - bw * 0.5;
  const by = V.h * 0.125, bh = 56 * s;
  panel(bx, by, bw, bh, 8 * s, rgba(PAL.navyDeep, 0.8), rgba(PAL.gold, 0.45), 1.2);
  stats.forEach((st, i) => {
    const sx = bx + bw * ((i + 0.5) / stats.length);
    ctx.font = '500 ' + (9.5 * s) + 'px ' + SANS;
    ctx.fillStyle = rgba(PAL.cream, 0.45); ctx.fillText(st[0], sx, by + 17 * s);
    ctx.font = '600 ' + (19 * s) + 'px ' + SANS;
    ctx.fillStyle = st[0] === 'SCORE' ? PAL.goldLight : PAL.cream;
    ctx.fillText(st[1], sx, by + 38 * s);
    if (i) { ctx.fillStyle = rgba(PAL.gold, 0.20); ctx.fillRect(bx + bw * (i / stats.length), by + 12 * s, 1, bh - 24 * s); }
  });

  if (Math.round(Game.score) >= Game.best && Game.best > 0) {
    ctx.font = '600 ' + (11 * s) + 'px ' + SANS;
    ctx.fillStyle = PAL.teal;
    ctx.fillText('NEW PERSONAL BEST', cx, by + bh + 13 * s);
  }

  // ---- review list: every question missed, with the correct answer --------
  const listY = by + bh + 28 * s;
  const listH = V.h * 0.885 - listY;
  ctx.textAlign = 'left';
  ctx.font = '600 ' + (11 * s) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.gold, 0.9);
  ctx.fillText('REVIEW · WHAT TO TAKE AWAY', bx, listY);
  ctx.fillStyle = rgba(PAL.gold, 0.3); ctx.fillRect(bx, listY + 9 * s, bw, 1);

  const log = Game.bank.missedLog;
  if (!log.length) {
    ctx.font = 'italic 400 ' + (15 * s) + 'px ' + SERIF;
    ctx.fillStyle = rgba(PAL.cream, 0.75);
    ctx.fillText(Game.asked ? 'Clean sheet — every gate answered correctly.' : 'No questions reached. Run further to meet the gates.', bx, listY + 34 * s);
  } else {
    const rowH = 80 * s;
    const visible = Math.max(1, Math.floor((listH - 20 * s) / rowH));
    const maxScroll = Math.max(0, log.length - visible);
    if (Game.reviewScroll > maxScroll) Game.reviewScroll = 0;
    Game.reviewScroll = clamp(Game.reviewScroll, 0, maxScroll);
    for (let i = 0; i < visible && i + Game.reviewScroll < log.length; i++) {
      const q = QUESTION_BANK[log[i + Game.reviewScroll].idx];
      const ry = listY + 20 * s + i * rowH;
      panel(bx, ry, bw, rowH - 9 * s, 6 * s, rgba(PAL.navy, 0.55), rgba(PAL.cream, 0.08), 1);
      ctx.fillStyle = rgba(PAL.red, 0.9); roundRect(bx, ry, 3.5 * s, rowH - 9 * s, 2 * s); ctx.fill();
      ctx.font = 'italic 600 ' + (13.5 * s) + 'px ' + SERIF;
      ctx.fillStyle = rgba(PAL.cream, 0.92);
      ctx.fillText(clip1(q.q, bw - 30 * s), bx + 14 * s, ry + 16 * s);
      ctx.font = '600 ' + (13 * s) + 'px ' + SANS;
      ctx.fillStyle = PAL.goldLight;
      ctx.fillText(clip1(q.a[q.c], bw - 30 * s), bx + 14 * s, ry + 36 * s);
      ctx.font = '400 ' + (11.5 * s) + 'px ' + SERIF;
      ctx.fillStyle = rgba(PAL.cream, 0.58);
      wrap(q.k, bw - 30 * s).slice(0, 2).forEach((ln, j) => ctx.fillText(ln, bx + 14 * s, ry + 54 * s + j * 14 * s));
    }
    if (maxScroll > 0) {
      ctx.textAlign = 'right'; ctx.font = '400 ' + (10 * s) + 'px ' + SANS;
      ctx.fillStyle = rgba(PAL.cream, 0.45);
      ctx.fillText('↓ / tap below to scroll  ·  ' + (Game.reviewScroll + 1) + '–' +
        Math.min(log.length, Game.reviewScroll + visible) + ' of ' + log.length, bx + bw, listY);
    }
  }

  // restart prompt
  ctx.textAlign = 'center';
  const pulse = 0.6 + 0.4 * Math.sin(Game.gameOverT * 3);
  const again = V.portrait ? 'TAP TO RUN AGAIN' : 'SPACE OR TAP TO RUN AGAIN';
  ctx.font = '600 ' + fitText(again, V.w * 0.86, 13 * s, '600 ', SANS) + 'px ' + SANS;
  ctx.fillStyle = rgba(PAL.goldLight, pulse);
  ctx.fillText(again, cx, V.h - 30 * s);
  const d2 = 'For educational purposes only. Not investment advice.';
  ctx.font = 'italic 400 ' + fitText(d2, V.w * 0.9, 10.5 * s, 'italic 400 ', SERIF) + 'px ' + SERIF;
  ctx.fillStyle = rgba(PAL.cream, 0.35);
  ctx.fillText(d2, cx, V.h - 13 * s);
  ctx.globalAlpha = 1;
}

function drawUI() {
  if (Game.state === 'MENU') { drawMenu(); return; }
  if (Game.state !== 'GAME_OVER') drawHUD();
  if (Game.quiz) drawQuizBanner();
  if (Game.state === 'FEEDBACK') drawFeedbackCard();
  if (Game.state === 'PAUSED') drawPause();
  if (Game.state === 'GAME_OVER') drawGameOver();
}

/* ===========================================================================
   ENGINE — 13. Main loop
   =========================================================================== */
let lastT = 0;
function frame(now) {
  if (!lastT) lastT = now;
  const dt = Math.min((now - lastT) / 1000, 1 / 24);   // delta-time: identical at 60Hz and 120Hz
  lastT = now;

  update(dt);
  updateFlies(dt);

  // no clear needed: the sky and ground fills cover the viewport plus the shake margin
  ctx.save();
  ctx.translate(CAM.shakeX, CAM.shakeY);
  drawWorld();
  ctx.restore();
  drawUI();

  requestAnimationFrame(frame);
}

resize();
Game.reset();
Game.state = 'MENU';
Game.best = parseFloat(Store.get('bullrun.best', '0')) || 0;
requestAnimationFrame(frame);

</script>
